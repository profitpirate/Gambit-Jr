name: E4 V12 causal-entry fresh live confirmation

on:
  push:
    branches:
      - codex/e4-v12-causal-entry-candidate
    paths:
      - "models/e4/e4-v12-causal-entry-model.json"
      - "models/e4/e4-v12-causal-entry-state.json"
      - "src/memecoin_bot/e4_causal_entry_v12.py"
      - "models/e4/e4-v12-causal-entry-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_PIPELINES_BACKGROUND: "false"
  E4_V12_CAUSAL_ENTRY_ENABLED: "true"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_HOLDOUT_PROGRESS_PATH: "artifacts/e4-v12-causal-fresh-progress.json"

concurrency:
  group: e4-v12-causal-fresh-live
  cancel-in-progress: false

jobs:
  fresh-live-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-causal-entry-candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Candidate regression before capture
        run: |
          python -m unittest tests.test_v12_causal_entry_runtime -v
          python -c "import memecoin_bot.e4_exec.__main__; import memecoin_bot.e4_causal_entry_v12 as m; assert m.RUNTIME.active"

      - name: Capture 3000 brand-new Pump launches
        run: |
          mkdir -p artifacts
          python scripts/e4_300_launch_holdout_v12.py \
            --target-launches 3000 \
            --capture-seconds 14400 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 1000 \
            --builder-probes 0 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output artifacts/e4-v12-causal-fresh-batch.json

      - name: Chronologically apply frozen thesis before E4 transactions
        id: validate
        continue-on-error: true
        run: |
          python scripts/e4_v12_live_causal_choice_validate.py \
            --events artifacts/e4-v12-causal-fresh-batch-live-events.jsonl \
            --batch artifacts/e4-v12-causal-fresh-batch.json \
            --model models/e4/e4-v12-causal-entry-model.json \
            --state models/e4/e4-v12-causal-entry-state.json \
            --minimum-intents 5 \
            --output artifacts/e4-v12-causal-fresh-live-result.json

      - name: Persist immutable fresh result
        if: always()
        run: |
          status="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/e4-v12-causal-fresh-live-result.json')
          print(json.loads(p.read_text()).get('status','MISSING_REPORT') if p.exists() else 'MISSING_REPORT')
          PY
          )"
          echo "$status" > artifacts/e4-v12-causal-fresh-status.txt
          mkdir -p models/e4/evidence-epochs/causal-entry
          cp artifacts/e4-v12-causal-fresh-live-result.json \
            "models/e4/evidence-epochs/causal-entry/${GITHUB_RUN_ID}.json" 2>/dev/null || true
          git config user.name 'gambit-v12-evidence'
          git config user.email 'actions@users.noreply.github.com'
          git add models/e4/evidence-epochs/causal-entry || true
          if ! git diff --cached --quiet; then
            git commit -m "data(e4-v12): persist causal-entry fresh live ${status} [skip ci]"
            git push origin HEAD:codex/e4-v12-causal-entry-candidate
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-causal-fresh-${{ github.run_id }}
          path: |
            artifacts/e4-v12-causal-fresh-progress.json
            artifacts/e4-v12-causal-fresh-batch.json
            artifacts/e4-v12-causal-fresh-batch-live-events.jsonl
            artifacts/e4-v12-causal-fresh-live-result.json
            artifacts/e4-v12-causal-fresh-status.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Require genuinely fresh live confirmation
        if: always()
        run: test "$(cat artifacts/e4-v12-causal-fresh-status.txt)" = "FRESH_LIVE_CONFIRMED"
