name: E4 V12 sequential-entry candidate CI

on:
  push:
    branches:
      - codex/e4-v12-causal-entry-candidate
  pull_request:
    branches:
      - codex/e4-v12-selection-reconstruction

permissions:
  contents: read

env:
  E4_V12_SEQUENTIAL_ENTRY_ENABLED: "true"
  E4_PIPELINES_BACKGROUND: "false"

jobs:
  sequential-candidate-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt

      - name: Verify sequential model provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          model=json.loads(Path('models/e4/e4-v12-sequential-entry-model.json').read_text())
          state=json.loads(Path('models/e4/e4-v12-sequential-entry-state.json').read_text())
          assert model['status']=='LIVE_HOLDOUT_CONFIRMED'
          assert model['version']=='e4-v12-sequential-hazard-v1'
          assert state['version']=='e4-v12-causal-runtime-state-v1'
          assert model['model']['kind'] in {'tree_ensemble','logistic'}
          features=model['model']['features']
          assert features
          assert len(features)==len(set(features))
          print(json.dumps({'status':model['status'],'horizon_ms':model['horizon_ms'],'spec':model['spec'],'gate':model['gate'],'state_coverage':state.get('coverage')},indent=2,sort_keys=True))
          PY

      - name: Inherited and sequential regression
        run: |
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python -m unittest tests.test_v12_selection -v
          python -m unittest tests.test_v12_role_model_pipeline -v
          python -m unittest tests.test_v12_evidence_epoch -v
          python -m unittest tests.test_v12_copy_only_evidence -v
          python -m unittest tests.test_v12_copy_fidelity -v
          python -m unittest tests.test_v12_sequential_hazard_runtime -v

      - name: Compile and import production authority
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_copy_fidelity_v12.py \
            src/memecoin_bot/e4_sequential_hazard_v12.py \
            src/memecoin_bot/e4_exec/__main__.py \
            scripts/e4_300_launch_holdout_v12.py \
            scripts/e4_v12_live_sequential_validate.py \
            scripts/e4_v12_causal_choice_pnl_replay.py
          python -c "import memecoin_bot.e4_exec.__main__; import memecoin_bot.e4_sequential_hazard_v12 as m; assert m.RUNTIME.active"
