name: E4 V12 direct-copy CI

on:
  push:
    branches:
      - codex/e4-v12-direct-copy-parameters
  pull_request:
    branches:
      - codex/e4-v12-selection-reconstruction
    paths:
      - "src/memecoin_bot/e4_direct_copy_v12.py"
      - "src/memecoin_bot/e4_exec/__main__.py"
      - "scripts/e4_300_launch_holdout_v12.py"
      - "tests/test_v12_direct_copy.py"
      - ".env.e4.example"
      - "models/e4/e4-v12-evidence-epoch.txt"
      - "models/e4/e4-v12-forward-trigger.txt"
      - ".github/workflows/e4-v12-direct-copy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt

      - name: Existing E4 and V12 regression
        run: |
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python -m unittest tests.test_v12_selection -v
          python -m unittest tests.test_v12_role_model_pipeline -v
          python -m unittest tests.test_v12_evidence_epoch -v

      - name: Direct E4 parameter-copy tests
        run: python -m unittest tests.test_v12_direct_copy -v

      - name: Compile and import permanent V12 production authority
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_direct_copy_v12.py \
            src/memecoin_bot/e4_exec/__main__.py \
            scripts/e4_300_launch_holdout_v12.py
          python -c "import memecoin_bot.e4_exec.__main__"
