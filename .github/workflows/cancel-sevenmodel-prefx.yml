name: Cancel pre-fix seven-model run

on:
  push:
    branches: [codex/golden-sevenmodel-live]
    paths:
      - '.github/workflows/cancel-sevenmodel-prefx.yml'

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel pre-fix active run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/runs/35269925488/cancel || true
