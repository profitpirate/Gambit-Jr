name: E4 V12 sub-10ms transport CI v3

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - "src/memecoin_bot/e4_sub10ms_transport_final_v12.py"
      - "src/memecoin_bot/e4_sub10ms_runtime_final_v12.py"
      - "scripts/e4_v12_sub10ms_benchmark_v4.py"
      - "scripts/e4_300_launch_holdout_v12_sub10ms_v4.py"
      - "tests/test_e4_v12_sub10ms_transport_final.py"
      - ".github/workflows/e4-v12-sub10ms-transport-ci-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_BUILDER_WORKERS: "2"
  E4_BUILDER_RACE_CHILDREN: "4"
  E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
  E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS: "600"

concurrency:
  group: e4-v12-final-transport-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Compile and verify final compatible runtime
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_sub10ms_repairs_v12.py \
            src/memecoin_bot/e4_sub10ms_transport_final_v12.py \
            src/memecoin_bot/e4_sub10ms_runtime_final_v12.py \
            scripts/e4_v12_sub10ms_benchmark.py \
            scripts/e4_v12_sub10ms_benchmark_v4.py \
            scripts/e4_300_launch_holdout_v12_sub10ms_v4.py
          python -m unittest tests.test_e4_v12_true_latency_replay -v
          python -m unittest tests.test_e4_v12_sub10ms_transport_final -v
          python - <<'PY'
          from memecoin_bot import e4_sub10ms_runtime_final_v12 as runtime
          import inspect
          sender=runtime.transport.FinalPersistentRouteSender
          assert callable(getattr(sender,'_session',None))
          assert 'del index' in inspect.getsource(sender._send)
          assert 'warm' in inspect.getsource(runtime.core.Engine.run)
          print('Final V12 transport/runtime API contract verified')
          PY

      - name: Benchmark exact final path
        run: |
          mkdir -p artifacts docs/research
          python scripts/e4_v12_sub10ms_benchmark_v4.py \
            --warmup 100 --probes 1000 \
            --output artifacts/e4-v12-final-transport-benchmark-v3.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/e4-v12-final-transport-benchmark-v3.json').read_text())
          total=data.get('quote_to_route_ack_ms') or {}
          assert data.get('sub10ms_p95_pass') is True, data
          assert float(total.get('p95') or 1e9)<10.0, total
          Path('research/e4-v12-sub10ms-transport-state.txt').write_text('PASS\n')
          Path('docs/research/e4-v12-final-transport-benchmark.json').write_text(json.dumps(data,indent=2,sort_keys=True))
          PY

      - name: Persist final transport proof
        run: |
          git config user.name 'gambit-v12-final-transport'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin codex/e4-v12-sub10ms-entry-research-20260905
          git add docs/research/e4-v12-final-transport-benchmark.json \
            research/e4-v12-sub10ms-transport-state.txt
          if ! git diff --cached --quiet; then
            git commit -m 'perf(e4-v12): certify final compatible transport below 10ms [skip ci]'
            git push origin HEAD:codex/e4-v12-sub10ms-entry-research-20260905
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-final-transport-v3-${{ github.run_id }}
          path: |
            artifacts/e4-v12-final-transport-benchmark-v3.json
            research/e4-v12-sub10ms-transport-state.txt
          if-no-files-found: warn
          retention-days: 30
