name: Pipeline reliability v2 retry

on:
  push:
    branches:
      - fix/discord-pipeline-reliability-v2
    paths:
      - scripts/repair_pipeline_applicator_v2.py
      - scripts/repair_pipeline_applicator_v3.py
      - .github/workflows/pipeline-reliability-v2-retry.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-reliability-v2-retry
  cancel-in-progress: true

jobs:
  apply-audit-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair and apply deterministic patch
        run: |
          python scripts/repair_pipeline_applicator_v2.py
          python scripts/repair_pipeline_applicator_v3.py
          python scripts/apply_pipeline_reliability_v2.py

      - name: Diff sanity
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install validation toolchain
        run: |
          python -m pip install --upgrade pip build pip-audit
          python -m pip install -e '.[dev,research]'

      - name: Targeted E2E and regression
        run: |
          pytest -q \
            tests/test_pipeline_reliability_v2.py \
            tests/test_discord_command_center.py \
            tests/test_discord_response_lifecycle.py \
            tests/test_discord_outbox.py \
            tests/test_candidate_lifecycle.py \
            tests/test_v15_engine.py \
            tests/test_replay.py \
            tests/test_v12_radar_multichain.py

      - name: Authoritative multichain replay diagnostic
        run: |
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from memecoin_bot.replay import ReplayRunner
          from tests.helpers import settings, store, temp_db_path

          async def main() -> None:
              with temp_db_path() as path:
                  config = settings(path)
                  config.public_alerts_enabled = True
                  database = store(path)
                  fixture = Path("fixtures/replay_v12_multichain.json")
                  report = await ReplayRunner(config, database).run(fixture)
                  rows = [
                      dict(row)
                      for row in database.conn.execute(
                          "SELECT t.symbol,t.name,t.chain,c.state,c.reason,"
                          "rd.tier,rd.route_state,rd.decision_reason,"
                          "rd.critical_unknowns_json,rd.supporting_evidence_json,"
                          "rd.contradicting_evidence_json,rd.controls_json "
                          "FROM candidates c JOIN tokens t ON t.id=c.token_id "
                          "LEFT JOIN runner_decisions_v15 rd ON rd.decision_id=("
                          "SELECT rd2.decision_id FROM runner_decisions_v15 rd2 "
                          "WHERE rd2.candidate_id=c.id "
                          "ORDER BY rd2.decision_at DESC,rd2.created_at DESC LIMIT 1) "
                          "ORDER BY t.chain,t.symbol"
                      )
                  ]
                  print(json.dumps({
                      "signals_created": report["signals_created"],
                      "candidates": rows,
                  }, indent=2, default=str))
                  database.close()

          asyncio.run(main())
          PY

      - name: Full regression suite
        run: pytest -q

      - name: Static, dependency and package audit
        run: |
          ruff check .
          python -m build
          python -m pip check
          pip-audit --skip-editable . || pip-audit

      - name: Container build
        run: docker build -t gambit-jr:${{ github.sha }} .

      - name: Isolated staging E2E
        run: |
          cp .env.staging.example .env.staging
          docker compose -f docker-compose.staging.yml config --quiet
          docker compose -f docker-compose.staging.yml up -d --build
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if [ "$attempt" = "40" ]; then
              docker compose -f docker-compose.staging.yml logs
              exit 1
            fi
            sleep 3
          done
          docker compose -f docker-compose.staging.yml exec -T bot-staging \
            gambit-history --warehouse /app/staging/historical/warehouse.db \
            --archive /app/staging/archive coverage
          docker compose -f docker-compose.staging.yml exec -T bot-staging \
            python scripts/staging_acceptance.py \
            --health-url http://127.0.0.1:8080/health \
            --operational /app/staging/operational/memecoin.db \
            --warehouse /app/staging/historical/warehouse.db \
            --approved /app/staging/approved/approved_features.db

      - name: Final audit
        run: |
          git diff --check
          ! git diff -- . ':!*.example' | grep -E '(api[_-]?key|token|secret)[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,}' -i
          ! git diff --name-only | grep -E '(^|/)(\.env|.*\.db|.*\.sqlite|.*\.parquet|provider-probe\.json)$'

      - name: Tear down staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down --remove-orphans || true

      - name: Commit validated implementation
        run: |
          git config user.name "gambit-jr-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/memecoin_bot/database/store.py \
            src/memecoin_bot/discord/bot_runtime.py \
            src/memecoin_bot/discord/command_center.py \
            src/memecoin_bot/discord/product_policy.py \
            src/memecoin_bot/momentum/engine.py \
            src/memecoin_bot/service.py \
            src/memecoin_bot/v15_engine.py \
            tests/test_pipeline_reliability_v2.py
          git commit -m "fix: harden every Discord command and supervise the signal pipeline"
          git push origin HEAD:fix/discord-pipeline-reliability-v2
