name: V12 Brutal Production Certification

on:
  push:
    branches:
      - codex/v12-production-reconcile-20260924
    paths:
      - "src/memecoin_bot/v12_*.py"
      - "src/memecoin_bot/e4_production_guard_v12.py"
      - "src/memecoin_bot/e4_adaptive_exit_v12.py"
      - "src/memecoin_bot/e4_exec/**"
      - "src/memecoin_bot/e4_prod/**"
      - "src/memecoin_bot/v12_vault_signer.py"
      - "Dockerfile.e4-exec"
      - "Dockerfile.e4-prod"
      - "docker-compose.e4-exec.yml"
      - "docker-compose.e4-prod.yml"
      - "scripts/v12_*.py"
      - "tests/test_v12_*.py"
      - ".github/workflows/v12-brutal-production-certification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v12-brutal-production-certification
  cancel-in-progress: true

jobs:
  fault-injection:
    name: fault-injection-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt

      - name: Five isolated critical fault cycles
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          for local_cycle in $(seq 1 5); do
            cycle=$((SHARD * 5 + local_cycle))
            echo "critical cycle=$cycle shard=$SHARD"
            python -m pytest -q \
              tests/test_v12_execution_safety.py \
              tests/test_v12_recovery.py \
              tests/test_v12_watchdogs.py \
              tests/test_v12_security.py \
              tests/test_v12_backup.py \
              tests/test_v12_account_orchestrator.py \
              tests/test_v12_adaptive_exit.py \
              tests/test_v12_stress_runtime.py \
              tests/test_v12_failure_injection_extended.py \
              tests/test_v12_supervisor.py
          done

      - name: Record shard evidence
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p research/fault-shards
          python - <<'PY'
          import json, os, time
          shard=int(os.environ["SHARD"])
          payload={
            "shard": shard,
            "cycle_start": shard*5+1,
            "cycle_end": shard*5+5,
            "cycles": 5,
            "status": "PASS",
            "completed_ns": time.time_ns(),
          }
          path=f"research/fault-shards/shard-{shard}.json"
          open(path,"w").write(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v12-fault-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: research/fault-shards/shard-${{ matrix.shard }}.json
          retention-days: 30

  brutal:
    needs: fault-injection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt

      - name: Large restart and duplicate soak
        run: |
          mkdir -p research
          python scripts/v15_load_soak.py \
            --events 100000 \
            --queue-size 512 \
            --burst-multiplier 5 \
            > research/v12-load-soak-100k.json

      - name: 1M decision-pipeline stress
        run: |
          python scripts/e4_v10_pipeline_stress.py \
            --iterations 1000000 \
            --workers 16 \
            --narrative-iterations 250000 \
            --output research/v12-production-pipeline-stress.json

      - name: Existing E4 stress hardening and convergence E2E
        run: |
          python -m pytest -q \
            tests/test_e4_stress_hardening.py \
            tests/test_v15_load_soak.py \
            tests/test_v15_convergence_e2e.py

      - name: Full V12 production regression pass
        run: |
          python -m pytest -q \
            tests/test_v12_*.py \
            tests/test_e4_v12_sub10ms_repairs.py \
            tests/test_e4_v12_sub10ms_transport.py \
            tests/test_e4_v12_sub10ms_transport_final.py

      - name: Builder production self-test
        working-directory: tools/e4-builder
        run: |
          npm ci --omit=dev
          node --check race-proxy-v3.mjs
          node --check strict-race-proxy-v12.mjs
          node --check fast-preload-v4.mjs
          node race-proxy-v3.mjs --self-test

      - name: Write certification result
        run: |
          python - <<'PY'
          import json,time
          payload={
            "version":"v12-brutal-production-certification-v2",
            "status":"PASS",
            "critical_fault_cycles":40,
            "fault_shards":8,
            "cycles_per_shard":5,
            "load_soak_events":100000,
            "load_soak_burst_multiplier":5,
            "pipeline_stress_iterations":1000000,
            "narrative_stress_iterations":250000,
            "full_v12_regression_passed":True,
            "builder_self_test_passed":True,
            "completed_ns":time.time_ns(),
          }
          open("research/v12-brutal-production-certification.json","w").write(
            json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          PY

      - name: Persist certification evidence
        run: |
          git config user.name 'gambit-v12-brutal-cert'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            research/v12-brutal-production-certification.json \
            research/v12-production-pipeline-stress.json
          if ! git diff --cached --quiet; then
            git commit -m 'cert(v12): pass brutal production stress and E2E [skip ci]'
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin codex/v12-production-reconcile-20260924 && git push origin HEAD:codex/v12-production-reconcile-20260924; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            test "$pushed" = true
          fi

# definitive-current-head-brutal
# 40-cycle fault matrix + million-cycle production certification
