name: E4 V12 V11 untouched forward capture

on:
  push:
    branches:
      - codex/e4-v12-relative-price-capped-actor-v11
    paths:
      - ".github/workflows/e4-v12-relative-price-capped-actor-forward.yml"
      - "artifacts/e4-v12-relative-price-capped-actor-forward-trigger.txt"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_HOLDOUT_PROGRESS_PATH: "artifacts/e4-v12-v11-forward-progress.json"

concurrency:
  group: e4-v12-v11-untouched-forward-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-relative-price-capped-actor-v11
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install capture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-e4.txt
          npm --prefix tools/e4-builder install --omit=dev

      - name: Verify the frozen V11 evidence contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "artifacts/e4-v12-relative-price-capped-actor-holdout-protocol.json"
              ).read_text(encoding="utf-8")
          )
          frozen_path = Path(protocol["frozen_candidate"]["path"])
          digest = hashlib.sha256(
              frozen_path.read_bytes().replace(b"\r\n", b"\n")
          ).hexdigest()
          assert digest == protocol["frozen_candidate"]["sha256_lf"]
          assert protocol["final_evidence_contract"]["required_capture_windows"] == 10
          assert protocol["final_evidence_contract"]["optional_stopping_allowed"] is False
          assert protocol["result_policy"]["production_deployment_authorised"] is False
          assert protocol["result_policy"]["production_paths_changed"] == 0
          print("frozen V11 contract verified", protocol["experiment_id"])
          PY

      - name: Compile the read-only capture harness
        run: |
          python -m compileall -q \
            scripts/e4_300_launch_holdout_v12.py \
            scripts/e4_v12_relative_price_capped_actor.py
          node --check tools/e4-builder/race-proxy-v3.mjs
          node --check tools/e4-builder/fast-preload-v4.mjs

      - name: Capture exactly 3000 fresh Pump launches
        run: |
          mkdir -p artifacts
          python scripts/e4_300_launch_holdout_v12.py \
            --target-launches 3000 \
            --capture-seconds 16200 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 1000 \
            --builder-probes 0 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output artifacts/e4-v12-v11-forward-batch.json

      - name: Verify the captured evidence envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(
              Path("artifacts/e4-v12-v11-forward-batch.json").read_text(
                  encoding="utf-8"
              )
          )
          assert batch["capture"]["unique_launches"] == 3000
          assert batch["capture"]["target_reached"] is True
          assert batch["capture"]["errors"] == []
          assert batch["mainnet_transactions_sent"] == 0
          assert batch["mainnet_funds_risked_sol"] == 0
          assert Path("artifacts/e4-v12-v11-forward-batch-live-events.jsonl").is_file()
          print("fresh V11 evidence envelope verified")
          PY

      - name: Upload immutable untouched capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-v12-v11-forward-${{ github.run_id }}
          path: |
            artifacts/e4-v12-v11-forward-progress.json
            artifacts/e4-v12-v11-forward-batch.json
            artifacts/e4-v12-v11-forward-batch.md
            artifacts/e4-v12-v11-forward-batch-live-events.jsonl
          if-no-files-found: error
          retention-days: 30
