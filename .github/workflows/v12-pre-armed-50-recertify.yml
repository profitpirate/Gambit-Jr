name: V12 Pre-Armed 50-trade recertification

on:
  push:
    branches:
      - codex/e4-v12-flow-survival-hazard-v12
    paths:
      - ".github/workflows/v12-pre-armed-50-recertify.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: v12-pre-armed-50-recertification
  cancel-in-progress: true

jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-flow-survival-hazard-v12
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt

      - name: Verify corrected replay contract
        run: |
          python -m pytest tests/test_e4_v12_axiom_paper_live.py -q
          ruff check scripts/e4_v12_axiom_paper_live.py tests/test_e4_v12_axiom_paper_live.py

      - name: Preserve pre-fix locked result
        run: |
          cp research/v12-pre-armed-50-trade-results.json research/v12-pre-armed-50-trade-results-pre-exit-chronology-fix.json
          cp research/v12-pre-armed-50-trade-results.md research/v12-pre-armed-50-trade-results-pre-exit-chronology-fix.md

      - name: Download every immutable source window
        run: |
          mkdir -p replay artifacts
          jq -r '.processed_runs[]' research/v12-pre-armed-50-trade-results-pre-exit-chronology-fix.json > /tmp/run_ids
          : > /tmp/pairs.tsv
          while read -r run_id; do
            mkdir -p "replay/$run_id"
            gh run download "$run_id" \
              --repo "$REPO" \
              --name "e4-v12-prearmed-axiom-live-$run_id" \
              --dir "replay/$run_id"
            batch="$(find "replay/$run_id" -name 'e4-v12-prearmed-live-batch.json' -print -quit)"
            events="$(find "replay/$run_id" -name 'e4-v12-prearmed-live-batch-live-events.jsonl' -print -quit)"
            cache="$(find "replay/$run_id" -name 'e4-v12-paper-live-metadata-cache.json' -print -quit)"
            test -s "$batch"
            test -s "$events"
            printf '%s\t%s\t%s\t%s\n' "$run_id" "$batch" "$events" "$cache" >> /tmp/pairs.tsv
          done < /tmp/run_ids

      - name: Replay corrected chronology from zero
        run: |
          set -- python scripts/e4_v12_axiom_paper_live.py \
            --model research/v12-pre-armed-50-trade-frozen-model.json \
            --state artifacts/v12-pre-armed-50-replayed.json \
            --report artifacts/v12-pre-armed-50-replayed.md
          while IFS=$'\t' read -r run_id batch events cache; do
            set -- "$@" --pair "$run_id=$batch::$events"
            if [ -n "$cache" ] && [ -s "$cache" ]; then
              set -- "$@" --metadata-cache "$cache"
            fi
          done < /tmp/pairs.tsv
          "$@"

      - name: Validate recertified sample and produce delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old_path = Path("research/v12-pre-armed-50-trade-results-pre-exit-chronology-fix.json")
          new_path = Path("artifacts/v12-pre-armed-50-replayed.json")
          old = json.loads(old_path.read_text())
          new = json.loads(new_path.read_text())

          assert new["completion"]["reached"] is True
          assert new["completion"]["required_closed_trades"] == 50
          assert len(new["ledger"]) == 50
          assert new["model_sha256"] == old["model_sha256"]

          impossible = [
              {
                  "run_id": row["run_id"],
                  "mint": row["mint"],
                  "fill_ns": row["fill_ns"],
                  "exit_ns": row["exit_ns"],
              }
              for row in new["ledger"]
              if int(row["exit_ns"]) < int(row["fill_ns"])
          ]
          assert not impossible, impossible

          old_metrics = old["metrics"]
          new_metrics = new["metrics"]
          metric_keys = (
              "closed_trades",
              "wins",
              "losses",
              "win_rate",
              "wilson_lower_bound",
              "net_pnl_sol",
              "profit_factor",
              "maximum_closed_equity_drawdown_fraction",
              "capture_windows",
              "acceptance_gate_passed",
          )
          delta = {}
          for key in metric_keys:
              before = old_metrics.get(key)
              after = new_metrics.get(key)
              change = (
                  after - before
                  if isinstance(before, (int, float))
                  and isinstance(after, (int, float))
                  else None
              )
              delta[key] = {"before": before, "after": after, "delta": change}

          old_index = {
              (row["run_id"], row["mint"]): row for row in old["ledger"]
          }
          changed_trades = []
          for row in new["ledger"]:
              prior = old_index.get((row["run_id"], row["mint"]))
              if prior is None:
                  changed_trades.append(
                      {
                          "run_id": row["run_id"],
                          "mint": row["mint"],
                          "change": "NEW_OR_REORDERED",
                      }
                  )
                  continue
              fields = {}
              for field in (
                  "entry_cost_sol",
                  "proceeds_sol",
                  "pnl_sol",
                  "fill_ns",
                  "exit_ns",
                  "exit_reason",
              ):
                  if prior.get(field) != row.get(field):
                      fields[field] = {
                          "before": prior.get(field),
                          "after": row.get(field),
                      }
              if fields:
                  changed_trades.append(
                      {
                          "run_id": row["run_id"],
                          "mint": row["mint"],
                          "fields": fields,
                      }
                  )

          report = {
              "version": "v12-pre-armed-50-recertification-v1",
              "reason": "pre-fill exit chronology bug",
              "source_model_sha256": new["model_sha256"],
              "source_windows": new["processed_runs"],
              "old_metrics": old_metrics,
              "new_metrics": new_metrics,
              "metric_delta": delta,
              "changed_trades": changed_trades,
              "impossible_exit_count_after": 0,
              "recertified_gate_passed": bool(
                  new_metrics.get("acceptance_gate_passed")
              ),
          }

          Path("research/v12-pre-armed-50-trade-recertification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          Path("research/v12-pre-armed-50-trade-results.json").write_text(
              json.dumps(new, indent=2, sort_keys=True) + "\n"
          )
          Path("research/v12-pre-armed-50-trade-results.md").write_text(
              Path("artifacts/v12-pre-armed-50-replayed.md").read_text()
          )

          print(
              json.dumps(
                  {
                      "recertified_gate_passed": report[
                          "recertified_gate_passed"
                      ],
                      "changed_trades": len(changed_trades),
                      "old_net_pnl": old_metrics["net_pnl_sol"],
                      "new_net_pnl": new_metrics["net_pnl_sol"],
                      "old_win_rate": old_metrics["win_rate"],
                      "new_win_rate": new_metrics["win_rate"],
                  },
                  indent=2,
              )
          )
          PY

      - name: Commit recertified baseline and archive
        run: |
          git config user.name 'gambit-v12-recertification'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            research/v12-pre-armed-50-trade-results.json \
            research/v12-pre-armed-50-trade-results.md \
            research/v12-pre-armed-50-trade-results-pre-exit-chronology-fix.json \
            research/v12-pre-armed-50-trade-results-pre-exit-chronology-fix.md \
            research/v12-pre-armed-50-trade-recertification.json
          git commit -m 'research(v12): recertify 50-trade baseline after chronology fix [skip ci]'
          git pull --rebase origin codex/e4-v12-flow-survival-hazard-v12
          git push origin HEAD:codex/e4-v12-flow-survival-hazard-v12

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-pre-armed-50-recertification-${{ github.run_id }}
          path: |
            artifacts/v12-pre-armed-50-replayed.json
            artifacts/v12-pre-armed-50-replayed.md
            research/v12-pre-armed-50-trade-recertification.json
          if-no-files-found: warn
          retention-days: 90
