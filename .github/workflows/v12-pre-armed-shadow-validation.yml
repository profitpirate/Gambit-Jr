name: V12 Pre-Armed shadow validation

on:
  push:
    branches:
      - codex/e4-v12-flow-survival-hazard-v12
    paths:
      - ".github/workflows/v12-pre-armed-shadow-validation.yml"
      - "scripts/v12_prearmed_shadow_suite.py"
      - "scripts/e4_v12_axiom_paper_live.py"
      - "tests/test_v12_prearmed_shadow_suite.py"
      - "scripts/v12_prearmed_guardrail_policy.py"
      - "tests/test_v12_prearmed_guardrail_policy.py"
      - "tests/test_e4_v12_axiom_paper_live.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-pre-armed-shadow-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt

      - name: Compile
        run: |
          python -m compileall -q \
            scripts/v12_prearmed_shadow_suite.py \
            scripts/v12_prearmed_guardrail_policy.py \
            scripts/e4_v12_axiom_paper_live.py \
            tests/test_v12_prearmed_shadow_suite.py \
            tests/test_v12_prearmed_guardrail_policy.py \
            tests/test_v12_prearmed_guardrail_policy.py \
            tests/test_e4_v12_axiom_paper_live.py

      - name: Static analysis
        run: |
          ruff check \
            scripts/v12_prearmed_shadow_suite.py \
            scripts/e4_v12_axiom_paper_live.py \
            tests/test_v12_prearmed_shadow_suite.py \
            tests/test_e4_v12_axiom_paper_live.py

      - name: Unit and contract tests
        run: |
          python -m pytest \
            tests/test_v12_prearmed_shadow_suite.py \
            tests/test_v12_prearmed_guardrail_policy.py \
            tests/test_e4_v12_axiom_paper_live.py -q
