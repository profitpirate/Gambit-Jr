name: E4 V12 newest live metadata probe

on:
  push:
    branches:
      - codex/e4-v12-matched-controls
    paths:
      - "scripts/e4_v12_latest_metadata_probe.py"
      - ".github/workflows/e4-v12-latest-metadata-probe.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip aiohttp
      - run: python -m py_compile scripts/e4_v12_latest_metadata_probe.py
      - name: Download newest completed live 3000-launch sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts
          gh run download 33897368379 \
            --repo profitpirate/Gambit-Jr \
            --name e4-v12-forward-33897368379 \
            --dir source
      - name: Fetch immutable metadata linked by every captured launch
        run: |
          python scripts/e4_v12_latest_metadata_probe.py \
            --events source/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --output artifacts/e4-v12-latest-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: e4-v12-latest-metadata-${{ github.run_id }}
          path: artifacts/e4-v12-latest-metadata.json
          retention-days: 30
