name: E4 stress hardening

on:
  push:
    branches:
      - codex/gambit-jr-v2-e4-stress-hardening
  workflow_dispatch:


permissions:
  contents: read

jobs:
  stress-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - name: Existing E4 regression and real-market rapid-path suite
        run: python -m unittest discover -s tests -p "test_e4*.py" -v
      - name: V8 identity-first entry checks
        run: python tests/e4_v8_identity_checks.py -v
      - name: Compile hardened runtime and live forensics
        run: >-
          python -m compileall -q
          src/memecoin_bot/e4_hardening.py
          src/memecoin_bot/e4_hardening_v2.py
          src/memecoin_bot/e4_hardening_v3.py
          src/memecoin_bot/e4_hardening_v4.py
          src/memecoin_bot/e4_hardening_v5.py
          src/memecoin_bot/e4_hardening_v6.py
          src/memecoin_bot/e4_hardening_v7.py
          src/memecoin_bot/e4_hardening_v8.py
          src/memecoin_bot/e4_hardening_v9.py
          src/memecoin_bot/e4_exec
          scripts/e4_selection_forensics.py
          scripts/e4_build_winner_creator_registry.py
          scripts/e4_creator_expectancy.py
          scripts/e4_identity_graph.py
          scripts/e4_300_launch_holdout_v8.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - name: Validate local Pump builder syntax and offline instruction construction
        working-directory: tools/e4-builder
        run: |
          node --check daemon.mjs
          node --check daemon-v2.mjs
          E4_REMOTE_BUILDER_FALLBACK=false node daemon-v2.mjs --self-test
      - name: Production container build
        run: docker build -f Dockerfile.e4-exec -t gambit-jr-e4:stress .
