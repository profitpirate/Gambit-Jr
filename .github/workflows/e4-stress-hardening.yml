name: E4 stress hardening

on:
  push:
    branches:
      - codex/gambit-jr-v2-e4-stress-hardening
      - codex/gambit-jr-v2-e4-v6-certification
  workflow_dispatch:

jobs:
  stress-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - name: Existing E4 regression and V6 empirical suite
        run: python -m unittest discover -s tests -p "test_e4*.py" -v
      - name: Compile hardened runtime and live forensics
        run: >-
          python -m compileall -q
          src/memecoin_bot/e4_hardening.py
          src/memecoin_bot/e4_hardening_v2.py
          src/memecoin_bot/e4_hardening_v3.py
          src/memecoin_bot/e4_hardening_v4.py
          src/memecoin_bot/e4_hardening_v5.py
          src/memecoin_bot/e4_hardening_v6.py
          src/memecoin_bot/e4_exec
          scripts/e4_selection_forensics.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - working-directory: tools/e4-builder
        run: node --check daemon.mjs
      - name: Production container build
        run: docker build -f Dockerfile.e4-exec -t gambit-jr-e4:v6 .
