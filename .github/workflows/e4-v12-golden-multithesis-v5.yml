name: E4 V12 golden multi-thesis v5

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - "scripts/e4_v12_recurrence_shape_search.py"
      - "scripts/e4_v12_recurrence_shape_search_v2.py"
      - "scripts/e4_v12_recurrence_shape_apply.py"
      - ".github/workflows/e4-v12-golden-multithesis-v5.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  RESEARCH_BRANCH: codex/e4-v12-sub10ms-entry-research-20260905
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_BUILDER_WORKERS: "2"
  E4_BUILDER_RACE_CHILDREN: "4"
  E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
  E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS: "600"

concurrency:
  group: e4-v12-golden-sub10ms-v2
  cancel-in-progress: true

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    outputs:
      speed_outcome: ${{ steps.speed.outcome }}
      selector_outcome: ${{ steps.selector.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Compile and regression-test repaired V12
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_e4_v12_sub10ms_repairs.py')
          text=path.read_text()
          if 'from pathlib import Path' not in text:
              text=text.replace('import os\n', 'import os\nfrom pathlib import Path\n')
          text=text.replace(
              'return core.E4Policy(SimpleNamespace(model_path=None))',
              "return core.E4Policy(core.Settings(model_path=Path('missing-model.json')))"
          )
          path.write_text(text)
          PY
          python -m compileall -q \
            src/memecoin_bot/e4_sub10ms_repairs_v12.py \
            scripts/e4_v12_true_latency_replay.py \
            scripts/e4_v12_golden_thesis_search_v2.py \
            scripts/e4_v12_golden_thesis_search_v3.py \
            scripts/e4_v12_golden_thesis_search_v4.py \
            scripts/e4_v12_reactive_output_guard_search.py \
            scripts/e4_v12_reactive_output_guard_apply.py \
            scripts/e4_v12_recurrence_shape_search.py \
            scripts/e4_v12_recurrence_shape_search_v2.py \
            scripts/e4_v12_recurrence_shape_apply.py \
            scripts/e4_v12_sub10ms_benchmark.py \
            scripts/e4_300_launch_holdout_v12_sub10ms.py
          python -m unittest tests.test_e4_v12_true_latency_replay -v
          python -m unittest tests.test_e4_v12_sub10ms_repairs -v
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python - <<'PY'
          from pathlib import Path
          replay=Path('scripts/e4_v12_true_latency_replay.py').read_text()
          assert 'hypothetical_scenarios' not in replay
          assert 'BuyExactSolIn minimum-token floor' in replay
          entry=Path('src/memecoin_bot/e4_exec/__main__.py').read_text()
          assert 'e4_sub10ms_repairs_v12' in entry
          assert 'E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS' in entry
          repair=Path('src/memecoin_bot/e4_sub10ms_repairs_v12.py').read_text()
          assert '_DEFAULT_MAX_OUTPUT_SHORTFALL_BPS = 600' in repair
          assert 'FastPersistentRouteSender' in repair
          print('Repaired V12 invariant gate passed')
          PY

      - name: Enforce sub-10ms internal quote-to-route path
        id: speed
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/e4_v12_sub10ms_benchmark.py \
            --warmup 50 --probes 300 \
            --output artifacts/e4-v12-sub10ms-benchmark.json

      - name: Download ten chronological immutable launch windows
        run: |
          mkdir -p historical
          : > /tmp/pairs.bin
          for run_id in \
            33792881280 33810753028 33822988156 33835575805 33852482054 \
            33876345997 33897368379 33911477030 33920757002 33931301493
          do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            test -s "$batch"; test -s "$events"
            printf '%s\0%s\0%s\0' "$run_id" "$batch" "$events" >> /tmp/pairs.bin
          done

      - name: Search pre-impact profitable-intent thesis
        id: preimpact
        continue-on-error: true
        run: |
          PAIRS=()
          while IFS= read -r -d '' run_id && IFS= read -r -d '' batch && IFS= read -r -d '' events; do
            PAIRS+=(--pair "$run_id=$batch:$events")
          done < /tmp/pairs.bin
          python scripts/e4_v12_golden_thesis_search_v4.py \
            --mode search "${PAIRS[@]}" \
            --horizon-ms 1500 --minimum-lead-ms 12 \
            --latencies-ms 0,1,2,5,10 \
            --model-output artifacts/e4-v12-golden-preimpact-model.joblib \
            --output artifacts/e4-v12-golden-preimpact.json

      - name: Search E4-confirmed strict-output thesis
        id: reactive
        continue-on-error: true
        run: |
          PAIRS=()
          while IFS= read -r -d '' run_id && IFS= read -r -d '' batch && IFS= read -r -d '' events; do
            PAIRS+=(--pair "$run_id=$batch:$events")
          done < /tmp/pairs.bin
          python scripts/e4_v12_reactive_output_guard_search.py \
            "${PAIRS[@]}" --latencies-ms 0,1,2,5,10 \
            --output artifacts/e4-v12-golden-reactive.json

      - name: Search exact creator-buyer-shape recurrence thesis
        id: recurrence
        continue-on-error: true
        run: |
          PAIRS=()
          while IFS= read -r -d '' run_id && IFS= read -r -d '' batch && IFS= read -r -d '' events; do
            PAIRS+=(--pair "$run_id=$batch:$events")
          done < /tmp/pairs.bin
          python scripts/e4_v12_recurrence_shape_search_v2.py \
            "${PAIRS[@]}" --latencies-ms 0,1,2,5,10 \
            --output artifacts/e4-v12-golden-recurrence.json

      - name: Select only a historically confirmed family
        id: selector
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates=[]
          def read(name):
              path=Path('artifacts')/name
              return json.loads(path.read_text()) if path.exists() else {}
          def score_grid(grid):
              rows=list((grid or {}).values())
              if not rows:return (0.0,0.0,0.0,0.0,0)
              return (
                  min(float(row.get('win_rate') or 0) for row in rows),
                  min(float(row.get('wilson_low') or 0) for row in rows),
                  min(float(row.get('profit_factor') or 0) for row in rows),
                  sum(float(row.get('net_pnl_sol') or 0) for row in rows),
                  min(int(row.get('closed') or 0) for row in rows),
              )
          definitions=(
              ('PREIMPACT','e4-v12-golden-preimpact.json','historical_holdout_economics'),
              ('REACTIVE_OUTPUT_GUARD','e4-v12-golden-reactive.json','historical_holdout'),
              ('RECURRENCE_SHAPE','e4-v12-golden-recurrence.json','historical_holdout'),
          )
          reports={}
          for family,name,key in definitions:
              report=read(name)
              reports[family]=report.get('status','NOT_PRODUCED')
              if report.get('status')=='HISTORICAL_GOLDEN_CONFIRMED':
                  candidates.append((score_grid(report.get(key)),family,name))
          candidates.sort(key=lambda item:item[0],reverse=True)
          selector={
              'version':'e4-v12-golden-selector-v5',
              'status':'HISTORICAL_GOLDEN_CONFIRMED' if candidates else 'NOT_CONCLUSIVE',
              'family_statuses':reports,
              'selected_family':candidates[0][1] if candidates else None,
              'selected_report':candidates[0][2] if candidates else None,
              'score':list(candidates[0][0]) if candidates else None,
              'qualified_families':[item[1] for item in candidates],
          }
          Path('artifacts/e4-v12-golden-selector.json').write_text(json.dumps(selector,indent=2,sort_keys=True))
          print(json.dumps(selector,indent=2,sort_keys=True))
          if not candidates: raise SystemExit(1)
          PY

      - name: Persist truthful historical status
        if: always()
        env:
          SPEED_OUTCOME: ${{ steps.speed.outcome }}
          PREIMPACT_OUTCOME: ${{ steps.preimpact.outcome }}
          REACTIVE_OUTCOME: ${{ steps.reactive.outcome }}
          RECURRENCE_OUTCOME: ${{ steps.recurrence.outcome }}
          SELECTOR_OUTCOME: ${{ steps.selector.outcome }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/research models/e4/research
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          def read(name):
              path=Path('artifacts')/name
              return json.loads(path.read_text()) if path.exists() else {}
          speed=read('e4-v12-sub10ms-benchmark.json')
          pre=read('e4-v12-golden-preimpact.json')
          reactive=read('e4-v12-golden-reactive.json')
          recurrence=read('e4-v12-golden-recurrence.json')
          selector=read('e4-v12-golden-selector.json')
          status={
              'version':'e4-v12-golden-multithesis-status-v5',
              'workflow_run':os.environ['RUN_ID'],
              'head_sha':os.environ['HEAD_SHA'],
              'steps':{
                  'speed':os.environ.get('SPEED_OUTCOME'),
                  'preimpact':os.environ.get('PREIMPACT_OUTCOME'),
                  'reactive':os.environ.get('REACTIVE_OUTCOME'),
                  'recurrence':os.environ.get('RECURRENCE_OUTCOME'),
                  'selector':os.environ.get('SELECTOR_OUTCOME'),
              },
              'sub10ms_pass':bool(speed.get('sub10ms_p95_pass')),
              'quote_to_route_ack_ms':speed.get('quote_to_route_ack_ms'),
              'family_statuses':{
                  'PREIMPACT':pre.get('status','NOT_PRODUCED'),
                  'REACTIVE_OUTPUT_GUARD':reactive.get('status','NOT_PRODUCED'),
                  'RECURRENCE_SHAPE':recurrence.get('status','NOT_PRODUCED'),
              },
              'selector':selector,
              'ready_for_fresh_live':bool(speed.get('sub10ms_p95_pass') and selector.get('status')=='HISTORICAL_GOLDEN_CONFIRMED'),
          }
          Path('docs/research/e4-v12-golden-current-status.json').write_text(json.dumps(status,indent=2,sort_keys=True))
          for name in (
              'e4-v12-sub10ms-benchmark.json','e4-v12-golden-preimpact.json',
              'e4-v12-golden-reactive.json','e4-v12-golden-recurrence.json',
              'e4-v12-golden-selector.json',
          ):
              source=Path('artifacts')/name
              if source.exists():shutil.copyfile(source,Path('docs/research')/name)
          model=Path('artifacts/e4-v12-golden-preimpact-model.joblib')
          if model.exists() and pre.get('status')=='HISTORICAL_GOLDEN_CONFIRMED':
              shutil.copyfile(model,'models/e4/research/e4-v12-golden-preimpact-model.joblib')
          print(json.dumps(status,indent=2,sort_keys=True))
          PY
          git config user.name 'gambit-v12-golden-research'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$RESEARCH_BRANCH"
          git add docs/research models/e4/research 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'research(e4-v12): persist v5 historical qualification [skip ci]'
            git push origin HEAD:"$RESEARCH_BRANCH"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-v5-${{ github.run_id }}
          path: |
            artifacts/e4-v12-sub10ms-benchmark.json
            artifacts/e4-v12-golden-preimpact.json
            artifacts/e4-v12-golden-preimpact-model.joblib
            artifacts/e4-v12-golden-reactive.json
            artifacts/e4-v12-golden-recurrence.json
            artifacts/e4-v12-golden-selector.json
            docs/research/e4-v12-golden-current-status.json
          if-no-files-found: warn
          retention-days: 30

  untouched-live:
    needs: historical
    if: needs.historical.outputs.speed_outcome == 'success' && needs.historical.outputs.selector_outcome == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-golden-v5-${{ github.run_id }}
          path: frozen

      - name: Rehydrate exact historical state
        run: |
          mkdir -p historical
          : > /tmp/pairs.bin
          for run_id in \
            33792881280 33810753028 33822988156 33835575805 33852482054 \
            33876345997 33897368379 33911477030 33920757002 33931301493
          do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            printf '%s\0%s\0%s\0' "$run_id" "$batch" "$events" >> /tmp/pairs.bin
          done

      - name: Capture a completely untouched 3000-launch window
        run: |
          mkdir -p live artifacts
          export E4_HOLDOUT_PROGRESS_PATH=live/e4-v12-golden-progress.json
          python scripts/e4_300_launch_holdout_v12_sub10ms.py \
            --target-launches 3000 --capture-seconds 14400 --tail-seconds 300 \
            --heartbeat-seconds 60 --minimum-launches 3000 \
            --wallet-signatures 1200 --builder-probes 0 \
            --testnet-route-probes 0 --stress-iterations 0 \
            --output live/e4-v12-golden-live-batch.json

      - name: Apply exact frozen selected family at every 0-10ms latency
        run: |
          PAIRS=()
          while IFS= read -r -d '' run_id && IFS= read -r -d '' batch && IFS= read -r -d '' events; do
            PAIRS+=(--pair "$run_id=$batch:$events")
          done < /tmp/pairs.bin
          LIVE_PAIR="${GITHUB_RUN_ID}=live/e4-v12-golden-live-batch.json:live/e4-v12-golden-live-batch-live-events.jsonl"
          family="$(python -c "import json;print(json.load(open('frozen/e4-v12-golden-selector.json'))['selected_family'])")"
          case "$family" in
            PREIMPACT)
              python scripts/e4_v12_golden_thesis_search_v4.py \
                --mode apply "${PAIRS[@]}" --pair "$LIVE_PAIR" \
                --minimum-live-trades 3 \
                --model-input frozen/e4-v12-golden-preimpact-model.joblib \
                --output artifacts/e4-v12-golden-fresh-live.json
              ;;
            REACTIVE_OUTPUT_GUARD)
              python scripts/e4_v12_reactive_output_guard_apply.py \
                "${PAIRS[@]}" --pair "$LIVE_PAIR" \
                --minimum-live-trades 3 --latencies-ms 0,1,2,5,10 \
                --rule frozen/e4-v12-golden-reactive.json \
                --output artifacts/e4-v12-golden-fresh-live.json
              ;;
            RECURRENCE_SHAPE)
              python scripts/e4_v12_recurrence_shape_apply.py \
                "${PAIRS[@]}" --pair "$LIVE_PAIR" \
                --minimum-live-trades 3 --latencies-ms 0,1,2,5,10 \
                --rule frozen/e4-v12-golden-recurrence.json \
                --output artifacts/e4-v12-golden-fresh-live.json
              ;;
            *) echo "Unknown selected family: $family" >&2; exit 1 ;;
          esac

      - name: Persist untouched-live proof only after the gate passes
        run: |
          mkdir -p docs/research
          cp artifacts/e4-v12-golden-fresh-live.json docs/research/e4-v12-golden-fresh-live.json
          git config user.name 'gambit-v12-golden-research'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$RESEARCH_BRANCH"
          git add docs/research/e4-v12-golden-fresh-live.json
          git commit -m 'research(e4-v12): persist untouched live golden proof [skip ci]'
          git push origin HEAD:"$RESEARCH_BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-v5-live-${{ github.run_id }}
          path: |
            live/e4-v12-golden-progress.json
            live/e4-v12-golden-live-batch.json
            live/e4-v12-golden-live-batch-live-events.jsonl
            artifacts/e4-v12-golden-fresh-live.json
          if-no-files-found: warn
          retention-days: 30
