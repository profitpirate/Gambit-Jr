name: E4 creator and launch-source forensics

on:
  workflow_dispatch:
    inputs:
      signatures:
        description: E4 wallet signatures to inspect
        required: false
        default: "1000"
      positions:
        description: Unique E4 entries to enrich
        required: false
        default: "120"
  push:
    branches:
      - codex/gambit-jr-v2-e4-v6-certification
    paths:
      - "scripts/e4_creator_forensics.py"
      - "scripts/e4_build_identity_cache.py"
      - ".github/workflows/e4-creator-forensics.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  creator-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile bounded forensic harnesses
        run: python -m py_compile scripts/e4_creator_forensics.py scripts/e4_build_identity_cache.py
      - name: Inspect creators, metadata sources and pre-entry public flow
        env:
          SIGNATURES: ${{ github.event.inputs.signatures || '1000' }}
          POSITIONS: ${{ github.event.inputs.positions || '120' }}
        run: >-
          python scripts/e4_creator_forensics.py
          --signatures "$SIGNATURES"
          --positions "$POSITIONS"
          --before-limit 25
          --concurrency 12
          --timeout 6
          --output artifacts/e4-creator-forensics.json
      - name: Build conservative creator affinity cache
        if: success()
        run: >-
          python scripts/e4_build_identity_cache.py
          --input artifacts/e4-creator-forensics.json
          --output artifacts/e4-creator-affinity-analysis.json
          --cache-output artifacts/creator-profiles.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-creator-forensics-${{ github.run_id }}
          path: |
            artifacts/e4-creator-forensics.json
            artifacts/e4-creator-affinity-analysis.json
            artifacts/creator-profiles.json
          if-no-files-found: warn
          retention-days: 30
