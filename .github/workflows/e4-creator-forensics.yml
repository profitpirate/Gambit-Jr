name: E4 creator and launch-source forensics

on:
  workflow_dispatch:
    inputs:
      signatures:
        description: E4 wallet signatures to inspect
        required: false
        default: "300"
      positions:
        description: Unique E4 entries to enrich
        required: false
        default: "30"
  push:
    branches:
      - codex/gambit-jr-v2-e4-stress-hardening
    paths:
      - "scripts/e4_creator_forensics.py"
      - ".github/workflows/e4-creator-forensics.yml"

permissions:
  contents: read

jobs:
  creator-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile bounded forensic harness
        run: python -m py_compile scripts/e4_creator_forensics.py
      - name: Inspect creators, metadata sources and pre-entry public flow
        env:
          SIGNATURES: ${{ github.event.inputs.signatures || '300' }}
          POSITIONS: ${{ github.event.inputs.positions || '30' }}
        run: >-
          python scripts/e4_creator_forensics.py
          --signatures "$SIGNATURES"
          --positions "$POSITIONS"
          --before-limit 20
          --concurrency 8
          --timeout 5
          --output artifacts/e4-creator-forensics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-creator-forensics-${{ github.run_id }}
          path: artifacts/e4-creator-forensics.json
          if-no-files-found: warn
          retention-days: 30
