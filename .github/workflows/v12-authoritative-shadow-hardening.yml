name: V12 Authoritative Shadow Hardening

on:
  push:
    branches:
      - codex/v12-authoritative-shadow-hardening-20260920
    paths:
      - "scripts/v12_prearmed_shadow_suite.py"
      - "scripts/v12_prearmed_guardrail_policy.py"
      - "tests/test_v12_prearmed_shadow_suite.py"
      - "tests/test_v12_prearmed_guardrail_policy.py"
      - "scripts/e4_v12_axiom_paper_live.py"
      - ".github/workflows/v12-authoritative-shadow-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-authoritative-shadow-hardening
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-authoritative-shadow-hardening-20260920
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,research]'
          python -m pip install -r requirements-e4.txt

      - name: Compile and lint hardened V12 paths
        run: |
          python -m compileall -q \
            scripts/v12_prearmed_shadow_suite.py \
            scripts/v12_prearmed_guardrail_policy.py \
            scripts/e4_v12_axiom_paper_live.py \
            tests/test_v12_prearmed_shadow_suite.py \
            tests/test_v12_prearmed_guardrail_policy.py
          ruff check \
            scripts/v12_prearmed_shadow_suite.py \
            scripts/v12_prearmed_guardrail_policy.py \
            scripts/e4_v12_axiom_paper_live.py \
            tests/test_v12_prearmed_shadow_suite.py \
            tests/test_v12_prearmed_guardrail_policy.py

      - name: Adversarial shadow and guardrail tests
        run: |
          pytest -q \
            tests/test_e4_v12_axiom_paper_live.py \
            tests/test_e4_v12_fast_prearmed_selector.py \
            tests/test_v12_prearmed_shadow_suite.py \
            tests/test_v12_prearmed_guardrail_policy.py

      - name: Verify no frozen model or current causal state was changed
        run: |
          git fetch --depth=1 origin codex/e4-v12-flow-survival-hazard-v12:refs/remotes/origin/v12-live
          git diff --exit-code origin/v12-live -- \
            research/v12-pre-armed-100-trade-frozen-model.json \
            research/v12-pre-armed-50-trade-results.json \
            research/v12-pre-armed-100-causal-paper-live.json \
            scripts/e4_v12_fast_prearmed_selector.py
