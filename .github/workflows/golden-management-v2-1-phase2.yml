name: Golden Management v2.1 stress and bulletproofing

on:
  push:
    branches: [codex/golden-management-v2-1-tournament]
    paths:
      - "tools/golden_management_v2_1.py"
      - "tools/golden_management_v2_1_tournament_live.py"
      - "tools/golden_management_v2_1_tournament_hardened.py"
      - "tools/golden_management_v2_1_stress.py"
      - "tools/golden_management_v2_1_report.py"
      - "tests/test_golden_management_v2_1.py"
      - "tests/test_golden_management_v2_1_tournament.py"
      - ".github/workflows/golden-management-v2-1-phase2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: golden-management-v2-1-phase2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"

jobs:
  policy-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-management-v2-1-tournament
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install aiohttp
      - name: Compile and unit test
        run: |
          PYTHONPATH="$PWD:$PWD/tools" python -m py_compile tools/golden_management_v2_1.py tools/golden_management_v2_1_tournament_live.py tools/golden_management_v2_1_tournament_hardened.py tools/golden_management_v2_1_stress.py tools/golden_management_v2_1_report.py
          PYTHONPATH="$PWD:$PWD/tools" python -m unittest tests.test_golden_management_v2_1 tests.test_golden_management_v2_1_tournament -v
      - name: 100k adversarial flow paths and cluster fuzz
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD:$PWD/tools" python tools/golden_management_v2_1_stress.py --paths 100000 --seed 20260915 --output artifacts/v21-stress.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/v21-stress.json'))
          assert d['status']=='PASS'
          assert d['paths']==100000
          assert d['fully_closed_paths']==100000
          assert d['max_total_fraction_sold'] <= 1.000000001
          assert d['cluster_fuzz_rounds'] >= 5000
          print('V21_STRESS_PASS',d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: golden-v21-policy-stress-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

  exact-transport-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          path: transport
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact transport stack
        working-directory: transport
        run: |
          python -m pip install -e . -r requirements-e4.txt
          cd tools/e4-builder && npm install --omit=dev
      - name: Regression tests
        working-directory: transport
        env:
          E4_PIPELINES_BACKGROUND: "false"
          E4_SOL_USD_FALLBACK: "150"
          E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
          E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
          E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
          E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS: "600"
        run: |
          python -m unittest tests.test_e4_v12_true_latency_replay -v
          python -m unittest tests.test_e4_v12_sub10ms_transport_final -v
      - name: Tune and certify twice
        working-directory: transport
        env:
          E4_PIPELINES_BACKGROUND: "false"
          E4_SOL_USD_FALLBACK: "150"
          E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
          E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
          E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
          E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS: "600"
        run: |
          mkdir -p artifacts
          for n in 2 3 4; do E4_BUILDER_RACE_CHILDREN="$n" python scripts/e4_v12_sub10ms_benchmark_v4.py --warmup 80 --probes 300 --output "artifacts/tune-$n.json" || true; done
          python - <<'PY'
          import json,pathlib
          rows=[]
          for n in (2,3,4):
              d=json.load(open(f'artifacts/tune-{n}.json')); q=d['quote_to_route_ack_ms']; rows.append((float(q['p95']),n))
          rows.sort(); pathlib.Path('artifacts/best.txt').write_text(str(rows[0][1])); print('TUNE',rows)
          PY
          best="$(cat artifacts/best.txt)"
          E4_BUILDER_RACE_CHILDREN="$best" python scripts/e4_v12_sub10ms_benchmark_v4.py --warmup 120 --probes 1000 --output artifacts/cert1.json
          E4_BUILDER_RACE_CHILDREN="$best" python scripts/e4_v12_sub10ms_benchmark_v4.py --warmup 120 --probes 1000 --output artifacts/cert2.json
          python - <<'PY'
          import json
          for fn in ('cert1.json','cert2.json'):
              d=json.load(open('artifacts/'+fn)); q=d['quote_to_route_ack_ms']; assert d['sub10ms_p95_pass'] is True; assert float(q['p95']) < 10.0; print(fn,q)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: golden-v21-transport-${{ github.run_id }}
          path: transport/artifacts/
          retention-days: 30

  fresh-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-management-v2-1-tournament
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-selection-reconstruction
          path: production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live dependencies
        run: python -m pip install -e production -r production/requirements-e4.txt aiohttp
      - name: Restore frozen causal corpus
        run: |
          mkdir -p frozen artifacts/live-smoke
          gh run download 34262315056 --repo "$GITHUB_REPOSITORY" --name e4-v12-allout-launch-corpus-34262315056 --dir frozen
          corpus="$(find frozen -name e4-v12-allout-launch-corpus.jsonl.gz -print -quit)"
          test -s "$corpus"
          echo "CORPUS=$corpus" >> "$GITHUB_ENV"
      - name: Two-minute true-online hardened four-arm smoke
        run: |
          set +e
          PYTHONPATH="$PWD:$PWD/tools" python tools/golden_management_v2_1_tournament_hardened.py \
            --production-root production --corpus "$CORPUS" --starting-balance-sol 3 \
            --execution-delay-ms 6 --target-closed-trades 999 --duration-seconds 120 --heartbeat-seconds 15 \
            --state-output artifacts/live-smoke/state.json --status artifacts/live-smoke/status.json --output artifacts/live-smoke/final.json
          rc=$?
          set -e
          test "$rc" -eq 3 || test "$rc" -eq 0
      - name: Verify live/fresh/clean tournament
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/live-smoke/final.json'))
          assert s['paper_only'] is True and s['real_money_execution'] is False and s['historical_replay'] is False
          assert s['market_data_mode']=='LIVE_SOLANA_WEBSOCKET_FRESH_LAUNCHES_ONLY'
          assert int(s['counts'].get('launches_seen',0)) > 0
          assert int(s['counts'].get('decoded_events',0)) > 0
          assert not s.get('task_errors') and int(s['active_signals'])==0 and int(s['post_exit_pending'])==0
          assert set(s['arms'])=={'FULL_2S_CONTROL','PARTIALS_2S','V2_CURRENT','FLOW_V2_1'}
          for arm in s['arms'].values(): assert float(arm['starting_balance_sol'])==3.0
          print('V21_FRESH_LIVE_SMOKE_PASS',s['counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: golden-v21-fresh-live-smoke-${{ github.run_id }}
          path: artifacts/live-smoke/
          retention-days: 30

  phase2-gate:
    needs: [policy-stress, exact-transport-speed, fresh-live-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completion gate
        run: |
          mkdir -p artifacts
          cat > artifacts/phase2.json <<'JSON'
          {"phase":2,"name":"v2.1 stress/debug/bulletproofing","status":"COMPLETE","requirements":{"adversarial_paths":100000,"cluster_fuzz_rounds":5000,"two_consecutive_transport_p95_lt_ms":10,"fresh_live_four_arm_smoke":true,"atomic_matched_entry":true,"aligned_failure_rollback":true,"concurrent_equity_accounting":true,"paper_only":true}}
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: golden-v21-phase2-${{ github.run_id }}
          path: artifacts/phase2.json
          retention-days: 30
