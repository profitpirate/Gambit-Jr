name: E4 V10 canonical live results

on:
  push:
    branches:
      - codex/e4-v10-three-pipelines
    paths:
      - ".github/workflows/e4-v10-canonical-results.yml"
      - "scripts/e4_v10_extract_results.py"
      - "reports/e4-v10-live-hypothesis/latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v10-three-pipelines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract canonical Gambit/E4 comparison
        shell: bash
        run: |
          python scripts/e4_v10_extract_results.py \
            --input reports/e4-v10-live-hypothesis/latest.json \
            --output reports/e4-v10-live-hypothesis/canonical.json
      - name: Persist canonical evidence
        shell: bash
        run: |
          git config user.name "gambit-e4-canonical"
          git config user.email "actions@users.noreply.github.com"
          git add reports/e4-v10-live-hypothesis/canonical.json reports/e4-v10-live-hypothesis/canonical-markers
          if ! git diff --cached --quiet; then
            git commit -m "test(e4): persist canonical V10 live comparison [skip ci]"
            git pull --rebase origin codex/e4-v10-three-pipelines
            git push origin HEAD:codex/e4-v10-three-pipelines
          fi
