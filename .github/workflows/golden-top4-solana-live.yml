name: Golden top4 - live Solana paper and E4
on:
  push:
    branches: [codex/golden-top3-full3sv2-live]
    paths:
      - '.github/workflows/golden-top4-solana-live.yml'
      - 'docs/research/golden-top4-launch.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: golden-top4-solana-campaign
  cancel-in-progress: false
jobs:
  forward-live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/golden-top3-full3sv2-live
      PYTHONPATH: tools:tests
      PYTHONUNBUFFERED: '1'
      LIVE_SEGMENT_SECONDS: '2700'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-top3-full3sv2-live
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only network dependency
        run: python -m pip install aiohttp==3.14.3
      - name: Install live heartbeat lease shim
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/migration_route_bridge.py')
          s=p.read_text()
          needle="                    data=dict(data)\n                    data.update("
          replacement=(
              "                    data=dict(data)\n"
              "                    data['heartbeat_ns']=time.time_ns()\n"
              "                    data['lease_expires_ns']=data['heartbeat_ns']+90_000_000_000\n"
              "                    data['liveness_contract']='collector_active is valid only while heartbeat lease is unexpired; Actions run state is authoritative'\n"
              "                    data.update("
          )
          if s.count(needle) != 1:
              raise SystemExit('heartbeat lease injection point changed')
          p.write_text(s.replace(needle,replacement))
          PY
          python -m py_compile tools/migration_route_bridge.py tools/golden_live_checkpoint.py
      - name: Preserve tested source identity and verify original freeze
        run: |
          mkdir -p artifacts/build
          git rev-parse HEAD > artifacts/build/source-commit.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          f=json.load(open('docs/research/golden-full3s-v2-freeze.json'))
          for p,h in f['source_sha256'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          PY
          python -m py_compile tools/golden_top4_*.py tools/migration_route_bridge.py tools/golden_live_checkpoint.py
          python tools/migration_route_bridge.py self-test
          python tools/golden_top4_campaign.py --prepare
          cp config/golden-top4-live.json artifacts/build/manifest.json
          cp docs/research/golden-full3s-v2-freeze.json artifacts/build/
      - name: Regression and four-model accounting reporting stress gates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_golden_full3s*.py' -v 2>&1 | tee artifacts/build/frozen-tests.log
          python -m unittest discover -s tests -p 'test_golden_top4*.py' -v > artifacts/build/top4-tests.log 2>&1
          tail -5 artifacts/build/top4-tests.log
      - uses: actions/checkout@v4
        with:
          ref: 8c18f0fffe67500012a18d2dee983b81e2abb938
          path: production
          sparse-checkout: src/memecoin_bot/realtime/pumpfun.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore frozen prior reputation corpus - not live outcomes
        run: |
          mkdir -p frozen
          gh run download 34262315056 --repo "$GITHUB_REPOSITORY" --name e4-v12-allout-launch-corpus-34262315056 --dir frozen
          corpus="$(find frozen -name e4-v12-allout-launch-corpus.jsonl.gz -print -quit)"
          test -s "$corpus"
          echo "CORPUS=$corpus" >> "$GITHUB_ENV"
      - name: Fresh Solana creation and independent E4 connectivity check - no positions
        run: |
          python tools/golden_top4_solana.py --production-root production --corpus "$CORPUS" --manifest config/golden-top4-live.json --output artifacts/smoke --duration 60 --smoke > artifacts/build/live-preflight.log 2>&1
          cat artifacts/smoke/readiness.json
      - name: Resumable live four-model segment with durable clean checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/live artifacts/build
          rm -f artifacts/live/stop-checkpoint-publisher
          python tools/golden_live_checkpoint.py \
            --kind top4 --root artifacts/live --branch "$BRANCH" \
            > artifacts/build/checkpoint-publisher.log 2>&1 &
          checkpoint_pid=$!
          cleanup_checkpoint() {
            touch artifacts/live/stop-checkpoint-publisher
            wait "$checkpoint_pid" || true
          }
          trap cleanup_checkpoint EXIT
          python tools/migration_route_bridge.py campaign --kind top4 --corpus "$CORPUS" --duration "$LIVE_SEGMENT_SECONDS"
      - name: Preserve sources and evidence regardless of completion
        if: always()
        run: |
          mkdir -p artifacts/source
          cp tools/golden_top4_*.py artifacts/source/
          cp tools/migration_route_bridge.py artifacts/source/
          cp tools/golden_live_checkpoint.py artifacts/source/
          cp config/golden-top4-live.json artifacts/source/ 2>/dev/null || true
          cp .github/workflows/golden-top4-solana-live.yml artifacts/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-top4-solana-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 60
          if-no-files-found: error
