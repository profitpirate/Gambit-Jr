name: E4 V10 frozen E2E and live hypothesis

on:
  push:
    branches:
      - codex/e4-v10-live-certification
    paths:
      - ".github/workflows/e4-v10-frozen-certification.yml"
      - "triggers/e4-v10-frozen-certification.txt"
  workflow_dispatch:
    inputs:
      target_launches:
        required: false
        default: "1000"
      max_capture_seconds:
        required: false
        default: "14400"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_V10_SERVICES_ENABLED: "false"
  E4_REMOTE_BUILDER_FALLBACK: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_HOLDOUT_PROGRESS_PATH: "reports/e4-v10-frozen/progress.json"

jobs:
  certify-and-hypothesise:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v10-live-certification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Compile complete production stack
        run: |
          python -m compileall -q src/memecoin_bot scripts tests
          node --check tools/e4-builder/daemon-v2.mjs

      - name: Full E4 regression, concurrency and V10 service E2E
        run: python -m unittest discover -s tests -p "test_e4*.py" -v

      - name: Three repeated 500k-decision pipeline pressure tests
        run: |
          mkdir -p reports/e4-v10-frozen
          for run in 1 2 3; do
            python scripts/e4_v10_pipeline_stress.py \
              --iterations 500000 \
              --workers 16 \
              --narrative-iterations 75000 \
              --output "reports/e4-v10-frozen/pipeline-stress-${run}.json"
          done

      - name: Repeated local Pump builder warm validation
        working-directory: tools/e4-builder
        run: |
          for run in $(seq 1 50); do
            E4_REMOTE_BUILDER_FALLBACK=false node daemon-v2.mjs --self-test >"/tmp/e4-v10-builder-${run}.log"
          done
          cat /tmp/e4-v10-builder-50.log

      - name: Capture 1000 fresh real Pump launches and replay V10 hypothetically
        id: holdout
        env:
          TARGET_LAUNCHES: ${{ github.event.inputs.target_launches || '1000' }}
          MAX_CAPTURE_SECONDS: ${{ github.event.inputs.max_capture_seconds || '14400' }}
        shell: bash
        run: |
          set +e
          python scripts/e4_v10_live_holdout.py \
            --target-launches "$TARGET_LAUNCHES" \
            --capture-seconds "$MAX_CAPTURE_SECONDS" \
            --tail-seconds 360 \
            --heartbeat-seconds 30 \
            --minimum-launches "$TARGET_LAUNCHES" \
            --wallet-signatures 1000 \
            --builder-probes 500 \
            --testnet-route-probes 0 \
            --stress-iterations 250000 \
            --output reports/e4-v10-frozen/live-hypothesis.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Canonicalise economic results
        if: always()
        shell: bash
        run: |
          if [ -s reports/e4-v10-frozen/live-hypothesis.json ]; then
            python scripts/e4_v10_extract_results_v2.py \
              --input reports/e4-v10-frozen/live-hypothesis.json \
              --output reports/e4-v10-frozen/canonical.json || true
          fi

      - name: Enforce 36ms warm path and lifecycle gates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=Path('reports/e4-v10-frozen/live-hypothesis.json')
          if not report.exists(): raise SystemExit('live report missing')
          data=json.loads(report.read_text())
          speed=((data.get('e4_v10') or {}).get('speed_certification') or {})
          print(json.dumps(speed,indent=2))
          assert speed.get('policy_budget_pass') is True, speed
          assert speed.get('builder_budget_pass') is True, speed
          # No claim is made about validator landing without authenticated routes.
          assert speed.get('actual_chain_landing_measured') is False, speed
          for path in Path('reports/e4-v10-frozen').glob('pipeline-stress-*.json'):
              row=json.loads(path.read_text())
              assert row['decision_correctness_failures']==0,row
              assert row['decision_p99_ns']<=36_000_000,row
              assert row['narrative']['p99_ns']<=36_000_000,row
          PY

      - name: Produce final human-readable verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          root=Path('reports/e4-v10-frozen')
          live=json.loads((root/'live-hypothesis.json').read_text()) if (root/'live-hypothesis.json').exists() else {}
          canonical=json.loads((root/'canonical.json').read_text()) if (root/'canonical.json').exists() else {}
          speed=((live.get('e4_v10') or {}).get('speed_certification') or {})
          g=canonical.get('gambit') or {}
          e=canonical.get('actual_e4') or {}
          stresses=[]
          for p in sorted(root.glob('pipeline-stress-*.json')):
              row=json.loads(p.read_text());stresses.append({
                  'file':p.name,'decision_p95_ms':row.get('decision_p95_ns',0)/1e6,
                  'decision_p99_ms':row.get('decision_p99_ns',0)/1e6,
                  'narrative_p99_ms':(row.get('narrative') or {}).get('p99_ns',0)/1e6,
                  'failures':row.get('decision_correctness_failures')})
          verdict={
              'version':'e4-v10-frozen-verdict-v1','live_launches':canonical.get('live_launches'),
              'gambit':g,'same_window_actual_e4':e,
              'historical_e4_net_benchmark':{'net_win_rate':0.6008,'profit_factor':4.92},
              'speed':speed,'pipeline_stress':stresses,
              'real_transactions_sent':False,
              'social_live_stream_exercised':False,
              'social_note':'Social pipeline passed injected-stream E2E; no X_BEARER_TOKEN was available to ingest live X posts in this run.',
              'funded_live_certified':False,
          }
          (root/'verdict.json').write_text(json.dumps(verdict,indent=2))
          lines=['# Gambit E4 V10 frozen validation','',f"- Fresh real Pump launches: **{verdict['live_launches']}**",f"- Real funded transactions: **0**",f"- Policy P95: **{speed.get('policy_pipeline_p95_ms')} ms**",f"- Builder P95: **{speed.get('builder_p95_ms')} ms**",f"- Gambit closed trades: **{g.get('closed_trades')}**",f"- Gambit net win rate: **{g.get('net_win_rate')}**",f"- Gambit net P&L: **{g.get('net_pnl_sol')} SOL**",f"- Gambit profit factor: **{g.get('profit_factor')}**",f"- Same-window E4 closed trades: **{e.get('closed_trades')}**",f"- Same-window E4 net win rate: **{e.get('net_win_rate')}**",f"- Historical E4 net benchmark: **60.08%, PF 4.92**",'', '## Stress runs','']
          lines += [f"- {r['file']}: decision P99 {r['decision_p99_ms']:.6f}ms, narrative P99 {r['narrative_p99_ms']:.6f}ms, failures {r['failures']}" for r in stresses]
          lines += ['', '## Honest limitation','', verdict['social_note'], '', 'Authenticated mainnet route landing was not measured and funded-live certification remains false.']
          (root/'VERDICT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(verdict,indent=2))
          PY

      - name: Persist frozen evidence
        if: always()
        shell: bash
        run: |
          git config user.name "gambit-e4-frozen-cert"
          git config user.email "actions@users.noreply.github.com"
          git add reports/e4-v10-frozen || true
          if ! git diff --cached --quiet; then
            git commit -m "test(e4): persist frozen V10 E2E and live hypothesis [skip ci]"
            git push origin HEAD:codex/e4-v10-live-certification
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v10-frozen-validation-${{ github.run_id }}
          path: reports/e4-v10-frozen
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce live holdout completion
        if: always()
        run: exit "${{ steps.holdout.outputs.code || '2' }}"
