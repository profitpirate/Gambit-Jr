name: V12 E4 Lifetime Artifact Recovery Tier 1

on:
  push:
    branches:
      - codex/v12-production-hardening-20260920
    paths:
      - "scripts/v12_e4_artifact_recovery.py"
      - "tests/test_v12_e4_artifact_recovery.py"
      - ".github/workflows/v12-e4-lifetime-artifact-recovery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: v12-e4-lifetime-artifact-recovery-tier1
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-production-hardening-20260920
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]

      - name: Validate recovery parser
        run: |
          python -m py_compile scripts/v12_e4_artifact_recovery.py
          ruff check scripts/v12_e4_artifact_recovery.py tests/test_v12_e4_artifact_recovery.py
          python -m pytest tests/test_v12_e4_artifact_recovery.py -q

      - name: Select high-value retained artifacts
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          inv=json.load(open("research/e4-lifetime-artifact-inventory.json"))
          selected=[]
          for row in inv.get("artifacts") or []:
              if row.get("expired"):
                  continue
              name=str(row.get("name") or "")
              size=int(row.get("size_in_bytes") or 0)
              low=name.lower()
              high_value=(
                  "full-wallet-history" in low
                  or low.startswith("e4-live-market-stress")
                  or low.startswith("e4-long-oracle-holdout")
                  or low.startswith("e4-v11-forward-batch")
                  or "creator-forensics" in low
                  or "winning-creator-registry" in low
                  or "creator-expectancy" in low
                  or "recent-creator-recurrence" in low
                  or "selection-research" in low
                  or "selection-v2-certification" in low
                  or (low.startswith("e4-v10-") and size <= 2_000_000)
                  or (low.startswith("e4-v11-") and size <= 10_000_000)
              )
              if high_value:
                  selected.append(row)
          Path("/tmp/recovery-selection.json").write_text(
              json.dumps(selected,indent=2),encoding="utf-8"
          )
          print(json.dumps({
              "selected":len(selected),
              "compressed_bytes":sum(int(x.get("size_in_bytes") or 0) for x in selected),
          },indent=2))
          PY

      - name: Download selected artifacts sequentially
        shell: bash
        run: |
          mkdir -p /tmp/e4-zips
          python - <<'PY' > /tmp/recovery.tsv
          import json
          for row in json.load(open("/tmp/recovery-selection.json")):
              print(f"{row['id']}\t{row['name']}")
          PY
          while IFS=$'\t' read -r id name; do
            echo "Downloading $id $name"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "/tmp/e4-zips/$id.zip"
          done < /tmp/recovery.tsv

      - name: Recover E4 evidence from artifact JSON
        run: |
          python scripts/v12_e4_artifact_recovery.py             --zip-root /tmp/e4-zips             --output models/e4/e4-lifetime-artifact-recovery.json

      - name: Refresh lifetime ledger in the same evidence transaction
        run: |
          python scripts/v12_e4_lifetime_ledger.py \
            --artifact-inventory-complete \
            --minimum-expected-closed-trades 2000 \
            --output models/e4/e4-lifetime-ledger.json \
            --report research/e4-lifetime-ledger.md

      - name: Refresh lifetime-gated creator library
        run: |
          python scripts/v12_creator_library_rebuild.py \
            --e4-expectancy models/e4/e4-creator-expectancy.json \
            --apprentice research/v12-creator-apprentice-backfill.json \
            --e4-complete-history models/e4/e4-complete-creator-history.json \
            --e4-lifetime-ledger models/e4/e4-lifetime-ledger.json \
            --output models/e4/v12-creator-library.json \
            --report research/v12-creator-library-report.md

      - name: Verify evidence consistency before commit
        run: |
          python -m pytest -q \
            tests/test_v12_e4_lifetime_ledger.py \
            tests/test_v12_e4_artifact_recovery.py \
            tests/test_v12_creator_library_rebuild.py \
            tests/test_v12_nextgen_creator_authority.py \
            tests/test_v12_pipeline_metrics.py
          python scripts/v12_nextgen_system_audit.py

      - name: Commit recovered and derived evidence atomically
        run: |
          git config user.name 'gambit-e4-artifact-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            models/e4/e4-lifetime-artifact-recovery.json \
            models/e4/e4-lifetime-ledger.json \
            models/e4/v12-creator-library.json \
            research/e4-lifetime-ledger.md \
            research/v12-creator-library-report.md \
            research/v12-nextgen-system-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v12): recover and reconcile tier-1 E4 lifetime history'
            git pull --rebase origin codex/v12-production-hardening-20260920
            git push origin HEAD:codex/v12-production-hardening-20260920
          fi

      - name: Dispatch lifetime ledger rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v12-e4-lifetime-ledger.yml --ref codex/v12-production-hardening-20260920
