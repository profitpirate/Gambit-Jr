name: E4 V12 reactive profit golden thesis

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - ".github/workflows/e4-v12-reactive-profit-golden.yml"
      - "scripts/e4_v12_reactive_profit_model.py"
      - "scripts/e4_v12_true_latency_compat.py"
      - "scripts/e4_v12_true_latency_replay_v2.py"
      - "tests/test_v12_true_latency_replay.py"
      - "tests/test_e4_v12_sub10ms_repairs.py"
      - "src/memecoin_bot/e4_sub10ms_transport_final_v12.py"
      - "research/e4-v12-reactive-profit-trigger*.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  SOURCE_BRANCH: codex/e4-v12-selection-reconstruction
  RESEARCH_BRANCH: codex/e4-v12-sub10ms-entry-research-20260905
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/strict-race-proxy-v12.mjs"
  E4_BUILDER_PRELOAD: "${{ github.workspace }}/tools/e4-builder/fast-preload-v4.mjs"
  E4_V12_BUY_SLIPPAGE_BPS: "800"
  E4_V12_MAX_OUTPUT_SHORTFALL_BPS: "800"

concurrency:
  group: e4-v12-reactive-profit-golden
  cancel-in-progress: true

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Current V12 authority regressions and exact latency economics
        run: |
          mkdir -p artifacts
          python -m compileall -q scripts src/memecoin_bot tests
          node --check tools/e4-builder/strict-race-proxy-v12.mjs
          E4_BUILDER_ALLOW_REMOTE_FALLBACK=false node tools/e4-builder/race-proxy-v3.mjs --self-test
          python -m unittest -v \
            tests.test_v12_true_latency_replay \
            tests.test_v12_tight_output \
            tests.test_v12_strict_output_deferred \
            tests.test_v12_independent_exit_replay \
            tests.test_v12_transport \
            tests.test_v12_transport_epoch \
            tests.test_e4_final \
            tests.test_e4_hardening_v4 \
            tests.test_e4_hardening_v5 \
            tests.test_e4_production \
            tests.test_e4_stress_hardening \
            tests.test_e4_v10_direct_ca_social \
            tests.test_e4_v10_learning_finalizer \
            tests.test_e4_v10_production_wiring \
            tests.test_e4_v12_sub10ms_repairs \
            tests.test_e4_v12_true_latency_replay \
            tests.test_e4_v12_sub10ms_transport_final

      - name: Superseded V6-V10 contract audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          set -o pipefail
          python -m unittest discover -s tests -p "test_e4*.py" -v 2>&1 | tee artifacts/legacy-e4-regressions.log
          status=${PIPESTATUS[0]}
          printf 'legacy_exit_code=%s\n' "$status" > artifacts/legacy-e4-regressions-status.txt
          exit 0

      - name: Require exact guarded pre-broadcast path below 10ms p95
        run: |
          python -m scripts.e4_v12_hotpath_benchmark_v3 \
            --iterations 750 \
            --warmup 75 \
            --maximum-p95-ms 10 \
            --output artifacts/hotpath.json

      - name: Download ten chronological immutable live windows
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" \
            --workflow e4-v12-selection-certification.yml \
            --branch "$SOURCE_BRANCH" \
            --status success \
            --limit 18 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          test "$(wc -l < /tmp/run_ids)" -eq 10
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            test -s "$batch"; test -s "$events"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/pairs.tsv
          done < /tmp/run_ids

      - name: Freeze one profit-first E4 source-entry model
        continue-on-error: true
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/pairs.tsv
          python -m scripts.e4_v12_reactive_profit_model \
            --mode search "${args[@]}" \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --minimum-win-rate 0.65 \
            --minimum-profit-factor 1.25 \
            --output artifacts/report.json \
            --model-output artifacts/model.joblib \
            --predictions-output artifacts/holdout-predictions.json

      - name: Publish historical status
        id: status
        if: always()
        run: |
          mkdir -p artifacts
          status=NOT_CONCLUSIVE
          if [ -s artifacts/report.json ]; then status="$(jq -r '.status // "NOT_CONCLUSIVE"' artifacts/report.json)"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > artifacts/status.txt
          echo "Reactive profit thesis status: $status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-reactive-profit-historical-${{ github.run_id }}
          path: |
            artifacts/hotpath.json
            artifacts/report.json
            artifacts/model.joblib
            artifacts/holdout-predictions.json
            artifacts/status.txt
            artifacts/legacy-e4-regressions.log
            artifacts/legacy-e4-regressions-status.txt
          if-no-files-found: warn
          retention-days: 30

  untouched-live:
    needs: historical
    if: needs.historical.outputs.status == 'HISTORICAL_HOLDOUT_CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-reactive-profit-historical-${{ github.run_id }}
          path: artifacts

      - name: Restore frozen causal history
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" --workflow e4-v12-selection-certification.yml --branch "$SOURCE_BRANCH" --status success --limit 18 --json databaseId,createdAt --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/history-pairs.tsv
          done < /tmp/run_ids

      - name: Capture brand-new untouched 3000-launch live window
        run: |
          mkdir -p artifacts
          export E4_HOLDOUT_PROGRESS_PATH=artifacts/live-progress.json
          python scripts/e4_300_launch_holdout_v12.py \
            --target-launches 3000 \
            --capture-seconds 14400 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 1500 \
            --builder-probes 250 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output artifacts/live-batch.json

      - name: Apply frozen model without any live fitting
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/history-pairs.tsv
          args+=(--pair "artifacts/live-batch.json:artifacts/live-batch-live-events.jsonl")
          python -m scripts.e4_v12_reactive_profit_model \
            --mode apply "${args[@]}" \
            --model-input artifacts/model.joblib \
            --output artifacts/live-apply.json \
            --model-output artifacts/live-unused.joblib \
            --predictions-output artifacts/live-predictions.json
          python - <<'PY'
          import joblib
          bundle=joblib.load('artifacts/model.joblib')
          open('artifacts/live-guard-bps.txt','w').write(str(bundle['gate']['max_output_shortfall_bps'])+'\n')
          PY

      - name: True untouched 0-10ms replay with scaled E4 output guard
        run: |
          guard="$(cat artifacts/live-guard-bps.txt)"
          python -m scripts.e4_v12_true_latency_replay_v2 \
            --pair "live=artifacts/live-batch.json:artifacts/live-batch-live-events.jsonl" \
            --predictions artifacts/live-predictions.json \
            --latencies-ms 0,1,2,5,10 \
            --output-shortfall-bps "$guard" \
            --starting-balance-sol 3 \
            --entry-fraction 0.0185 \
            --maximum-position-sol 0.30 \
            --reserve-sol 0.03 \
            --pump-fee-bps 125 \
            --confirmation-ms 1500 \
            --unconfirmed-timeout-ms 1500 \
            --max-concurrency 2 \
            --output artifacts/live-economics.json

      - name: Require high WR, positive PnL and PF at every latency
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          data=json.loads(Path('artifacts/live-economics.json').read_text())
          guard=Path('artifacts/live-guard-bps.txt').read_text().strip()
          blocks=data['matrix'][guard]
          rows={}; passed=True
          for latency,m in blocks.items():
              n=int(m.get('closed') or 0); w=int(m.get('wins') or 0)
              wr=float(m.get('win_rate') or 0); pnl=float(m.get('net_pnl_sol') or 0)
              raw=m.get('profit_factor'); pf=float(raw) if raw is not None and math.isfinite(float(raw)) else (999.0 if pnl>0 and n>0 and w==n else 0.0)
              if n:
                  z=1.96; p=w/n; den=1+z*z/n; low=max(0.0,(p+z*z/(2*n)-z*math.sqrt((p*(1-p)+z*z/(4*n))/n))/den)
              else: low=0.0
              ok=n>=4 and wr>=0.65 and low>=0.30 and pnl>0 and pf>=1.25
              rows[latency]={'trades':n,'wins':w,'win_rate':wr,'wilson_low':low,'net_pnl_sol':pnl,'profit_factor':pf,'passed':ok}; passed=passed and ok
          verdict={'version':'e4-v12-reactive-profit-live-v2','status':'FOUND_LIVE_SUB10MS_GOLDEN_THESIS' if passed else 'NOT_CONCLUSIVE','latencies':rows,'untouched_live':True,'starting_balance_sol':3.0,'no_live_tuning':True}
          Path('artifacts/live-verdict.json').write_text(json.dumps(verdict,indent=2,sort_keys=True)); Path('artifacts/live-status.txt').write_text(verdict['status']+'\n'); print(json.dumps(verdict,indent=2,sort_keys=True))
          if not passed: raise SystemExit(1)
          PY

      - name: Persist only a fully live-confirmed candidate
        if: success()
        run: |
          mkdir -p docs/research models/e4/research
          cp artifacts/report.json docs/research/e4-v12-reactive-profit-report.json
          cp artifacts/model.joblib models/e4/research/e4-v12-reactive-profit-model.joblib
          cp artifacts/live-verdict.json docs/research/e4-v12-reactive-profit-live-verdict.json
          git config user.name 'gambit-v12-research'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/research/e4-v12-reactive-profit-report.json docs/research/e4-v12-reactive-profit-live-verdict.json models/e4/research/e4-v12-reactive-profit-model.joblib
          if ! git diff --cached --quiet; then
            git commit -m 'research(e4-v12): persist live-confirmed reactive sub-10ms thesis [skip ci]'
            git push origin HEAD:"$RESEARCH_BRANCH"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-reactive-profit-live-${{ github.run_id }}
          path: |
            artifacts/live-progress.json
            artifacts/live-batch.json
            artifacts/live-batch-live-events.jsonl
            artifacts/live-predictions.json
            artifacts/live-guard-bps.txt
            artifacts/live-economics.json
            artifacts/live-verdict.json
            artifacts/live-status.txt
          if-no-files-found: warn
          retention-days: 30
