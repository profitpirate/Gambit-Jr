name: E4 V12 golden thesis 2 SOL paper validation

on:
  push:
    branches: [codex/e4-v12-golden-live-2sol]
    paths:
      - .github/workflows/e4-v12-social-golden.yml
      - scripts/e4_v12_social_prearm_runner.py
      - scripts/e4_v12_golden_live_report.py
      - tests/test_v12_social_pipeline_2sol.py
      - research/e4-v12-social-golden-trigger*.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: e4-v12-social-golden-2sol
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  SOURCE_BRANCH: codex/e4-v12-selection-reconstruction
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: node tools/e4-builder/strict-race-proxy-v12.mjs
  E4_BUILDER_PRELOAD: ${{ github.workspace }}/tools/e4-builder/fast-preload-v4.mjs
  E4_V12_BUY_SLIPPAGE_BPS: "800"
  E4_V12_MAX_OUTPUT_SHORTFALL_BPS: "800"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . -r requirements-e4.txt scikit-learn joblib
      - name: Test search apply replay and report end to end
        run: |
          python -m compileall -q scripts/e4_v12_social_prearm_runner.py scripts/e4_v12_golden_live_report.py tests/test_v12_social_pipeline_2sol.py
          python -m unittest tests.test_v12_true_latency_replay tests.test_v12_social_pipeline_2sol -v

  historical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . -r requirements-e4.txt scikit-learn joblib
      - name: Freeze ten chronological history windows
        run: |
          mkdir -p historical artifacts
          gh run list --repo "$REPO" --workflow e4-v12-selection-certification.yml --branch "$SOURCE_BRANCH" --status success --limit 20 --json databaseId,createdAt --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > artifacts/social-history-run-ids.txt
          test "$(wc -l < artifacts/social-history-run-ids.txt)" -eq 10
          : > /tmp/pairs.tsv
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name e4-v12-forward-batch.json -print -quit)"
            events="$(find "historical/$run_id" -name e4-v12-forward-batch-live-events.jsonl -print -quit)"
            test -s "$batch"; test -s "$events"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/pairs.tsv
          done < artifacts/social-history-run-ids.txt
      - name: Search social thesis with canonical 2 SOL economics
        id: search
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/pairs.tsv
          python -m scripts.e4_v12_social_prearm_runner --mode search "${args[@]}" \
            --latencies 0,1,2,5,10 --starting-balance-sol 2 \
            --minimum-win-rate 0.65 --minimum-profit-factor 1.25 \
            --metadata-cache artifacts/social-cache.json --metadata-concurrency 120 --metadata-timeout 2.5 \
            --output artifacts/social-report.json --model-output artifacts/social-model.json \
            --predictions-output artifacts/social-holdout-predictions.json
      - name: Publish actual research verdict and freeze model
        id: status
        if: always()
        run: |
          mkdir -p artifacts
          status=PIPELINE_ERROR
          if [ -s artifacts/social-report.json ]; then status="$(jq -r '.status // "PIPELINE_ERROR"' artifacts/social-report.json)"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > artifacts/social-status.txt
          echo "Historical research verdict: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" = HISTORICAL_HOLDOUT_CONFIRMED ]; then
            test -s artifacts/social-model.json
            sha256sum artifacts/social-model.json > artifacts/social-model.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-social-golden-historical-${{ github.run_id }}
          path: artifacts/social-*
          if-no-files-found: error
          retention-days: 30

  untouched-live:
    needs: historical
    if: needs.historical.result == 'success' && needs.historical.outputs.status == 'HISTORICAL_HOLDOUT_CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e . -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-social-golden-historical-${{ github.run_id }}
          path: artifacts
      - name: Restore exact frozen history and metadata
        run: |
          sha256sum -c artifacts/social-model.sha256
          cp artifacts/social-cache.json artifacts/social-live-cache.json
          : > /tmp/history-pairs.tsv
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name e4-v12-forward-batch.json -print -quit)"
            events="$(find "historical/$run_id" -name e4-v12-forward-batch-live-events.jsonl -print -quit)"
            test -s "$batch"; test -s "$events"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/history-pairs.tsv
          done < artifacts/social-history-run-ids.txt
      - name: Capture new live market events for paper evaluation
        run: |
          date -u +%FT%TZ > artifacts/social-live-capture-started.txt
          export E4_HOLDOUT_PROGRESS_PATH=artifacts/social-live-progress.json
          python scripts/e4_300_launch_holdout_v12.py --target-launches 3000 --capture-seconds 14400 --tail-seconds 300 --heartbeat-seconds 60 --minimum-launches 3000 --wallet-signatures 1500 --builder-probes 250 --testnet-route-probes 0 --stress-iterations 0 --output artifacts/social-live.json
      - name: Apply frozen model without retraining
        run: |
          sha256sum -c artifacts/social-model.sha256
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/history-pairs.tsv
          args+=(--pair "artifacts/social-live.json:artifacts/social-live-live-events.jsonl")
          python -m scripts.e4_v12_social_prearm_runner --mode apply "${args[@]}" \
            --starting-balance-sol 2 --model-input artifacts/social-model.json \
            --metadata-cache artifacts/social-live-cache.json --metadata-concurrency 120 --metadata-timeout 2.5 \
            --output artifacts/social-live-apply.json --model-output artifacts/social-live-unused.json \
            --predictions-output artifacts/social-live-predictions.json
          sha256sum -c artifacts/social-model.sha256
      - name: Replay exactly 2 SOL at each frozen latency scenario
        run: |
          guard="$(jq -er '.rule.max_output_shortfall_bps' artifacts/social-model.json)"
          live_run_id="$(jq -er '.live_run_id | select(type == "string" and length > 0)' artifacts/social-live-predictions.json)"
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('artifacts/social-live-predictions.json')
          data=json.loads(path.read_text())
          for row in data['predictions']:
              if row.get('run_id') != data['live_run_id']:
                  raise ValueError('prediction run ID mismatch')
              row['entry_fraction']=float(row.get('requested_fraction', 0.0185))
          path.write_text(json.dumps(data, indent=2, sort_keys=True))
          PY
          python -m scripts.e4_v12_true_latency_replay \
            --pair "${live_run_id}=artifacts/social-live.json:artifacts/social-live-live-events.jsonl" \
            --predictions artifacts/social-live-predictions.json --latencies-ms 0,1,2,5,10 \
            --starting-balance-sol 2 --entry-fraction 0.0185 --maximum-position-sol 0.30 \
            --reserve-sol 0.03 --pump-fee-bps 125 --output-shortfall-bps "$guard" \
            --confirmation-ms 1500 --unconfirmed-timeout-ms 1500 --max-concurrency 2 \
            --output artifacts/social-live-economics.json
      - name: Validate ledger and publish winrate and net profit
        run: |
          sha256sum -c artifacts/social-model.sha256
          python -m scripts.e4_v12_golden_live_report \
            --economics artifacts/social-live-economics.json --model artifacts/social-model.json \
            --output artifacts/social-live-verdict.json
      - name: Publish paper performance summary even when gate fails
        if: always()
        run: |
          if [ -s artifacts/social-live-verdict.md ]; then
            cat artifacts/social-live-verdict.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No completed paper-performance report. Inspect the failed step; no winrate or profit is inferred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-social-golden-live-${{ github.run_id }}
          path: artifacts/social-*
          if-no-files-found: error
          retention-days: 30
