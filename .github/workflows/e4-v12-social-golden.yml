name: E4 V12 prelaunch social golden thesis

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - ".github/workflows/e4-v12-social-golden.yml"
      - "research/e4-v12-social-golden-trigger*.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  SOURCE_BRANCH: codex/e4-v12-selection-reconstruction
  RESEARCH_BRANCH: codex/e4-v12-sub10ms-entry-research-20260905
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/strict-race-proxy-v12.mjs"
  E4_BUILDER_PRELOAD: "${{ github.workspace }}/tools/e4-builder/fast-preload-v4.mjs"
  E4_V12_BUY_SLIPPAGE_BPS: "800"
  E4_V12_MAX_OUTPUT_SHORTFALL_BPS: "800"

concurrency:
  group: e4-v12-social-golden
  cancel-in-progress: true

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib

      - name: Compile social and economic research
        run: |
          python -m compileall -q scripts/e4_v12_social_prearm_search.py scripts/e4_v12_true_latency_replay.py scripts/e4_v12_golden_thesis_search.py
          python -m unittest tests.test_v12_true_latency_replay -v

      - name: Download ten chronological live windows
        run: |
          mkdir -p historical artifacts
          gh run list --repo "$REPO" --workflow e4-v12-selection-certification.yml --branch "$SOURCE_BRANCH" --status success --limit 16 --json databaseId,createdAt --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          test "$(wc -l < /tmp/run_ids)" -eq 10
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            test -s "$batch"; test -s "$events"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/pairs.tsv
          done < /tmp/run_ids

      - name: Search exact prelaunch X-status and identity thesis
        continue-on-error: true
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/pairs.tsv
          python -m scripts.e4_v12_social_prearm_search \
            --mode search "${args[@]}" \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --minimum-win-rate 0.65 \
            --minimum-profit-factor 1.25 \
            --metadata-cache artifacts/social-cache.json \
            --metadata-concurrency 120 \
            --metadata-timeout 2.5 \
            --output artifacts/social-report.json \
            --model-output artifacts/social-model.json \
            --predictions-output artifacts/social-holdout-predictions.json

      - name: Publish status
        id: status
        if: always()
        run: |
          status=NOT_CONCLUSIVE
          if [ -s artifacts/social-report.json ]; then status="$(jq -r '.status // "NOT_CONCLUSIVE"' artifacts/social-report.json)"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > artifacts/social-status.txt
          echo "Social thesis status: $status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-social-golden-historical-${{ github.run_id }}
          path: |
            artifacts/social-report.json
            artifacts/social-model.json
            artifacts/social-holdout-predictions.json
            artifacts/social-cache.json
            artifacts/social-status.txt
          if-no-files-found: warn
          retention-days: 30

  untouched-live:
    needs: historical
    if: needs.historical.outputs.status == 'HISTORICAL_HOLDOUT_CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-social-golden-historical-${{ github.run_id }}
          path: artifacts

      - name: Restore history
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" --workflow e4-v12-selection-certification.yml --branch "$SOURCE_BRANCH" --status success --limit 16 --json databaseId,createdAt --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/history-pairs.tsv
          done < /tmp/run_ids

      - name: Capture untouched live launches
        run: |
          export E4_HOLDOUT_PROGRESS_PATH=artifacts/social-live-progress.json
          python scripts/e4_300_launch_holdout_v12.py --target-launches 3000 --capture-seconds 14400 --tail-seconds 300 --heartbeat-seconds 60 --minimum-launches 3000 --wallet-signatures 1500 --builder-probes 250 --testnet-route-probes 0 --stress-iterations 0 --output artifacts/social-live.json

      - name: Apply frozen social rule
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/history-pairs.tsv
          args+=(--pair "artifacts/social-live.json:artifacts/social-live-live-events.jsonl")
          python -m scripts.e4_v12_social_prearm_search \
            --mode apply "${args[@]}" \
            --model-input artifacts/social-model.json \
            --metadata-cache artifacts/social-live-cache.json \
            --metadata-concurrency 120 \
            --metadata-timeout 2.5 \
            --output artifacts/social-live-apply.json \
            --model-output artifacts/social-live-unused.json \
            --predictions-output artifacts/social-live-predictions.json
          jq -r '.rule.max_output_shortfall_bps' artifacts/social-model.json > artifacts/social-live-guard.txt

      - name: True fresh 0-10ms economic replay
        run: |
          guard="$(cat artifacts/social-live-guard.txt)"
          python -m scripts.e4_v12_true_latency_replay \
            --batch artifacts/social-live.json \
            --events artifacts/social-live-live-events.jsonl \
            --predictions artifacts/social-live-predictions.json \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --entry-fraction 0.0185 \
            --fee-bps 125 \
            --max-output-shortfall-bps "$guard" \
            --confirmation-ms 1500 \
            --max-concurrent 2 \
            --output artifacts/social-live-economics.json

      - name: Enforce live high-WR gate
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          data=json.loads(Path('artifacts/social-live-economics.json').read_text())
          rows={}; passed=True
          for latency,block in data['results'].items():
              m=block['all_predictions']; n=int(m.get('closed') or 0); w=int(m.get('wins') or 0); wr=float(m.get('win_rate') or 0); pnl=float(m.get('net_pnl_sol') or 0)
              raw=m.get('profit_factor'); pf=float(raw) if raw is not None and math.isfinite(float(raw)) else (999.0 if pnl>0 and n>0 and w==n else 0.0)
              if n:
                  z=1.96; p=w/n; den=1+z*z/n; low=max(0.0,(p+z*z/(2*n)-z*math.sqrt((p*(1-p)+z*z/(4*n))/n))/den)
              else: low=0.0
              ok=n>=3 and wr>=0.65 and low>=0.30 and pnl>0 and pf>=1.25
              rows[latency]={'trades':n,'wins':w,'win_rate':wr,'wilson_low':low,'net_pnl_sol':pnl,'profit_factor':pf,'passed':ok}; passed=passed and ok
          verdict={'version':'e4-v12-social-golden-live-v1','status':'FOUND_LIVE_SUB10MS_GOLDEN_THESIS' if passed else 'NOT_CONCLUSIVE','selected_mode':'social_prearm','latencies':rows,'untouched_live':True,'starting_balance_sol':3.0,'no_live_tuning':True}
          Path('artifacts/social-live-verdict.json').write_text(json.dumps(verdict,indent=2,sort_keys=True)); Path('artifacts/social-live-status.txt').write_text(verdict['status']+'\n'); print(json.dumps(verdict,indent=2,sort_keys=True))
          if not passed: raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-social-golden-live-${{ github.run_id }}
          path: |
            artifacts/social-live-progress.json
            artifacts/social-live.json
            artifacts/social-live-live-events.jsonl
            artifacts/social-live-predictions.json
            artifacts/social-live-economics.json
            artifacts/social-live-verdict.json
            artifacts/social-live-status.txt
          if-no-files-found: warn
          retention-days: 30
