name: E4 V12 pre-impact research

on:
  push:
    branches:
      - codex/e4-v12-preimpact-execution
    paths:
      - "scripts/e4_v12_preimpact_model.py"
      - "tests/test_v12_preimpact_model.py"
      - ".github/workflows/e4-v12-preimpact-research.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Causality unit tests
        run: python -m unittest tests.test_v12_preimpact_model -v

      - name: Download six frozen 3000-launch samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p samples artifacts
          for run in 33741470396 33769636983 33781389703 33792881280 33810753028 33822988156; do
            mkdir -p "samples/$run"
            gh run download "$run" \
              --repo profitpirate/Gambit-Jr \
              --name "e4-v12-forward-$run" \
              --dir "samples/$run"
          done

      - name: Learn on first four, judge on newest two
        run: |
          python scripts/e4_v12_preimpact_model.py \
            --train samples/33741470396/artifacts/e4-v12-forward-batch.json:samples/33741470396/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --train samples/33769636983/artifacts/e4-v12-forward-batch.json:samples/33769636983/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --train samples/33781389703/artifacts/e4-v12-forward-batch.json:samples/33781389703/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --train samples/33792881280/artifacts/e4-v12-forward-batch.json:samples/33792881280/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --holdout samples/33810753028/artifacts/e4-v12-forward-batch.json:samples/33810753028/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --holdout samples/33822988156/artifacts/e4-v12-forward-batch.json:samples/33822988156/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --output artifacts/e4-v12-preimpact-model.json

      - uses: actions/upload-artifact@v4
        with:
          name: e4-v12-preimpact-${{ github.run_id }}
          path: artifacts/e4-v12-preimpact-model.json
          retention-days: 30
