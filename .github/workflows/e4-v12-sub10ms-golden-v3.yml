name: E4 V12 sub-10ms golden thesis v3

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - ".github/workflows/e4-v12-sub10ms-golden-v3.yml"
      - "research/e4-v12-golden-v3-trigger*.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  SOURCE_BRANCH: codex/e4-v12-selection-reconstruction
  RESEARCH_BRANCH: codex/e4-v12-sub10ms-entry-research-20260905
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/strict-race-proxy-v12.mjs"
  E4_BUILDER_PRELOAD: "${{ github.workspace }}/tools/e4-builder/fast-preload-v4.mjs"
  E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
  E4_V12_BUY_SLIPPAGE_BPS: "800"
  E4_V12_MAX_OUTPUT_SHORTFALL_BPS: "800"

concurrency:
  group: e4-v12-sub10ms-golden-v3
  cancel-in-progress: true

jobs:
  historical-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      status: ${{ steps.select.outputs.status }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Compile, regress and prove repaired hot path
        run: |
          python -m unittest tests.test_v12_true_latency_replay -v
          python -m unittest tests.test_v12_tight_output -v
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python -m compileall -q \
            scripts/e4_v12_true_latency_replay.py \
            scripts/e4_v12_true_latency_replay_v2.py \
            scripts/e4_v12_golden_thesis_search.py \
            scripts/e4_v12_reactive_guard_search.py \
            scripts/e4_v12_reactive_guard_search_v2.py \
            scripts/e4_v12_hotpath_benchmark.py \
            src/memecoin_bot/e4_tight_output_v12.py \
            src/memecoin_bot/e4_strict_output_v12.py
          node --check tools/e4-builder/strict-race-proxy-v12.mjs
          E4_BUILDER_ALLOW_REMOTE_FALLBACK=false node tools/e4-builder/race-proxy-v3.mjs --self-test
          mkdir -p artifacts
          python -m scripts.e4_v12_hotpath_benchmark \
            --iterations 500 \
            --warmup 50 \
            --maximum-p95-ms 10 \
            --output artifacts/e4-v12-hotpath-benchmark.json

      - name: Download ten chronological immutable live launch windows
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" \
            --workflow e4-v12-selection-certification.yml \
            --branch "$SOURCE_BRANCH" \
            --status success \
            --limit 16 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          test "$(wc -l < /tmp/run_ids)" -eq 10
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" \
              --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            test -s "$batch"
            test -s "$events"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/pairs.tsv
          done < /tmp/run_ids

      - name: Search pre-impact identity/flow thesis
        continue-on-error: true
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/pairs.tsv
          python -m scripts.e4_v12_golden_thesis_search \
            --mode search "${args[@]}" \
            --horizon-ms 750 \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --max-output-shortfall-bps 800 \
            --minimum-win-rate 0.65 \
            --minimum-profit-factor 1.25 \
            --output artifacts/preimpact-report.json \
            --model-output artifacts/preimpact-model.joblib \
            --predictions-output artifacts/preimpact-holdout-predictions.json

      - name: Search E4-confirmed reactive tight-output thesis
        continue-on-error: true
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/pairs.tsv
          python -m scripts.e4_v12_reactive_guard_search_v2 \
            --mode search "${args[@]}" \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --minimum-win-rate 0.65 \
            --minimum-profit-factor 1.25 \
            --output artifacts/reactive-report.json \
            --model-output artifacts/reactive-model.json \
            --predictions-output artifacts/reactive-holdout-predictions.json

      - name: Select only a fully historical-confirmed thesis
        id: select
        if: always()
        run: |
          python - <<'PY'
          import json, math, shutil
          from pathlib import Path

          candidates=[]
          for mode,path in [('preimpact',Path('artifacts/preimpact-report.json')),('reactive',Path('artifacts/reactive-report.json'))]:
              if not path.exists(): continue
              report=json.loads(path.read_text())
              if report.get('status')!='HISTORICAL_HOLDOUT_CONFIRMED': continue
              blocks=((report.get('holdout') or {}).get('economics') if mode=='preimpact' else report.get('holdout')) or {}
              if not blocks: continue
              worst_wr=min(float(v.get('win_rate') or 0) for v in blocks.values())
              worst_low=min(float(v.get('wilson_low') or 0) for v in blocks.values())
              worst_pf=min(float(v.get('profit_factor') or 0) for v in blocks.values())
              pnl=sum(float(v.get('net_pnl_sol') or 0) for v in blocks.values())
              trades=min(int(v.get('trades') or 0) for v in blocks.values())
              candidates.append(((worst_wr,worst_low,worst_pf,pnl,trades),mode,report))
          candidates.sort(key=lambda row:row[0],reverse=True)
          if not candidates:
              selected={'version':'e4-v12-golden-selector-v3','status':'NOT_CONCLUSIVE','mode':'none'}
          else:
              score,mode,report=candidates[0]
              selected={'version':'e4-v12-golden-selector-v3','status':'HISTORICAL_HOLDOUT_CONFIRMED','mode':mode,'score':list(score),'report_version':report.get('version')}
          Path('artifacts/selected-thesis.json').write_text(json.dumps(selected,indent=2,sort_keys=True))
          Path('artifacts/selected-status.txt').write_text(selected['status']+'\n')
          Path('artifacts/selected-mode.txt').write_text(selected['mode']+'\n')
          print(json.dumps(selected,indent=2,sort_keys=True))
          PY
          status="$(cat artifacts/selected-status.txt)"
          mode="$(cat artifacts/selected-mode.txt)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-v3-historical-${{ github.run_id }}
          path: |
            artifacts/e4-v12-hotpath-benchmark.json
            artifacts/preimpact-report.json
            artifacts/preimpact-model.joblib
            artifacts/preimpact-holdout-predictions.json
            artifacts/reactive-report.json
            artifacts/reactive-model.json
            artifacts/reactive-holdout-predictions.json
            artifacts/selected-thesis.json
            artifacts/selected-status.txt
            artifacts/selected-mode.txt
          if-no-files-found: warn
          retention-days: 30

  untouched-live-confirmation:
    needs: historical-selection
    if: needs.historical-selection.outputs.status == 'HISTORICAL_HOLDOUT_CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-golden-v3-historical-${{ github.run_id }}
          path: artifacts

      - name: Restore frozen causal history
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" \
            --workflow e4-v12-selection-certification.yml \
            --branch "$SOURCE_BRANCH" \
            --status success \
            --limit 16 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" --name "e4-v12-forward-$run_id" --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/history-pairs.tsv
          done < /tmp/run_ids

      - name: Capture brand-new untouched 3000-launch live window
        run: |
          export E4_HOLDOUT_PROGRESS_PATH=artifacts/e4-v12-golden-live-progress.json
          python scripts/e4_300_launch_holdout_v12.py \
            --target-launches 3000 \
            --capture-seconds 14400 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 1500 \
            --builder-probes 250 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output artifacts/e4-v12-golden-live.json

      - name: Apply selected frozen thesis without live tuning
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do args+=(--pair "$batch:$events"); done < /tmp/history-pairs.tsv
          args+=(--pair "artifacts/e4-v12-golden-live.json:artifacts/e4-v12-golden-live-live-events.jsonl")
          mode="$(cat artifacts/selected-mode.txt)"
          if [ "$mode" = preimpact ]; then
            python -m scripts.e4_v12_golden_thesis_search \
              --mode apply "${args[@]}" \
              --model-input artifacts/preimpact-model.joblib \
              --predictions-output artifacts/live-predictions.json
            echo 800 > artifacts/live-guard-bps.txt
          elif [ "$mode" = reactive ]; then
            python -m scripts.e4_v12_reactive_guard_search_v2 \
              --mode apply "${args[@]}" \
              --model-input artifacts/reactive-model.json \
              --output artifacts/reactive-live-apply.json \
              --model-output artifacts/reactive-live-unused.json \
              --predictions-output artifacts/live-predictions.json
            jq -r '.rule.max_output_shortfall_bps' artifacts/reactive-model.json > artifacts/live-guard-bps.txt
          else
            echo 'No selected mode' >&2; exit 1
          fi

      - name: Rebuild every fresh trade independently at 0-10ms
        run: |
          guard="$(cat artifacts/live-guard-bps.txt)"
          python -m scripts.e4_v12_true_latency_replay_v2 \
            --batch artifacts/e4-v12-golden-live.json \
            --events artifacts/e4-v12-golden-live-live-events.jsonl \
            --predictions artifacts/live-predictions.json \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --entry-fraction 0.0185 \
            --fee-bps 125 \
            --max-output-shortfall-bps "$guard" \
            --confirmation-ms 1500 \
            --max-concurrent 2 \
            --output artifacts/live-economics.json

      - name: Require high live WR at every tested latency
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          data=json.loads(Path('artifacts/live-economics.json').read_text())
          rows={}; passed=True
          for latency,block in data['results'].items():
              m=block['all_predictions']; n=int(m.get('closed') or 0); w=int(m.get('wins') or 0)
              wr=float(m.get('win_rate') or 0); pnl=float(m.get('net_pnl_sol') or 0)
              raw_pf=m.get('profit_factor')
              pf=float(raw_pf) if raw_pf is not None and math.isfinite(float(raw_pf)) else (999.0 if pnl>0 and n>0 and w==n else 0.0)
              if n:
                  z=1.96; p=w/n; den=1+z*z/n
                  low=max(0.0,(p+z*z/(2*n)-z*math.sqrt((p*(1-p)+z*z/(4*n))/n))/den)
              else: low=0.0
              ok=n>=4 and wr>=0.65 and low>=0.30 and pnl>0 and pf>=1.25
              rows[latency]={'trades':n,'wins':w,'win_rate':wr,'wilson_low':low,'net_pnl_sol':pnl,'profit_factor':pf,'passed':ok}
              passed=passed and ok
          selector=json.loads(Path('artifacts/selected-thesis.json').read_text())
          verdict={'version':'e4-v12-golden-live-verdict-v3','status':'FOUND_LIVE_SUB10MS_GOLDEN_THESIS' if passed else 'NOT_CONCLUSIVE','selected_mode':selector.get('mode'),'latencies':rows,'untouched_live':True,'starting_balance_sol':3.0,'no_live_tuning':True}
          Path('artifacts/live-verdict.json').write_text(json.dumps(verdict,indent=2,sort_keys=True))
          Path('artifacts/live-status.txt').write_text(verdict['status']+'\n')
          print(json.dumps(verdict,indent=2,sort_keys=True))
          if not passed: raise SystemExit(1)
          PY

      - name: Persist only a fully confirmed candidate
        if: success()
        run: |
          mkdir -p docs/research models/e4/research
          cp artifacts/selected-thesis.json docs/research/e4-v12-golden-selector.json
          cp artifacts/live-verdict.json docs/research/e4-v12-golden-live-verdict.json
          cp artifacts/preimpact-report.json docs/research/e4-v12-preimpact-report.json 2>/dev/null || true
          cp artifacts/reactive-report.json docs/research/e4-v12-reactive-report.json 2>/dev/null || true
          cp artifacts/preimpact-model.joblib models/e4/research/e4-v12-preimpact-model.joblib 2>/dev/null || true
          cp artifacts/reactive-model.json models/e4/research/e4-v12-reactive-model.json 2>/dev/null || true
          git config user.name 'gambit-v12-research'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/research models/e4/research
          if ! git diff --cached --quiet; then
            git commit -m 'research(e4-v12): persist live-confirmed sub-10ms golden thesis [skip ci]'
            git push origin HEAD:"$RESEARCH_BRANCH"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-v3-live-${{ github.run_id }}
          path: |
            artifacts/e4-v12-golden-live-progress.json
            artifacts/e4-v12-golden-live.json
            artifacts/e4-v12-golden-live-live-events.jsonl
            artifacts/live-predictions.json
            artifacts/live-guard-bps.txt
            artifacts/live-economics.json
            artifacts/live-verdict.json
            artifacts/live-status.txt
          if-no-files-found: warn
          retention-days: 30
