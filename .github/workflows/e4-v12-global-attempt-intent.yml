name: E4 V12 global attempt intent autopsy

on:
  push:
    branches:
      - codex/e4-v12-matched-controls
    paths:
      - "scripts/e4_v12_global_attempt_intent.py"
      - ".github/workflows/e4-v12-global-attempt-intent.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  global-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip aiohttp
      - run: python -m py_compile scripts/e4_v12_global_attempt_intent.py

      - name: Download all twelve frozen 3000-launch samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p samples research artifacts
          for run in 33605109571 33627431540 33644544746 33656916992 33669514091 33681664773 33692043170 33704841852 33716649440 33741470396 33792881280 33822988156; do
            mkdir -p "samples/$run"
            gh run download "$run" \
              --repo profitpirate/Gambit-Jr \
              --name "e4-v12-forward-$run" \
              --dir "samples/$run"
          done

      - name: Download failed E4 attempt mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33883557623 \
            --repo profitpirate/Gambit-Jr \
            --name e4-v12-attempt-mint-forensics-33883557623 \
            --dir research

      - name: Test every plausible launch and contemporaneous control
        run: |
          python scripts/e4_v12_global_attempt_intent.py \
            --pair samples/33605109571/artifacts/e4-v12-forward-batch.json:samples/33605109571/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33627431540/artifacts/e4-v12-forward-batch.json:samples/33627431540/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33644544746/artifacts/e4-v12-forward-batch.json:samples/33644544746/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33656916992/artifacts/e4-v12-forward-batch.json:samples/33656916992/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33669514091/artifacts/e4-v12-forward-batch.json:samples/33669514091/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33681664773/artifacts/e4-v12-forward-batch.json:samples/33681664773/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33692043170/artifacts/e4-v12-forward-batch.json:samples/33692043170/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33704841852/artifacts/e4-v12-forward-batch.json:samples/33704841852/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33716649440/artifacts/e4-v12-forward-batch.json:samples/33716649440/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33741470396/artifacts/e4-v12-forward-batch.json:samples/33741470396/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33792881280/artifacts/e4-v12-forward-batch.json:samples/33792881280/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair samples/33822988156/artifacts/e4-v12-forward-batch.json:samples/33822988156/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --attempts research/e4-v12-attempt-mint-forensics.json \
            --history models/e4/e4-creator-expectancy.json \
            --metadata-concurrency 96 \
            --metadata-timeout 5 \
            --output artifacts/e4-v12-global-attempt-intent.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-global-attempt-intent-${{ github.run_id }}
          path: artifacts/e4-v12-global-attempt-intent.json
          if-no-files-found: warn
          retention-days: 30
