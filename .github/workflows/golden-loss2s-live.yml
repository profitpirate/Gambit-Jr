name: Golden 2s loss-exit A-B - live Solana paper
on:
  push:
    branches: [codex/golden-2s-loss-exit-live]
    paths:
      - '.github/workflows/golden-loss2s-live.yml'
      - 'docs/research/golden-loss2s-launch.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: golden-loss2s-solana-campaign
  cancel-in-progress: false

jobs:
  forward-live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/golden-2s-loss-exit-live
      PYTHONPATH: tools:tests
      PYTHONUNBUFFERED: '1'
      LIVE_SEGMENT_SECONDS: '2700'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-2s-loss-exit-live
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned read-only network dependency
        run: python -m pip install aiohttp==3.14.3

      - name: Install live heartbeat lease shim
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/migration_route_bridge.py')
          s=p.read_text()
          needle="                    data=dict(data)\n                    data.update("
          replacement=(
              "                    data=dict(data)\n"
              "                    data['heartbeat_ns']=time.time_ns()\n"
              "                    data['lease_expires_ns']=data['heartbeat_ns']+90_000_000_000\n"
              "                    data['liveness_contract']='collector_active is valid only while heartbeat lease is unexpired; Actions run state is authoritative'\n"
              "                    data.update("
          )
          if s.count(needle) != 1:
              raise SystemExit('heartbeat lease injection point changed')
          p.write_text(s.replace(needle,replacement))
          PY
          python -m py_compile tools/migration_route_bridge.py tools/golden_live_checkpoint.py

      - name: Verify frozen parents and prepare A-B manifest
        run: |
          set -euo pipefail
          mkdir -p artifacts/build
          git rev-parse HEAD > artifacts/build/source-commit.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          f=json.load(open('docs/research/golden-full3s-v2-freeze.json'))
          for p,h in f['source_sha256'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          PY
          python -m py_compile tools/golden_loss2s_*.py tools/migration_route_bridge.py tools/golden_live_checkpoint.py
          python tools/migration_route_bridge.py self-test
          python -m unittest tests.test_golden_loss2s tests.test_golden_top4_eventstream_fix -v 2>&1 | tee artifacts/build/loss2s-tests.log
          python tools/golden_loss2s_campaign.py --prepare
          cp config/golden-loss2s-live.json artifacts/build/manifest.json
          cp docs/research/golden-loss2s-experiment-contract.json artifacts/build/

      - uses: actions/checkout@v4
        with:
          ref: 8c18f0fffe67500012a18d2dee983b81e2abb938
          path: production
          sparse-checkout: src/memecoin_bot/realtime/pumpfun.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Restore frozen prior reputation corpus - not live outcomes
        run: |
          mkdir -p frozen
          gh run download 34262315056 --repo "$GITHUB_REPOSITORY" --name e4-v12-allout-launch-corpus-34262315056 --dir frozen
          corpus="$(find frozen -name e4-v12-allout-launch-corpus.jsonl.gz -print -quit)"
          test -s "$corpus"
          echo "CORPUS=$corpus" >> "$GITHUB_ENV"

      - name: Fresh Solana and E4 connectivity check - no positions
        run: |
          python tools/golden_loss2s_solana.py \
            --production-root production \
            --corpus "$CORPUS" \
            --manifest config/golden-loss2s-live.json \
            --output artifacts/smoke \
            --duration 60 \
            --smoke > artifacts/build/live-preflight.log 2>&1
          cat artifacts/smoke/readiness.json

      - name: Resumable live six-model A-B segment with durable clean checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/live artifacts/build
          rm -f artifacts/live/stop-checkpoint-publisher
          python tools/golden_live_checkpoint.py \
            --kind loss2s --root artifacts/live --branch "$BRANCH" \
            > artifacts/build/checkpoint-publisher.log 2>&1 &
          checkpoint_pid=$!
          cleanup_checkpoint() {
            touch artifacts/live/stop-checkpoint-publisher
            wait "$checkpoint_pid" || true
          }
          trap cleanup_checkpoint EXIT
          python tools/migration_route_bridge.py campaign --kind loss2s --corpus "$CORPUS" --duration "$LIVE_SEGMENT_SECONDS"

      - name: Preserve sources and evidence regardless of completion
        if: always()
        run: |
          mkdir -p artifacts/source
          cp tools/golden_loss2s_*.py artifacts/source/
          cp tools/migration_route_bridge.py artifacts/source/
          cp tools/golden_live_checkpoint.py artifacts/source/
          cp config/golden-loss2s-live.json artifacts/source/ 2>/dev/null || true
          cp docs/research/golden-loss2s-experiment-contract.json artifacts/source/
          cp .github/workflows/golden-loss2s-live.yml artifacts/source/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-loss2s-solana-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 60
          if-no-files-found: error
