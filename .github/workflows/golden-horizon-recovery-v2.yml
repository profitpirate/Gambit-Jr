name: Golden horizons - audited recovery continuation v2

on:
  push:
    branches: [codex/golden-2s-horizon-cost-tournament]
    paths:
      - '.github/workflows/golden-horizon-recovery-v2.yml'
      - 'docs/research/golden-horizon-launch.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: golden-horizon-cost-campaign
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH: codex/golden-2s-horizon-cost-tournament
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools:scripts:tests
  STATE_PATH: docs/research/golden-horizon-state.json
  STATUS_PATH: docs/research/golden-horizon-status.json
  PHASE2_PATH: docs/research/golden-horizon-phase2-complete.json
  PHASE3_PATH: docs/research/golden-horizon-phase3-complete.json
  RESULTS_PATH: docs/research/golden-horizon-final-results.json
  REPORT_PATH: docs/research/golden-horizon-final-report.md

jobs:
  phase2-continue:
    name: Phase 2 - continue verified fresh-live cohort to 100
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      complete: ${{ steps.gate.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependency
        run: python -m pip install aiohttp==3.14.3
      - uses: actions/checkout@v4
        with:
          ref: 8c18f0fffe67500012a18d2dee983b81e2abb938
          path: production
          sparse-checkout: src/memecoin_bot/realtime/pumpfun.py
          sparse-checkout-cone-mode: false

      - name: Apply audited infrastructure-only compatibility patches locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/golden_horizon_live.py')
          s=p.read_text()
          old='"maxSupportedTransactionVersion": 0'
          assert old in s
          s=s.replace(old,'"maxSupportedTransactionVersion": 1')
          old='if resume and any(x.get("errors") for x in resume.get("sessions", [])):'
          new='if resume and any(x.get("errors") and (x.get("incident_recovery") or {}).get("status") != "VERIFIED" for x in resume.get("sessions", [])):'
          assert old in s
          s=s.replace(old,new)
          old='"source_sha": source_sha, "reputation_delta": delta, "engine": engine.persistence(),'
          new='"source_sha": source_sha, "reputation_delta": delta, "recoveries": copy.deepcopy(resume.get("recoveries", [])) if resume else [], "engine": engine.persistence(),'
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('tools/golden_horizon_report.py')
          s=p.read_text()
          old='if not state.get("sessions") or any(s["errors"] or s.get("historical_replay") is not False for s in state["sessions"]):'
          new='if not state.get("sessions") or any((s["errors"] and (s.get("incident_recovery") or {}).get("status") != "VERIFIED") or s.get("historical_replay") is not False for s in state["sessions"]):'
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python -m py_compile tools/golden_horizon_live.py tools/golden_horizon_report.py

      - name: Restore exact frozen reputation corpus
        run: |
          mkdir -p frozen
          gh run download 34262315056 --repo "$GITHUB_REPOSITORY" --name e4-v12-allout-launch-corpus-34262315056 --dir frozen
          corpus="$(find frozen -name e4-v12-allout-launch-corpus.jsonl.gz -print -quit)"
          test -s "$corpus"
          echo "CORPUS=$corpus" >> "$GITHUB_ENV"

      - name: Restore audited clean 75-trade recovery checkpoint
        run: |
          mkdir -p artifacts/recovered artifacts/live artifacts/phase2
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10431319876/zip" \
            -o /tmp/recovery.zip
          echo '4a65fce580f37e52efaf1c12f62daf75ec9e4576759f1d7e98d2f9aa057fd806  /tmp/recovery.zip' | sha256sum -c -
          unzip -q /tmp/recovery.zip -d artifacts/recovered
          base="$(find artifacts/recovered -name base-state.json -print -quit)"
          test -s "$base"
          cp "$base" artifacts/live/resume.json
          python - <<'PY'
          import json
          from golden_horizon_engine import Config,Engine
          s=json.load(open('artifacts/live/resume.json'))
          e=Engine(Config(**s['engine']['config']),s['engine']);e.validate()
          assert e.matched_closed() == 75
          assert s['engine']['clean'] and not s['engine']['bundles'] and not s['engine']['errors']
          assert all(not x.get('errors') or (x.get('incident_recovery') or {}).get('status')=='VERIFIED' for x in s['sessions'])
          assert any((x.get('incident_recovery') or {}).get('status')=='VERIFIED' for x in s['sessions'])
          for h in e.history:
              assert (h.get('creation_proof') or {}).get('verified') is True
          print('AUDITED_RECOVERY_CHECKPOINT',e.matched_closed())
          PY

      - name: Continue only on newly arriving real Solana launches
        run: |
          python tools/golden_horizon_publish.py --local artifacts/live/status.json \
            --remote "$STATUS_PATH" --watch --stop-file artifacts/stop-publisher > artifacts/publisher.log 2>&1 &
          publisher=$!
          cleanup() { touch artifacts/stop-publisher; kill "$publisher" 2>/dev/null || true; wait "$publisher" 2>/dev/null || true; }
          trap cleanup EXIT
          set +e
          python tools/golden_horizon_live.py --production-root production --corpus "$CORPUS" \
            --manifest config/golden-horizon.json --output artifacts/live \
            --window "audited-continuation-v2-${GITHUB_RUN_ID}" --duration 14400 --target 100 \
            --resume artifacts/live/resume.json
          rc=$?
          set -e
          cleanup
          trap - EXIT
          test -s artifacts/live/state.json
          test -s artifacts/live/status.json
          if [ "$rc" -ne 0 ]; then
            echo '::error::Fresh-live continuation failed. Artifact preserves all evidence; no older checkpoint will overwrite it.'
            exit "$rc"
          fi

      - name: Validate clean state and gate Phase 2 only at 100
        id: gate
        run: |
          python - <<'PY'
          import json
          from golden_horizon_engine import Config,Engine
          s=json.load(open('artifacts/live/state.json'))
          e=Engine(Config(**s['engine']['config']),s['engine']);e.validate()
          assert s['engine']['clean'] and not s['engine']['bundles'] and not s['engine']['errors']
          assert all(not x.get('errors') or (x.get('incident_recovery') or {}).get('status')=='VERIFIED' for x in s['sessions'])
          for h in e.history:
              assert (h.get('creation_proof') or {}).get('verified') is True
          print('CLEAN_MATCHED',e.matched_closed())
          PY
          count="$(python - <<'PY'
          import json
          from golden_horizon_engine import Config,Engine
          s=json.load(open('artifacts/live/state.json'));e=Engine(Config(**s['engine']['config']),s['engine'])
          print(e.matched_closed())
          PY
          )"
          if [ "$count" -ge 100 ]; then
            python tools/golden_horizon_report.py --state artifacts/live/state.json --output artifacts/phase2 --gate-only
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo "Clean checkpoint, NOT completion: $count / 100"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Persist clean continuation without discarding any evidence
        run: |
          cp artifacts/live/state.json /tmp/horizon-state.json
          python - <<'PY'
          import json,time
          from golden_horizon_engine import Config,Engine
          s=json.load(open('/tmp/horizon-state.json'));e=Engine(Config(**s['engine']['config']),s['engine'])
          out={'phase':2,'status':'COMPLETE' if e.matched_closed()>=100 else 'CLEAN_WINDOW_END',
               'checked_ns':time.time_ns(),'matched_closed':e.matched_closed(),'target':100,
               'active_bundles':0,'errors':[],'paper_only':True,'axiom_execution':False,
               'actual_profit_sol':None,'actual_transaction_failures':None,'arms':e.summary(),
               'incident_recovery':s.get('recoveries',[])[-1] if s.get('recoveries') else None}
          open('/tmp/horizon-status.json','w').write(json.dumps(out,sort_keys=True)+'\n')
          PY
          git restore tools/golden_horizon_live.py tools/golden_horizon_report.py
          git fetch origin "$BRANCH"
          git checkout -B evidence FETCH_HEAD
          cp /tmp/horizon-state.json "$STATE_PATH"
          cp /tmp/horizon-status.json "$STATUS_PATH"
          if [ -s artifacts/phase2/phase2-complete.json ]; then cp artifacts/phase2/phase2-complete.json "$PHASE2_PATH"; fi
          git config user.name gambit-horizon-research
          git config user.email actions@users.noreply.github.com
          git add "$STATE_PATH" "$STATUS_PATH"
          if [ -s "$PHASE2_PATH" ]; then git add "$PHASE2_PATH"; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(horizon): persist audited fresh-live continuation [skip ci]'
            git push origin HEAD:"$BRANCH"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-horizon-audited-continuation-v2-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 60

  phase3-report:
    name: Phase 3 - generate verified final results and report
    needs: phase2-continue
    if: needs.phase2-continue.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-2s-horizon-cost-tournament
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch report gate locally for the verified preserved incident
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/golden_horizon_report.py');s=p.read_text()
          old='if not state.get("sessions") or any(s["errors"] or s.get("historical_replay") is not False for s in state["sessions"]):'
          new='if not state.get("sessions") or any((s["errors"] and (s.get("incident_recovery") or {}).get("status") != "VERIFIED") or s.get("historical_replay") is not False for s in state["sessions"]):'
          assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          python -m py_compile tools/golden_horizon_report.py
      - name: Generate reports from canonical verified state
        run: |
          mkdir -p artifacts/final
          cp "$STATE_PATH" artifacts/final/state.json
          python tools/golden_horizon_report.py --state artifacts/final/state.json --output artifacts/final
          cp config/golden-horizon.json artifacts/final/manifest.json
          echo "$GITHUB_SHA" > artifacts/final/source-sha.txt
      - name: Persist hashed Phase 3 reports
        run: |
          cp artifacts/final/final-results.json /tmp/final-results.json
          cp artifacts/final/final-report.md /tmp/final-report.md
          cp artifacts/final/phase3-complete.json /tmp/phase3-complete.json
          git restore tools/golden_horizon_report.py
          git fetch origin "$BRANCH"
          git checkout -B evidence FETCH_HEAD
          cp /tmp/final-results.json "$RESULTS_PATH"
          cp /tmp/final-report.md "$REPORT_PATH"
          cp /tmp/phase3-complete.json "$PHASE3_PATH"
          git config user.name gambit-horizon-research
          git config user.email actions@users.noreply.github.com
          git add "$RESULTS_PATH" "$REPORT_PATH" "$PHASE3_PATH"
          if ! git diff --cached --quiet; then
            git commit -m 'research(horizon): publish verified Phase 3 report [skip ci]'
            git push origin HEAD:"$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: golden-horizon-final-v2-${{ github.run_id }}
          path: artifacts/final/
          retention-days: 60
