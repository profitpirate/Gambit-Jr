name: E4 V11 final market repairs

on:
  push:
    branches:
      - codex/e4-v11-final
    paths:
      - "scripts/e4_v11_market_repairs.py"
      - ".github/workflows/e4-v11-market-repair.yml"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_PIPELINES_BACKGROUND: "false"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"

jobs:
  repair-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v11-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - name: Apply V11 market repairs
        run: python scripts/e4_v11_market_repairs.py
      - name: Compile repaired runtime
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_hardening_v10.py \
            src/memecoin_bot/e4_pipelines_v10.py \
            scripts/e4_live_market_stress.py \
            scripts/e4_300_launch_holdout.py
          node --check tools/e4-builder/race-proxy-v3.mjs
          node --check tools/e4-builder/fast-preload-v4.mjs
      - name: Full E4 regression
        run: python -m unittest discover -s tests -p "test_e4*.py" -v
      - name: Builder self-test
        run: node tools/e4-builder/race-proxy-v3.mjs --self-test
      - name: Repair-specific assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('src/memecoin_bot/e4_hardening_v10.py').read_text()
          r=Path('src/memecoin_bot/e4_pipelines_v10.py').read_text()
          m=Path('scripts/e4_live_market_stress.py').read_text()
          assert 'trades >= 3 and wins >= 2 and rate >= 0.60' in h
          assert 'trades >= 3 and wins >= 2 and rate >= 0.60' in r
          assert 'entry FDV above observed E4 envelope' in h
          assert 'scenarios["36ms"]' in m
          assert 'race-proxy-v3.mjs' in m
          assert 'entry_price > max_price' in m
          print('V11 market repair assertions passed')
          PY
      - name: Persist repaired source
        run: |
          git config user.name 'gambit-v11-finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/memecoin_bot/e4_hardening_v10.py \
            src/memecoin_bot/e4_pipelines_v10.py \
            scripts/e4_live_market_stress.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(e4): harden V11 market entry and validation [skip ci]'
            git push origin HEAD:codex/e4-v11-final
          fi
