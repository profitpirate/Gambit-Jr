name: E4 V12 strict causal thesis rerun

on:
  push:
    branches:
      - codex/e4-v12-matched-controls
    paths:
      - "scripts/e4_v12_strict_causal_history.py"
      - "scripts/e4_v12_conclusive_entry_strict.py"
      - "scripts/e4_v12_ranked_multimode_strict.py"
      - "scripts/e4_v12_conditional_choice_strict.py"
      - ".github/workflows/e4-v12-strict-thesis-rerun.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  strict-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install aiohttp numpy scikit-learn

      - name: Compile every leak-free thesis
        run: |
          python -m py_compile scripts/e4_v12_strict_causal_history.py
          python -m py_compile scripts/e4_v12_conclusive_entry_rerun.py
          python -m py_compile scripts/e4_v12_conclusive_entry_strict.py
          python -m py_compile scripts/e4_v12_ranked_multimode_search.py
          python -m py_compile scripts/e4_v12_ranked_multimode_fast.py
          python -m py_compile scripts/e4_v12_ranked_multimode_strict.py
          python -m py_compile scripts/e4_v12_conditional_choice_ranker.py
          python -m py_compile scripts/e4_v12_conditional_choice_strict.py

      - name: Download ten chronological frozen live samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p samples cache/attempts cache/metadata artifacts/strict
          for run in 33741470396 33769636983 33781389703 33792881280 33810753028 33822988156 33835575805 33852482054 33876345997 33897368379; do
            mkdir -p "samples/$run"
            gh run download "$run" --repo profitpirate/Gambit-Jr --name "e4-v12-forward-$run" --dir "samples/$run"
          done
          gh run download 33883557623 --repo profitpirate/Gambit-Jr --dir cache/attempts/base
          gh run download 33913332895 --repo profitpirate/Gambit-Jr --dir cache/attempts/latest || true
          gh run download 33889403746 --repo profitpirate/Gambit-Jr --dir cache/metadata/global
          gh run download 33912828449 --repo profitpirate/Gambit-Jr --dir cache/metadata/latest

      - name: Define shared data arguments
        run: |
          cat > /tmp/e4-data-args <<'EOF'
          --pair samples/33741470396/artifacts/e4-v12-forward-batch.json:samples/33741470396/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33769636983/artifacts/e4-v12-forward-batch.json:samples/33769636983/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33781389703/artifacts/e4-v12-forward-batch.json:samples/33781389703/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33792881280/artifacts/e4-v12-forward-batch.json:samples/33792881280/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33810753028/artifacts/e4-v12-forward-batch.json:samples/33810753028/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33822988156/artifacts/e4-v12-forward-batch.json:samples/33822988156/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33835575805/artifacts/e4-v12-forward-batch.json:samples/33835575805/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33852482054/artifacts/e4-v12-forward-batch.json:samples/33852482054/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33876345997/artifacts/e4-v12-forward-batch.json:samples/33876345997/artifacts/e4-v12-forward-batch-live-events.jsonl
          --pair samples/33897368379/artifacts/e4-v12-forward-batch.json:samples/33897368379/artifacts/e4-v12-forward-batch-live-events.jsonl
          --attempts cache/attempts
          --metadata-cache cache/metadata
          --creator-history models/e4/e4-creator-expectancy.json
          EOF

      - name: Strict chronological multimode logistic
        continue-on-error: true
        run: |
          python scripts/e4_v12_conclusive_entry_strict.py \
            $(tr '\n' ' ' < /tmp/e4-data-args) \
            --output artifacts/strict/logistic-report.json \
            --model-output artifacts/strict/logistic-model.json

      - name: Strict chronological ranked nonlinear and distilled tree
        continue-on-error: true
        run: |
          python scripts/e4_v12_ranked_multimode_strict.py \
            $(tr '\n' ' ' < /tmp/e4-data-args) \
            --output artifacts/strict/ranked-report.json \
            --model-output artifacts/strict/ranked-model.json

      - name: Strict chronological exact-time conditional choice ranker
        continue-on-error: true
        run: |
          python scripts/e4_v12_conditional_choice_strict.py \
            $(tr '\n' ' ' < /tmp/e4-data-args) \
            --controls-per-set 30 \
            --create-window-ms 750 \
            --output artifacts/strict/choice-report.json \
            --model-output artifacts/strict/choice-model.json

      - name: Select only a causally confirmed candidate
        id: select
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/strict')
          candidates = []
          layouts = {
              'logistic': ('logistic-report.json', 'logistic-model.json'),
              'ranked': ('ranked-report.json', 'ranked-model.json'),
              'conditional_choice': ('choice-report.json', 'choice-model.json'),
          }

          def metric(report, method, section, key):
              value = report.get(section, {})
              if method == 'ranked' and section == 'validation':
                  value = report.get('distilled_runtime', {}).get('validation', {})
              if method == 'ranked' and section == 'live_holdout':
                  value = report.get('distilled_runtime', {}).get('live_holdout', {})
              return float(value.get(key) or 0.0)

          for method, (report_name, model_name) in layouts.items():
              rp = root / report_name
              mp = root / model_name
              if not rp.exists() or not mp.exists():
                  continue
              report = json.loads(rp.read_text())
              status = str(report.get('status') or 'UNKNOWN')
              validation_precision = metric(report, method, 'validation', 'precision')
              validation_recall = metric(report, method, 'validation', 'recall')
              live_precision = metric(report, method, 'live_holdout', 'precision')
              live_recall = metric(report, method, 'live_holdout', 'recall')
              walk = report.get('walk_forward', {}) if method != 'ranked' else report.get('ensemble', {}).get('walk_forward', {})
              walk_precision = float(walk.get('precision') or 0.0)
              walk_recall = float(walk.get('recall') or 0.0)
              score = (
                  int(status == 'LIVE_HOLDOUT_CONFIRMED'),
                  min(validation_precision, live_precision, walk_precision),
                  min(validation_recall, live_recall, walk_recall),
                  live_precision,
                  live_recall,
              )
              candidates.append({
                  'method': method,
                  'status': status,
                  'score': score,
                  'report_path': str(rp),
                  'model_path': str(mp),
                  'validation_precision': validation_precision,
                  'validation_recall': validation_recall,
                  'walk_precision': walk_precision,
                  'walk_recall': walk_recall,
                  'live_precision': live_precision,
                  'live_recall': live_recall,
              })

          candidates.sort(key=lambda item: item['score'], reverse=True)
          winner = candidates[0] if candidates else None
          selected = {
              'version': 'e4-v12-strict-thesis-selection-v1',
              'status': 'LIVE_HOLDOUT_CONFIRMED' if winner and winner['status'] == 'LIVE_HOLDOUT_CONFIRMED' else 'NOT_CONCLUSIVE',
              'causality': 'No static future creator outcomes; all identity and wallet history is strictly prior to each timestamp.',
              'screening_holdout': '33897368379',
              'candidates': [{key: value for key, value in item.items() if key not in {'report_path','model_path','score'}} for item in candidates],
              'selected_method': winner['method'] if winner else None,
          }
          (root / 'selected-thesis.json').write_text(json.dumps(selected, indent=2, sort_keys=True))
          if winner:
              (root / 'selected-report.json').write_text(Path(winner['report_path']).read_text())
              (root / 'selected-model.json').write_text(Path(winner['model_path']).read_text())
          (root / 'status.txt').write_text(selected['status'] + '\n')
          print(json.dumps(selected, indent=2, sort_keys=True))
          PY

      - name: Persist strict research results
        if: always()
        run: |
          status="$(cat artifacts/strict/status.txt 2>/dev/null || echo MISSING_REPORT)"
          mkdir -p docs/research/strict models/e4/research
          cp artifacts/strict/*-report.json docs/research/strict/ 2>/dev/null || true
          cp artifacts/strict/selected-thesis.json docs/research/e4-v12-strict-selected-thesis.json 2>/dev/null || true
          cp artifacts/strict/selected-report.json docs/research/e4-v12-strict-selected-report.json 2>/dev/null || true
          cp artifacts/strict/selected-model.json models/e4/research/e4-v12-strict-selected-model.json 2>/dev/null || true
          git config user.name 'gambit-e4-research'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/research/strict docs/research/e4-v12-strict-selected-thesis.json docs/research/e4-v12-strict-selected-report.json models/e4/research/e4-v12-strict-selected-model.json || true
          if ! git diff --cached --quiet; then
            git commit -m "research(e4-v12): persist strict thesis selection ${status} [skip ci]"
            git push origin HEAD:codex/e4-v12-matched-controls
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-strict-thesis-${{ github.run_id }}
          path: artifacts/strict
          if-no-files-found: warn
          retention-days: 30

      - name: Require leak-free screening confirmation
        if: always()
        run: test "$(cat artifacts/strict/status.txt)" = "LIVE_HOLDOUT_CONFIRMED"
