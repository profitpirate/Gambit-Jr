name: E4 V12 causal create-transaction fingerprints

on:
  push:
    branches:
      - codex/e4-v12-chain-forensics-backfill-v1
    paths:
      - ".github/workflows/e4-v12-chain-fingerprint-backfill.yml"
      - "scripts/e4_v12_chain_fingerprint_backfill.py"
      - "research/e4-v12-chain-fingerprint-trigger*.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e4-v12-chain-fingerprint-backfill-v1
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || secrets.HELIUS_RPC_URL || secrets.QUICKNODE_RPC_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-chain-forensics-backfill-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp
      - name: Compile and verify immutable V2 risk sets
        run: |
          python -m compileall -q \
            scripts/e4_v12_chain_forensics_backfill.py \
            scripts/e4_v12_chain_fingerprint_backfill.py
          test -s artifacts/e4-v12-canonical-choice-risksets-v2.jsonl
          test "$(wc -l < artifacts/e4-v12-canonical-choice-risksets-v2.jsonl)" -eq 12927
      - name: Resolve selected and hard-negative create transactions
        run: |
          mkdir -p artifacts docs/research
          python -m scripts.e4_v12_chain_fingerprint_backfill \
            --input artifacts/e4-v12-canonical-choice-risksets-v2.jsonl \
            --output artifacts/e4-v12-chain-fingerprint-backfill.json \
            --concurrency 8 \
            --requests-per-second 8 \
            --maximum-alternatives-per-group 8
      - name: Persist compact fingerprint status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/e4-v12-chain-fingerprint-backfill.json').read_text())
          status={
              'version':'e4-v12-chain-fingerprint-status-v1',
              **data['coverage'],
              'selected_only_fee_payers':len(data['recurrence']['selected_only_fee_payers']),
              'selected_only_fingerprints':len(data['recurrence']['selected_only_fingerprints']),
              'production_paths_changed':0,
          }
          Path('artifacts/e4-v12-chain-fingerprint-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          Path('docs/research/e4-v12-chain-fingerprint-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          print(json.dumps(status,indent=2,sort_keys=True))
          PY
          git config user.name 'gambit-v12-chain-fingerprint'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/research/e4-v12-chain-fingerprint-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(e4-v12): persist transaction fingerprint status [skip ci]'
            git push origin HEAD:codex/e4-v12-chain-forensics-backfill-v1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-chain-fingerprint-${{ github.run_id }}
          path: |
            artifacts/e4-v12-chain-fingerprint-backfill.json
            artifacts/e4-v12-chain-fingerprint-status.json
          if-no-files-found: warn
          retention-days: 30
