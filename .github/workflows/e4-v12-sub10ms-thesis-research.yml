name: E4 V12 strict sub-10ms golden thesis research

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - ".github/workflows/e4-v12-sub10ms-thesis-research.yml"
      - "scripts/e4_v12_true_latency_replay.py"
      - "scripts/e4_v12_golden_thesis_search.py"
      - "scripts/e4_v12_hotpath_benchmark.py"
      - "src/memecoin_bot/e4_tight_output_v12.py"
      - "src/memecoin_bot/e4_strict_output_v12.py"
      - "src/memecoin_bot/e4_exec/__main__.py"
      - "tests/test_v12_true_latency_replay.py"
      - "tests/test_v12_tight_output.py"
      - "research/e4-v12-sub10ms-trigger*.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  SOURCE_BRANCH: codex/e4-v12-selection-reconstruction
  RESEARCH_BRANCH: codex/e4-v12-sub10ms-entry-research-20260905
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
  E4_V12_BUY_SLIPPAGE_BPS: "800"
  E4_V12_MAX_OUTPUT_SHORTFALL_BPS: "800"

concurrency:
  group: e4-v12-sub10ms-golden-thesis
  cancel-in-progress: false

jobs:
  repaired-historical-search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Regressions, chronology and strict-output tests
        run: |
          python -m unittest tests.test_v12_true_latency_replay -v
          python -m unittest tests.test_v12_tight_output -v
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python -m compileall -q \
            scripts/e4_v12_true_latency_replay.py \
            scripts/e4_v12_golden_thesis_search.py \
            scripts/e4_v12_hotpath_benchmark.py \
            src/memecoin_bot/e4_tight_output_v12.py \
            src/memecoin_bot/e4_strict_output_v12.py \
            src/memecoin_bot/e4_exec/__main__.py
          E4_BUILDER_ALLOW_REMOTE_FALLBACK=false node tools/e4-builder/race-proxy-v3.mjs --self-test

      - name: Require measured guarded build and signing below 10ms p95
        run: |
          mkdir -p artifacts
          python -m scripts.e4_v12_hotpath_benchmark \
            --iterations 500 \
            --warmup 50 \
            --maximum-p95-ms 10 \
            --output artifacts/e4-v12-hotpath-benchmark.json

      - name: Download ten chronological immutable live launch windows
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" \
            --workflow e4-v12-selection-certification.yml \
            --branch "$SOURCE_BRANCH" \
            --status success \
            --limit 16 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          test "$(wc -l < /tmp/run_ids)" -eq 10
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" \
              --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            test -s "$batch"
            test -s "$events"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/pairs.tsv
          done < /tmp/run_ids

      - name: Search a causal thesis using true economics at every latency
        id: search
        continue-on-error: true
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do
            args+=(--pair "$batch:$events")
          done < /tmp/pairs.tsv
          python -m scripts.e4_v12_golden_thesis_search \
            --mode search \
            "${args[@]}" \
            --horizon-ms 750 \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --max-output-shortfall-bps 800 \
            --minimum-win-rate 0.65 \
            --minimum-profit-factor 1.25 \
            --output artifacts/e4-v12-golden-thesis.json \
            --model-output artifacts/e4-v12-golden-thesis.joblib \
            --predictions-output artifacts/e4-v12-golden-holdout-predictions.json

      - name: Publish historical search status
        id: status
        if: always()
        run: |
          status=NOT_CONCLUSIVE
          if [ -s artifacts/e4-v12-golden-thesis.json ]; then
            status="$(jq -r '.status // "NOT_CONCLUSIVE"' artifacts/e4-v12-golden-thesis.json)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > artifacts/e4-v12-golden-historical-status.txt
          echo "Historical status: $status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-historical-${{ github.run_id }}
          path: |
            artifacts/e4-v12-hotpath-benchmark.json
            artifacts/e4-v12-golden-thesis.json
            artifacts/e4-v12-golden-thesis.joblib
            artifacts/e4-v12-golden-holdout-predictions.json
            artifacts/e4-v12-golden-historical-status.txt
          if-no-files-found: warn
          retention-days: 30

  untouched-live-confirmation:
    needs: repaired-historical-search
    if: needs.repaired-historical-search.outputs.status == 'HISTORICAL_HOLDOUT_CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-golden-historical-${{ github.run_id }}
          path: artifacts

      - name: Re-download frozen history for causal runtime state
        run: |
          mkdir -p historical
          gh run list --repo "$REPO" \
            --workflow e4-v12-selection-certification.yml \
            --branch "$SOURCE_BRANCH" \
            --status success \
            --limit 16 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | .[-10:] | .[].databaseId' > /tmp/run_ids
          while read -r run_id; do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" \
              --dir "historical/$run_id"
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            printf '%s\t%s\t%s\n' "$run_id" "$batch" "$events" >> /tmp/history-pairs.tsv
          done < /tmp/run_ids

      - name: Capture brand-new untouched 3000-launch live window
        run: |
          export E4_HOLDOUT_PROGRESS_PATH=artifacts/e4-v12-golden-live-progress.json
          python scripts/e4_300_launch_holdout_v12.py \
            --target-launches 3000 \
            --capture-seconds 14400 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 1500 \
            --builder-probes 250 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output artifacts/e4-v12-golden-live.json

      - name: Apply frozen thesis without any live tuning
        run: |
          args=()
          while IFS=$'\t' read -r run_id batch events; do
            args+=(--pair "$batch:$events")
          done < /tmp/history-pairs.tsv
          args+=(--pair "artifacts/e4-v12-golden-live.json:artifacts/e4-v12-golden-live-live-events.jsonl")
          python -m scripts.e4_v12_golden_thesis_search \
            --mode apply \
            "${args[@]}" \
            --model-input artifacts/e4-v12-golden-thesis.joblib \
            --predictions-output artifacts/e4-v12-golden-live-predictions.json

      - name: Rebuild every fresh trade independently at 0-10ms
        run: |
          python -m scripts.e4_v12_true_latency_replay \
            --batch artifacts/e4-v12-golden-live.json \
            --events artifacts/e4-v12-golden-live-live-events.jsonl \
            --predictions artifacts/e4-v12-golden-live-predictions.json \
            --latencies 0,1,2,5,10 \
            --starting-balance-sol 3 \
            --entry-fraction 0.0185 \
            --fee-bps 125 \
            --max-output-shortfall-bps 800 \
            --confirmation-ms 1500 \
            --max-concurrent 2 \
            --output artifacts/e4-v12-golden-live-economics.json

      - name: Require high live WR, PF and positive PnL at every latency
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          data=json.loads(Path('artifacts/e4-v12-golden-live-economics.json').read_text())
          result={}
          passed=True
          for latency,block in data['results'].items():
              metrics=block['all_predictions']
              trades=int(metrics.get('closed') or 0)
              wins=int(metrics.get('wins') or 0)
              wr=float(metrics.get('win_rate') or 0)
              pnl=float(metrics.get('net_pnl_sol') or 0)
              pf=metrics.get('profit_factor')
              pf=float(pf) if pf is not None and math.isfinite(float(pf)) else (999.0 if pnl>0 and wins==trades and trades>0 else 0.0)
              if trades:
                  z=1.96; p=wins/trades; den=1+z*z/trades
                  wilson=max(0.0,(p+z*z/(2*trades)-z*math.sqrt((p*(1-p)+z*z/(4*trades))/trades))/den)
              else:
                  wilson=0.0
              ok=trades>=4 and wr>=0.65 and wilson>=0.30 and pnl>0 and pf>=1.25
              result[latency]={'trades':trades,'wins':wins,'win_rate':wr,'wilson_low':wilson,'net_pnl_sol':pnl,'profit_factor':pf,'passed':ok}
              passed = passed and ok
          verdict={
              'version':'e4-v12-golden-live-verdict-v1',
              'status':'FOUND_LIVE_SUB10MS_GOLDEN_THESIS' if passed else 'NOT_CONCLUSIVE',
              'latencies':result,
              'untouched_live':True,
              'starting_balance_sol':3.0,
              'no_live_tuning':True,
          }
          Path('artifacts/e4-v12-golden-live-verdict.json').write_text(json.dumps(verdict,indent=2,sort_keys=True))
          Path('artifacts/e4-v12-golden-live-status.txt').write_text(verdict['status']+'\n')
          print(json.dumps(verdict,indent=2,sort_keys=True))
          if not passed:
              raise SystemExit(1)
          PY

      - name: Persist only a fully confirmed thesis on the research branch
        if: success()
        run: |
          mkdir -p models/e4/research docs/research
          cp artifacts/e4-v12-golden-thesis.json docs/research/e4-v12-golden-thesis.json
          cp artifacts/e4-v12-golden-thesis.joblib models/e4/research/e4-v12-golden-thesis.joblib
          cp artifacts/e4-v12-golden-live-verdict.json docs/research/e4-v12-golden-live-verdict.json
          git config user.name 'gambit-v12-research'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/research/e4-v12-golden-thesis.json \
            docs/research/e4-v12-golden-live-verdict.json \
            models/e4/research/e4-v12-golden-thesis.joblib
          if ! git diff --cached --quiet; then
            git commit -m 'research(e4-v12): persist live-confirmed sub-10ms golden thesis [skip ci]'
            git push origin HEAD:"$RESEARCH_BRANCH"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-live-${{ github.run_id }}
          path: |
            artifacts/e4-v12-golden-live-progress.json
            artifacts/e4-v12-golden-live.json
            artifacts/e4-v12-golden-live-live-events.jsonl
            artifacts/e4-v12-golden-live-predictions.json
            artifacts/e4-v12-golden-live-economics.json
            artifacts/e4-v12-golden-live-verdict.json
            artifacts/e4-v12-golden-live-status.txt
          if-no-files-found: warn
          retention-days: 30
