name: E4 V12 preconfirm adaptation CI

on:
  push:
    branches:
      - codex/e4-v12-preconfirm-adaptation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preconfirm-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - run: npm install --omit=dev
        working-directory: tools/e4-builder

      - name: Print adaptation fingerprints
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in (
              'src/memecoin_bot/e4_direct_copy_v12.py',
              'src/memecoin_bot/e4_copy_fidelity_v12.py',
              'src/memecoin_bot/e4_preconfirm_v12.py',
          ):
              print(f'{path}={hashlib.sha256(Path(path).read_bytes()).hexdigest()}')
          PY

      - name: Inherited E4 and V12 regression
        run: |
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python -m unittest tests.test_v12_selection -v
          python -m unittest tests.test_v12_role_model_pipeline -v
          python -m unittest tests.test_v12_direct_copy -v
          python -m unittest tests.test_v12_copy_only_evidence -v

      - name: V12 preconfirm and exit-fidelity tests
        run: |
          python -m unittest tests.test_v12_preconfirm -v
          python -m unittest tests.test_v12_copy_fidelity -v

      - name: Compile adaptation modules and production import
        run: |
          python -m compileall -q src/memecoin_bot/e4_direct_copy_v12.py src/memecoin_bot/e4_copy_fidelity_v12.py src/memecoin_bot/e4_preconfirm_v12.py
          python -m memecoin_bot.e4_exec status >/dev/null

      - name: Generic V12 local builder self-test
        run: node --import ./tools/e4-builder/exact-sol-preload-v12.mjs tools/e4-builder/daemon-v12.mjs --self-test

      - name: Exact-SOL direct-copy builder self-test
        run: node --import ./tools/e4-builder/exact-sol-preload-v12.mjs tools/e4-builder/daemon-v12.mjs --self-test-direct-copy

      - name: Builder race generic self-test
        run: node tools/e4-builder/race-proxy-v12.mjs --self-test

      - name: Builder race direct-copy self-test
        run: node tools/e4-builder/race-proxy-v12.mjs --self-test-direct-copy
