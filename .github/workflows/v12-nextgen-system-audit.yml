name: V12 NextGen Cohesive System Audit

on:
  push:
    branches:
      - codex/v12-production-hardening-20260920
    paths:
      - "src/memecoin_bot/**"
      - "scripts/v12_*.py"
      - "tests/test_v12_*.py"
      - "models/e4/v12-creator-library.json"
      - "models/e4/e4-complete-creator-history.json"
      - "models/e4/e4-lifetime-ledger.json"
      - ".github/workflows/v12-e4-lifetime-ledger.yml"
      - ".github/workflows/v12-nextgen-system-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v12-nextgen-system-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-production-hardening-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt

      - name: Compile and lint nextgen paths
        run: |
          python -m compileall -q src/memecoin_bot scripts
          paths=(
            src/memecoin_bot/access_store.py
            src/memecoin_bot/access_service.py
            src/memecoin_bot/control_plane.py
            src/memecoin_bot/v12_portal.py
            src/memecoin_bot/notifications.py
            src/memecoin_bot/e4_notifications_v12.py
            src/memecoin_bot/e4_nextgen_creator_authority_v12.py
            src/memecoin_bot/e4_pipeline_manager_v11.py
            src/memecoin_bot/e4_adaptive_exit_v12.py
            src/memecoin_bot/e4_production_guard_v12.py
            src/memecoin_bot/v12_creator_library.py
            src/memecoin_bot/v12_creator_lifecycle.py
            src/memecoin_bot/v12_learning_service.py
            src/memecoin_bot/v12_operator_graph.py
            src/memecoin_bot/v12_postcert_risk.py
            src/memecoin_bot/v12_security.py
            src/memecoin_bot/v12_capacity.py
            src/memecoin_bot/v12_execution_journal.py
            src/memecoin_bot/v12_safety.py
            src/memecoin_bot/v12_route_health.py
            src/memecoin_bot/v12_backup.py
            src/memecoin_bot/v12_live_readiness.py
            src/memecoin_bot/v12_recovery.py
            src/memecoin_bot/v12_watchdogs.py
            src/memecoin_bot/v12_forensics.py
            src/memecoin_bot/v12_observability.py
            src/memecoin_bot/v12_vault_signer.py
            src/memecoin_bot/v12_account_orchestrator.py
            src/memecoin_bot/v12_axiom_wallet.py
            src/memecoin_bot/e4_sub10ms_transport_final_v12.py
            scripts/v12_creator_library_rebuild.py
            scripts/v12_e4_full_history.py
            scripts/v12_e4_lifetime_ledger.py
            scripts/v12_e4_artifact_recovery.py
            scripts/v12_e4_artifact_recovery_merge.py
            scripts/v12_e4_source_reconciliation.py
            scripts/v12_e4_wallet_identity_inventory.py
            scripts/v12_nextgen_system_audit.py
            scripts/v12_production_deployment_audit.py
            scripts/v12_supervisor.py
            scripts/v12_integrity_manifest.py
            scripts/v12_secret_scan.py
            tests/test_v12_creator_library_rebuild.py
            tests/test_v12_e4_lifetime_ledger.py
            tests/test_v12_e4_artifact_recovery.py
            tests/test_v12_e4_artifact_recovery_merge.py
            tests/test_v12_e4_source_reconciliation.py
            tests/test_v12_e4_wallet_identity_inventory.py
            tests/test_v12_pipeline_metrics.py
            tests/test_v12_nextgen_runtime.py
            tests/test_v12_access_service.py
            tests/test_v12_notifications.py
            tests/test_v12_transport_first_ack.py
            tests/test_v12_security.py
            tests/test_v12_backup.py
            tests/test_v12_execution_safety.py
            tests/test_v12_creator_lifecycle.py
            tests/test_v12_axiom_wallet.py
            tests/test_v12_production_deployment_audit.py
          )
          ruff check --fix "${paths[@]}"
          ruff check "${paths[@]}"

      - name: New nextgen subsystem tests
        run: |
          python -m pytest -q \
            tests/test_v12_creator_library_rebuild.py \
            tests/test_v12_e4_lifetime_ledger.py \
            tests/test_v12_e4_artifact_recovery.py \
            tests/test_v12_e4_artifact_recovery_merge.py \
            tests/test_v12_e4_source_reconciliation.py \
            tests/test_v12_e4_wallet_identity_inventory.py \
            tests/test_v12_pipeline_metrics.py \
            tests/test_v12_nextgen_runtime.py \
            tests/test_v12_access_service.py \
            tests/test_v12_notifications.py \
            tests/test_v12_transport_first_ack.py \
            tests/test_v12_nextgen_creator_authority.py \
            tests/test_v12_route_authority.py \
            tests/test_v12_security.py \
            tests/test_v12_backup.py \
            tests/test_v12_execution_safety.py \
            tests/test_v12_creator_lifecycle.py

      - name: Production deployment contract audit
        run: python scripts/v12_production_deployment_audit.py

      - name: Builder production dependency security
        working-directory: tools/e4-builder
        run: |
          npm ci --omit=dev
          npm run test:security-shim
          npm run test:guard
          node --check strict-output-guard-v12.mjs
          node --check race-proxy-v3.mjs
          node --check strict-race-proxy-v12.mjs
          npm audit --omit=dev --json > ../../research/v12-builder-npm-audit-system-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("../../research/v12-builder-npm-audit-system-audit.json", "utf8"));
          const v = (report.metadata && report.metadata.vulnerabilities) || {};
          console.log(JSON.stringify(v));
          if (Number(v.total || 0) !== 0) process.exit(1);
          NODE

      - name: Full repository regression suite
        run: python -m pytest -q

      - name: Cohesion and shell audit
        run: python scripts/v12_nextgen_system_audit.py

      - name: Verify frozen causal branch independently
        run: |
          git fetch --depth=1 origin \
            codex/e4-v12-flow-survival-hazard-v12:refs/remotes/origin/v12-causal
          git show origin/v12-causal:research/v12-pre-armed-100-trade-frozen-model.json > /tmp/frozen-model.json
          git show origin/v12-causal:research/v12-pre-armed-100-causal-paper-live.json > /tmp/causal-state.json
          python - <<'PY'
          import hashlib,json
          model=json.load(open("/tmp/frozen-model.json"))
          digest=hashlib.sha256(
              json.dumps(model,sort_keys=True,separators=(",",":")).encode()
          ).hexdigest()
          assert digest=="69df86eaf386fd37d699928a95d25aaeb2053e743b59c9e687c8a7c49d14f977", digest
          state=json.load(open("/tmp/causal-state.json"))
          assert state["real_money_execution"] is False
          assert state["production_paths_changed"] == 0
          print(json.dumps({
              "model_sha256":digest,
              "closed_trades":state["metrics"]["closed_trades"],
              "status":state["status"],
          }))
          PY

      - name: Final execution builder self-test
        working-directory: tools/e4-builder
        run: |
          npm ci --omit=dev
          node --check race-proxy-v3.mjs
          node --check strict-race-proxy-v12.mjs
          node --check fast-preload-v4.mjs
          node race-proxy-v3.mjs --self-test

      - name: Persist audit evidence
        run: |
          git config user.name 'gambit-v12-system-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add research/v12-nextgen-system-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v12): certify cohesive automated sniper stack [skip ci]'
            git pull --rebase origin codex/v12-production-hardening-20260920
            git push origin HEAD:codex/v12-production-hardening-20260920
          fi

