name: V12 E4 Source Reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v12-production-hardening-20260920
    paths:
      - "scripts/v12_e4_source_reconciliation.py"
      - "tests/test_v12_e4_source_reconciliation.py"
      - ".github/workflows/v12-e4-source-reconciliation.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: v12-e4-source-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-production-hardening-20260920
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev,research]

      - name: Validate source reconciler
        run: |
          ruff check scripts/v12_e4_source_reconciliation.py tests/test_v12_e4_source_reconciliation.py
          python -m pytest tests/test_v12_e4_source_reconciliation.py -q

      - name: Reconcile primary execution sources
        run: |
          python scripts/v12_e4_source_reconciliation.py \
            --inventory research/e4-lifetime-artifact-inventory.json \
            --recovery models/e4/e4-lifetime-artifact-recovery.json \
            --output research/e4-lifetime-source-reconciliation.json

      - name: Commit reconciliation evidence
        run: |
          git config user.name 'gambit-e4-source-reconciliation'
          git config user.email 'actions@users.noreply.github.com'
          git add research/e4-lifetime-source-reconciliation.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v12): reconcile primary E4 lifetime sources'
            git push origin HEAD:codex/v12-production-hardening-20260920
          fi

      - name: Dispatch lifetime ledger rebuild
        run: gh workflow run v12-e4-lifetime-ledger.yml --ref codex/v12-production-hardening-20260920
