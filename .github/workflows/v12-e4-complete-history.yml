name: V12 E4 Complete History

on:
  push:
    branches:
      - codex/v12-production-hardening-20260920
    paths:
      - "scripts/v12_e4_full_history.py"
      - "scripts/v12_e4_recent_compare.py"
      - ".github/workflows/v12-e4-complete-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v12-e4-complete-history
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-production-hardening-20260920
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt
      - name: Compile and lint history reconstruction
        run: |
          python -m py_compile scripts/v12_e4_full_history.py scripts/v12_e4_recent_compare.py
          ruff check scripts/v12_e4_full_history.py scripts/v12_e4_recent_compare.py

      - name: Reconstruct full observable E4 history
        run: |
          python scripts/v12_e4_full_history.py \
            --legacy-expectancy models/e4/e4-creator-expectancy.json \
            --output models/e4/e4-complete-creator-history.json \
            --signature-hard-cap 50000 \
            --creator-pages 4 \
            --creator-page-size 50 \
            --creator-concurrency 6 \
            --creator-batch 25

      - name: Completeness checks
        run: |
          python - <<'PY'
          import json
          d=json.load(open("models/e4/e4-complete-creator-history.json"))
          c=d["completeness"]
          assert c["wallet_signature_scan_exhausted"] is True, c
          assert c["legacy_trades"] >= 316, c
          assert c["union_trades"] >= c["legacy_trades"], c
          assert c["positions_after_recovery"] >= c["recent_verified_positions"], c
          assert c["onchain_closed_positions"] == c["positions_after_recovery"], c
          resolved = c["onchain_creator_resolved"]
          total = c["onchain_closed_positions"]
          assert total > 0 and resolved / total >= 0.99, c
          assert d["counts"]["repeat_winner_creators"] >= 35, d["counts"]
          print(json.dumps(c,sort_keys=True))
          print(json.dumps(d["counts"],sort_keys=True))
          PY

      - name: Commit complete E4 history
        run: |
          git config user.name 'gambit-e4-history'
          git config user.email 'actions@users.noreply.github.com'
          git add models/e4/e4-complete-creator-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v12): refresh complete E4 creator history [skip ci]'
            git pull --rebase origin codex/v12-production-hardening-20260920
            git push origin HEAD:codex/v12-production-hardening-20260920
          fi

# production-hardening deep creator recovery rerun
