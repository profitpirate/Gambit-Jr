name: E4 V12 attempted-vs-ignored forensics

on:
  push:
    branches:
      - codex/e4-v12-matched-controls
    paths:
      - "scripts/e4_v12_attempt_mint_forensics.py"
      - ".github/workflows/e4-v12-attempt-mint-forensics.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  E4_PRIMARY_RPC_URL: ${{ secrets.E4_PRIMARY_RPC_URL }}
  HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}

jobs:
  map-attempts:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-e4.txt
      - name: Compile failed-attempt mapper
        run: python -m py_compile scripts/e4_v12_attempt_mint_forensics.py

      - name: Download full E4 wallet ledger and all 36k captured launches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source/fullhistory source/captures artifacts
          gh run download 33876680669 \
            --repo profitpirate/Gambit-Jr \
            --name e4-v12-full-wallet-history-33876680669 \
            --dir source/fullhistory
          for run in \
            33605109571 33627431540 33644544746 33656916992 \
            33669514091 33681664773 33692043170 33704841852 \
            33716649440 33741470396 33792881280 33822988156; do
            mkdir -p "source/captures/$run"
            gh run download "$run" \
              --repo profitpirate/Gambit-Jr \
              --name "e4-v12-forward-$run" \
              --dir "source/captures/$run"
          done

      - name: Resolve Pump instruction layouts and relabel failed E4 candidates
        run: |
          python scripts/e4_v12_attempt_mint_forensics.py \
            --full-history source/fullhistory/e4-v12-full-wallet-history.json \
            --pair source/captures/33605109571/artifacts/e4-v12-forward-batch.json:source/captures/33605109571/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33627431540/artifacts/e4-v12-forward-batch.json:source/captures/33627431540/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33644544746/artifacts/e4-v12-forward-batch.json:source/captures/33644544746/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33656916992/artifacts/e4-v12-forward-batch.json:source/captures/33656916992/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33669514091/artifacts/e4-v12-forward-batch.json:source/captures/33669514091/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33681664773/artifacts/e4-v12-forward-batch.json:source/captures/33681664773/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33692043170/artifacts/e4-v12-forward-batch.json:source/captures/33692043170/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33704841852/artifacts/e4-v12-forward-batch.json:source/captures/33704841852/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33716649440/artifacts/e4-v12-forward-batch.json:source/captures/33716649440/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33741470396/artifacts/e4-v12-forward-batch.json:source/captures/33741470396/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33792881280/artifacts/e4-v12-forward-batch.json:source/captures/33792881280/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --pair source/captures/33822988156/artifacts/e4-v12-forward-batch.json:source/captures/33822988156/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --concurrency 5 \
            --output artifacts/e4-v12-attempt-mint-forensics.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-attempt-mint-forensics-${{ github.run_id }}
          path: artifacts/e4-v12-attempt-mint-forensics.json
          if-no-files-found: warn
          retention-days: 30
