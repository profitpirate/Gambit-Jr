name: E4 V12 supervised online thesis test
on:
  push:
    branches: [codex/e4-v12-ops-supervised-live]
    paths:
      - .github/workflows/e4-v12-ops-supervised-live.yml
      - tools/e4_v12_live_ops.py
      - tools/e4_v12_ops_watchdog.py
      - tests/test_e4_v12_operations*.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e4-v12-supervised-online-theses
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  operations-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin last working numerical environment
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 aiohttp==3.14.3 pandas==3.0.5
      - name: Prove operations and execution failure controls
        run: |
          mkdir -p artifacts
          python -m unittest discover -s tests -p 'test_e4_v12_operations*.py' -v 2>&1 | tee artifacts/operations-tests.txt
          python -m py_compile tools/e4_v12_live_ops.py tools/e4_v12_ops_watchdog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-operations-tests-${{ github.run_id }}
          path: artifacts/operations-tests.txt
          retention-days: 14
  supervised-online:
    needs: operations-tests
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1b5995a2f04b70c49071fba3c2d60e2f85d5d04d
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1b868ae5fad229a2747f2097f4df9700940c6023
          path: production
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned paper-only dependencies
        run: python -m pip install -e production -r production/requirements-e4.txt numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 aiohttp==3.14.3 pandas==3.0.5
      - name: Restore frozen model source data without strategy search
        run: |
          mkdir -p frozen
          gh run download 34262315056 --repo "$GITHUB_REPOSITORY" --name e4-v12-allout-launch-corpus-34262315056 --dir frozen
          corpus="$(find frozen -name e4-v12-allout-launch-corpus.jsonl.gz -print -quit)"
          test -s "$corpus"
          echo "FROZEN_CORPUS=$corpus" >> "$GITHUB_ENV"
      - name: Run both 2 SOL accounts on incoming launches with independent watchdog
        run: |
          mkdir -p artifacts
          python tools/e4_v12_ops_watchdog.py \
            --output-dir artifacts/live-ops \
            --branch codex/e4-v12-ops-supervised-live \
            --publish-seconds 60 \
            --no-signal-stop-seconds 3600 \
            --no-signal-stop-launches 1000 \
            -- python tools/e4_v12_live_ops.py \
              --research-root research \
              --production-root production \
              --corpus "$FROZEN_CORPUS" \
              --output-dir artifacts/live-ops \
              --duration-seconds 19800 \
              --target-closed-trades 20 \
              --entry-delay-ms 10 \
              --max-decision-age-ms 250 2>&1 | tee artifacts/live-ops-console.log
      - name: Publish truthful final summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('artifacts/live-ops/supervisor.json')
          if not p.exists():
              text='Operations runner did not produce a supervised result. Inspect failed setup step.'
          else:
              d=json.loads(p.read_text());r=d.get('runner',{})
              lines=['## Supervised online paper test',f"Status: {d.get('result_class',r.get('status'))}",f"Stop reason: {d.get('stop_reason')}",'','| Thesis | Closed | Wins | Losses | WR | Net SOL | Cash SOL |','|---|---:|---:|---:|---:|---:|---:|']
              for name,a in r.get('accounts',{}).items():
                  wr='N/A' if a.get('win_rate') is None else f"{a['win_rate']*100:.2f}%"
                  lines.append(f"| {name} | {a.get('closed_trades',0)} | {a.get('wins',0)} | {a.get('losses',0)} | {wr} | {a.get('net_pnl_sol',0):+.6f} | {a.get('cash_sol',0):.6f} |")
              lines += ['', 'Sample completion is not a profitability certificate. No real-money orders were sent.']
              text='\n'.join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-supervised-live-${{ github.run_id }}
          path: artifacts/live-ops*
          if-no-files-found: warn
          retention-days: 30
