name: E4 V10 canonical live results v2

on:
  push:
    branches:
      - codex/e4-v10-three-pipelines
    paths:
      - ".github/workflows/e4-v10-canonical-results-v2.yml"
      - "scripts/e4_v10_extract_results_v2.py"
      - "reports/e4-v10-live-hypothesis/latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v10-three-pipelines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/e4_v10_extract_results_v2.py \
            --input reports/e4-v10-live-hypothesis/latest.json \
            --output reports/e4-v10-live-hypothesis/canonical-v2.json
      - run: |
          git config user.name "gambit-e4-canonical-v2"
          git config user.email "actions@users.noreply.github.com"
          git add reports/e4-v10-live-hypothesis/canonical-v2.json reports/e4-v10-live-hypothesis/canonical-v2-markers
          if ! git diff --cached --quiet; then
            git commit -m "test(e4): persist strict canonical V10 results [skip ci]"
            git pull --rebase origin codex/e4-v10-three-pipelines
            git push origin HEAD:codex/e4-v10-three-pipelines
          fi
