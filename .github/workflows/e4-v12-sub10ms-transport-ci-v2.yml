name: E4 V12 sub-10ms transport CI v2

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - "src/memecoin_bot/e4_sub10ms_runtime_v12.py"
      - "scripts/e4_v12_sub10ms_benchmark_v3.py"
      - "scripts/e4_300_launch_holdout_v12_sub10ms_v3.py"
      - ".github/workflows/e4-v12-sub10ms-transport-ci-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_BUILDER_WORKERS: "2"
  E4_BUILDER_RACE_CHILDREN: "4"
  E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
  E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS: "600"

concurrency:
  group: e4-v12-final-transport-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Compile final runtime and invariants
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_sub10ms_repairs_v12.py \
            src/memecoin_bot/e4_sub10ms_transport_v12.py \
            src/memecoin_bot/e4_sub10ms_runtime_v12.py \
            scripts/e4_v12_sub10ms_benchmark.py \
            scripts/e4_v12_sub10ms_benchmark_v3.py \
            scripts/e4_300_launch_holdout_v12_sub10ms_v3.py
          python -m unittest tests.test_e4_v12_true_latency_replay -v
          python -m unittest tests.test_e4_v12_sub10ms_transport -v
          python - <<'PY'
          from memecoin_bot import e4_sub10ms_runtime_v12 as runtime
          import inspect
          source=inspect.getsource(runtime.core.Engine.run)
          assert 'warm' in source
          assert 'builder' in source
          print('Final runtime prewarm wiring verified')
          PY

      - name: Benchmark exact prewarmed runtime transport
        run: |
          mkdir -p artifacts docs/research
          python scripts/e4_v12_sub10ms_benchmark_v3.py \
            --warmup 100 --probes 1000 \
            --output artifacts/e4-v12-final-runtime-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/e4-v12-final-runtime-benchmark.json').read_text())
          total=data.get('quote_to_route_ack_ms') or {}
          passed=bool(data.get('sub10ms_p95_pass') and float(total.get('p95') or 1e9)<10.0)
          if not passed:
              raise SystemExit(json.dumps(data,indent=2,sort_keys=True))
          Path('research/e4-v12-sub10ms-transport-state.txt').write_text('PASS\n')
          Path('docs/research/e4-v12-final-transport-benchmark.json').write_text(json.dumps(data,indent=2,sort_keys=True))
          print(json.dumps(data,indent=2,sort_keys=True))
          PY

      - name: Persist final transport proof
        run: |
          git config user.name 'gambit-v12-transport-proof'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin codex/e4-v12-sub10ms-entry-research-20260905
          git add docs/research/e4-v12-final-transport-benchmark.json \
            research/e4-v12-sub10ms-transport-state.txt
          if ! git diff --cached --quiet; then
            git commit -m 'perf(e4-v12): certify prewarmed final transport below 10ms [skip ci]'
            git push origin HEAD:codex/e4-v12-sub10ms-entry-research-20260905
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-final-runtime-transport-${{ github.run_id }}
          path: |
            artifacts/e4-v12-final-runtime-benchmark.json
            research/e4-v12-sub10ms-transport-state.txt
          if-no-files-found: warn
          retention-days: 30
