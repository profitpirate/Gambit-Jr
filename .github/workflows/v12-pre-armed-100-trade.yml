name: V12 Pre-Armed 100-trade confirmation

on:
  push:
    branches:
      - codex/e4-v12-flow-survival-hazard-v12
    paths:
      - ".github/workflows/v12-pre-armed-100-trade.yml"
      - "scripts/e4_v12_axiom_paper_live.py"
      - "scripts/e4_v12_fast_prearmed_selector.py"
      - "research/v12-pre-armed-100-trade-frozen-model.json"
      - "tests/test_e4_v12_axiom_paper_live.py"
      - "tests/test_e4_v12_fast_prearmed_selector.py"
      - "scripts/v12_prearmed_shadow_suite.py"
      - "tests/test_v12_prearmed_shadow_suite.py"
      - "research/v12-pre-armed-50-trade-results.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  RESEARCH_BRANCH: codex/e4-v12-flow-survival-hazard-v12
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"

concurrency:
  group: v12-pre-armed-100-trade
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-flow-survival-hazard-v12
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Verify frozen selector and Axiom ledger
        run: |
          python -m pytest \
            tests/test_e4_v12_fast_prearmed_selector.py \
            tests/test_e4_v12_axiom_paper_live.py \
            tests/test_v12_prearmed_shadow_suite.py -q
          ruff check \
            scripts/e4_v12_fast_prearmed_selector.py \
            scripts/e4_v12_axiom_paper_live.py \
            tests/test_e4_v12_fast_prearmed_selector.py \
            tests/test_e4_v12_axiom_paper_live.py \
            scripts/v12_prearmed_shadow_suite.py \
            tests/test_v12_prearmed_shadow_suite.py

      - name: Check whether 100 closed trades are already complete
        id: progress
        run: |
          complete=false
          if [ -s research/v12-pre-armed-100-trade-paper-live.json ]; then
            complete="$(jq -r '.completion.reached // false' research/v12-pre-armed-100-trade-paper-live.json)"
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Capture 3000 strictly future live launches
        if: steps.progress.outputs.complete != 'true'
        run: |
          mkdir -p artifacts
          export E4_HOLDOUT_PROGRESS_PATH=artifacts/v12-pre-armed-100-live-progress.json
          python scripts/e4_300_launch_holdout_v12_sub10ms.py \
            --target-launches 3000 \
            --capture-seconds 14400 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 200 \
            --builder-probes 0 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output artifacts/v12-pre-armed-100-live-batch.json

      - name: Append only frozen chronological paper trades
        if: steps.progress.outputs.complete != 'true'
        run: |
          python scripts/e4_v12_axiom_paper_live.py \
            --pair "${GITHUB_RUN_ID}=artifacts/v12-pre-armed-100-live-batch.json::artifacts/v12-pre-armed-100-live-batch-live-events.jsonl" \
            --model research/v12-pre-armed-100-trade-frozen-model.json \
            --state research/v12-pre-armed-100-trade-paper-live.json \
            --report research/v12-pre-armed-100-trade-paper-live.md \
            --metadata-cache artifacts/v12-pre-armed-100-metadata-cache.json

      - name: Run parallel shadow intelligence suite
        if: steps.progress.outputs.complete != 'true'
        run: |
          python scripts/v12_prearmed_shadow_suite.py \
            --run-id "${GITHUB_RUN_ID}" \
            --batch artifacts/v12-pre-armed-100-live-batch.json \
            --events artifacts/v12-pre-armed-100-live-batch-live-events.jsonl \
            --paper-state research/v12-pre-armed-100-trade-paper-live.json \
            --model research/v12-pre-armed-100-trade-frozen-model.json \
            --baseline research/v12-pre-armed-50-trade-results.json \
            --analytics-state research/v12-pre-armed-shadow-analytics.json \
            --report research/v12-pre-armed-shadow-analytics.md \
            --metadata-cache artifacts/v12-pre-armed-100-metadata-cache.json

      - name: Persist the cumulative ledger
        if: steps.progress.outputs.complete != 'true'
        run: |
          git config user.name 'gambit-v12-paper-live'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            research/v12-pre-armed-100-trade-paper-live.json \
            research/v12-pre-armed-100-trade-paper-live.md
            research/v12-pre-armed-shadow-analytics.json
            research/v12-pre-armed-shadow-analytics.md \
            research/v12-pre-armed-shadow-analytics.json \
            research/v12-pre-armed-shadow-analytics.md
          if ! git diff --cached --quiet; then
            git commit -m 'data(e4): accumulate Axiom-costed paper-live trades [skip ci]'
            git push origin HEAD:"$RESEARCH_BRANCH"
          fi

      - name: Upload immutable raw evidence for this window
        if: always() && steps.progress.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v12-pre-armed-100-live-${{ github.run_id }}
          path: |
            artifacts/v12-pre-armed-100-live-progress.json
            artifacts/v12-pre-armed-100-live-batch.json
            artifacts/v12-pre-armed-100-live-batch.md
            artifacts/v12-pre-armed-100-live-batch-live-events.jsonl
            artifacts/v12-pre-armed-100-metadata-cache.json
            research/v12-pre-armed-100-trade-paper-live.json
            research/v12-pre-armed-100-trade-paper-live.md
          if-no-files-found: warn
          retention-days: 30

      - name: Continue with the next untouched window until 100 trades
        if: steps.progress.outputs.complete != 'true'
        run: |
          reached="$(jq -r '.completion.reached // false' research/v12-pre-armed-100-trade-paper-live.json)"
          if [ "$reached" != "true" ]; then
            gh workflow run v12-pre-armed-100-trade.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "$RESEARCH_BRANCH"
          fi
