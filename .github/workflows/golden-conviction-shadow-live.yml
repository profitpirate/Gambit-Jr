name: Golden Thesis 5 SOL + shadow conviction sizing

on:
  push:
    branches:
      - codex/golden-thesis-buyer-reputation-v1
    paths:
      - ".github/workflows/golden-conviction-shadow-live.yml"
  workflow_dispatch:

permissions:
  contents: read

# This workflow is intentionally parked while the Golden management layer is rebuilt.
# A push of this file enters the same concurrency group and cancels the previous live run.
concurrency:
  group: golden-conviction-shadow-live-5sol
  cancel-in-progress: true

jobs:
  live-testing-paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Golden live testing intentionally paused for management-layer implementation."
