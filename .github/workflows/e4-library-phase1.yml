name: E4 library phase 1 - persist validated artifact
on:
  push:
    branches: [codex/golden-top3-full3sv2-live]
    paths:
      - '.github/workflows/e4-library-phase1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: e4-library-phase1-persist
  cancel-in-progress: false
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/golden-top3-full3sv2-live
      SOURCE_RUN: '35131493766'
      SOURCE_ARTIFACT: e4-library-phase1-35131493766
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-top3-full3sv2-live
          fetch-depth: 1
      - name: Download already validated phase 1 evidence
        run: |
          mkdir -p artifacts/e4-library
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir artifacts/e4-library
          test -s artifacts/e4-library/gambit-library-e4-summary.json
          test -s artifacts/e4-library/gambit-library-e4-trades.json
          test -s artifacts/e4-library/gambit-library-e4-devs.json
          test -s artifacts/e4-library/phase1-complete.json
      - name: Revalidate evidence before persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/e4-library')
          sig=json.load(open(root/'e4-signatures-checkpoint.json'))
          tx=json.load(open(root/'e4-transactions-checkpoint.json'))
          s=json.load(open(root/'gambit-library-e4-summary.json'))
          m=json.load(open(root/'phase1-complete.json'))
          assert sig['complete'] is True
          assert tx['complete'] is True
          assert s['phase']=='E4_LIBRARY_PHASE1_COMPLETE'
          assert m['phase']=='PHASE_1_COMPLETE' and m['source']=='E4'
          assert s['rpc_visible_signature_count']==len(sig['rows'])
          assert s['known_basis_cycles']>0
          assert s['known_wins']+s['known_losses']<=s['known_basis_cycles']
          assert s['open_or_unknown_cycles']>=0
          PY
      - name: Persist compact E4 library with GitHub contents API
        run: |
          set -euo pipefail
          persist_one() {
            src="$1"
            dest="$2"
            content="$(base64 -w0 "$src")"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dest?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                -f message='data(library): persist E4 phase 1 evidence [skip ci]' \
                -f content="$content" -f branch="$BRANCH" -f sha="$sha" >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
                -f message='data(library): persist E4 phase 1 evidence [skip ci]' \
                -f content="$content" -f branch="$BRANCH" >/dev/null
            fi
          }
          persist_one artifacts/e4-library/gambit-library-e4-summary.json docs/research/gambit-library-e4-summary.json
          persist_one artifacts/e4-library/gambit-library-e4-trades.json docs/research/gambit-library-e4-trades.json
          persist_one artifacts/e4-library/gambit-library-e4-devs.json docs/research/gambit-library-e4-devs.json
          persist_one artifacts/e4-library/phase1-complete.json docs/research/e4-library-phase1-complete.json
      - name: Verify persisted files
        run: |
          for f in gambit-library-e4-summary.json gambit-library-e4-trades.json gambit-library-e4-devs.json e4-library-phase1-complete.json; do
            gh api "repos/$GITHUB_REPOSITORY/contents/docs/research/$f?ref=$BRANCH" --jq '.sha + " " + .path'
          done
