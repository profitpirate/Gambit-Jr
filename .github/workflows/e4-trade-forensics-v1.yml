name: E4 trade forensics v1

on:
  push:
    branches:
      - codex/golden-thesis-buyer-reputation-v1
    paths:
      - ".github/workflows/e4-trade-forensics-v1.yml"
      - "tools/e4_trade_forensics_v1.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/golden-thesis-buyer-reputation-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install aiohttp
      - name: Reconstruct exact first Golden-session E4 trade legs
        run: |
          mkdir -p artifacts/e4-forensics
          python tools/e4_trade_forensics_v1.py \
            --start-epoch 1789395449 \
            --end-epoch 1789414669 \
            --max-signatures 5000 \
            --output artifacts/e4-forensics/e4-trade-forensics.json
      - name: Publish forensic snapshot
        run: |
          content="$(base64 -w0 artifacts/e4-forensics/e4-trade-forensics.json)"
          path="docs/research/e4-trade-forensics-v1.json"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=codex/golden-thesis-buyer-reputation-v1" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='data(e4): publish trade-leg forensic snapshot [skip ci]' \
              -f branch='codex/golden-thesis-buyer-reputation-v1' \
              -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='data(e4): publish trade-leg forensic snapshot [skip ci]' \
              -f branch='codex/golden-thesis-buyer-reputation-v1' \
              -f content="$content" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: e4-trade-forensics-${{ github.run_id }}
          path: artifacts/e4-forensics/e4-trade-forensics.json
          retention-days: 14
