name: E4 V10 live report inventory

on:
  push:
    branches:
      - codex/e4-v10-three-pipelines
    paths:
      - ".github/workflows/e4-v10-report-inventory.yml"
      - "scripts/e4_v10_report_inventory.py"
      - "reports/e4-v10-live-hypothesis/latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v10-three-pipelines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/e4_v10_report_inventory.py --input reports/e4-v10-live-hypothesis/latest.json --output reports/e4-v10-live-hypothesis/inventory.json
      - run: |
          git config user.name "gambit-e4-inventory"
          git config user.email "actions@users.noreply.github.com"
          git add reports/e4-v10-live-hypothesis/inventory.json reports/e4-v10-live-hypothesis/inventory-markers
          if ! git diff --cached --quiet; then
            git commit -m "test(e4): persist V10 report inventory [skip ci]"
            git pull --rebase origin codex/e4-v10-three-pipelines
            git push origin HEAD:codex/e4-v10-three-pipelines
          fi
