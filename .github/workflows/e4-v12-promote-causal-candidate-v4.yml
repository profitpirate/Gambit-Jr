name: E4 V12 deterministic causal candidate promotion

on:
  push:
    branches:
      - codex/e4-v12-matched-controls
    paths:
      - "scripts/e4_v12_promote_causal_candidate_v4.py"
      - "research/candidate-workflows/promotion-v4-trigger-*.txt"
      - ".github/workflows/e4-v12-promote-causal-candidate-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_V12_CAUSAL_ENTRY_ENABLED: "true"
  E4_PIPELINES_BACKGROUND: "false"

jobs:
  promote-confirmed-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-matched-controls
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt

      - name: Wait only for immutable v3 prerequisites
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          required = (
              'docs/research/e4-v12-runtime-choice-v3-report.json',
              'models/e4/research/e4-v12-runtime-choice-v3-model.json',
              'models/e4/research/e4-v12-causal-runtime-state.json',
          )
          for _ in range(180):
              subprocess.run(
                  ['git','fetch','origin','codex/e4-v12-matched-controls'],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              available = True
              for path in required:
                  check = subprocess.run(
                      ['git','cat-file','-e',f'origin/codex/e4-v12-matched-controls:{path}'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if check.returncode != 0:
                      available = False
                      break
              if available:
                  raw = subprocess.check_output(
                      ['git','show','origin/codex/e4-v12-matched-controls:docs/research/e4-v12-runtime-choice-v3-report.json'],
                      text=True,
                  )
                  report = json.loads(raw)
                  status = str(report.get('status') or '')
                  if status == 'LIVE_HOLDOUT_CONFIRMED' and report.get('safe_to_implement') is True:
                      print(json.dumps({
                          'status': status,
                          'validation': report.get('validation'),
                          'walk_forward': report.get('walk_forward'),
                          'live_holdout': report.get('live_holdout'),
                      }, indent=2, sort_keys=True))
                      break
                  if status and status != 'LIVE_HOLDOUT_CONFIRMED':
                      raise SystemExit(f'v3 thesis rejected by screening: {status}')
              time.sleep(10)
          else:
              raise SystemExit('v3 thesis prerequisites were not produced')
          PY

      - name: Rebuild and verify candidate from authoritative V12
        run: python scripts/e4_v12_promote_causal_candidate_v4.py
