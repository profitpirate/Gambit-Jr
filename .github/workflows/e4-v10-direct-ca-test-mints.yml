name: E4 V10 direct CA test mint patch

on:
  push:
    branches:
      - codex/e4-v10-three-pipelines
    paths:
      - scripts/e4_patch_v10_direct_ca_test_mints.py
      - .github/workflows/e4-v10-direct-ca-test-mints.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v10-three-pipelines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/e4_patch_v10_direct_ca_test_mints.py
      - name: Commit corrected fixtures
        run: |
          if git diff --quiet -- tests/test_e4_v10_direct_ca_social.py; then
            echo "No fixture changes"
            exit 0
          fi
          git config user.name "gambit-e4-v10"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_e4_v10_direct_ca_social.py
          git commit -m "test(e4): use valid Solana mints for direct-CA matching"
          git pull --rebase origin codex/e4-v10-three-pipelines
          git push origin HEAD:codex/e4-v10-three-pipelines
