name: V12 Production Security Audit

on:
  push:
    branches:
      - codex/v12-production-reconcile-20260924
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements-e4.txt"
      - "tools/e4-builder/**"
      - ".github/workflows/v12-production-security.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v12-production-security
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-production-reconcile-20260924
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,research]
      - run: python -m pip install -r requirements-e4.txt
      - run: python -m pip install pip-audit bandit cyclonedx-bom

      - name: Tracked-source secret scan
        run: python scripts/v12_secret_scan.py

      - name: Python production dependency audit
        run: |
          mkdir -p research
          set +e
          pip-audit . --format json --output research/v12-python-project-audit.json
          echo "$?" > research/v12-python-project-audit.exit
          pip-audit -r requirements-e4.txt --format json --output research/v12-python-e4-audit.json
          echo "$?" > research/v12-python-e4-audit.exit
          set -e
          python - <<'PY'
          import json
          for name in ("project","e4"):
              path=f"research/v12-python-{name}-audit.json"
              data=json.load(open(path))
              vulnerable=[]
              for dep in data.get("dependencies",[]):
                  vulns=dep.get("vulns") or []
                  if vulns:
                      vulnerable.append({
                          "name":dep.get("name"),
                          "version":dep.get("version"),
                          "vulns":[
                              {"id":v.get("id"),"fix_versions":v.get("fix_versions",[])}
                              for v in vulns
                          ],
                      })
              print(json.dumps({"audit":name,"vulnerable":vulnerable},sort_keys=True))
          PY

      - name: Production security static analysis
        run: |
          bandit -r             src/memecoin_bot/v12_security.py             src/memecoin_bot/v12_backup.py             src/memecoin_bot/v12_live_readiness.py             src/memecoin_bot/v12_execution_journal.py             src/memecoin_bot/v12_recovery.py             src/memecoin_bot/v12_watchdogs.py             src/memecoin_bot/e4_production_guard_v12.py             src/memecoin_bot/v12_vault_signer.py             src/memecoin_bot/v12_account_orchestrator.py             src/memecoin_bot/control_plane.py             -ll -ii -f json -o research/v12-bandit.json

      - name: Python SBOM
        run: cyclonedx-py environment --output-format JSON --output-file research/v12-python-sbom.json

      - name: Critical-code manifest
        run: python scripts/v12_integrity_manifest.py --output security/v12-integrity-manifest.json

      - name: Node dependency audit
        working-directory: tools/e4-builder
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --json > ../../research/v12-builder-npm-audit-security.json || true
          npm sbom --sbom-format cyclonedx > ../../research/v12-builder-sbom-security.json

      - name: Enforce no critical Node vulnerabilities
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('research/v12-builder-npm-audit-security.json'));
          const v = a.metadata?.vulnerabilities || {};
          if ((v.critical || 0) > 0) process.exit(2);
          NODE

      - name: Enforce Python dependency audit
        run: |
          project_rc="$(cat research/v12-python-project-audit.exit)"
          e4_rc="$(cat research/v12-python-e4-audit.exit)"
          test "$project_rc" -eq 0
          test "$e4_rc" -eq 0

      - name: Commit security evidence
        run: |
          git config user.name 'gambit-v12-security'
          git config user.email 'actions@users.noreply.github.com'
          git add             security/v12-integrity-manifest.json             research/v12-python-project-audit.json \
            research/v12-python-e4-audit.json             research/v12-bandit.json             research/v12-python-sbom.json             research/v12-builder-npm-audit-security.json             research/v12-builder-sbom-security.json
          if ! git diff --cached --quiet; then
            git commit -m 'security(v12): refresh production security evidence [skip ci]'
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin codex/v12-production-reconcile-20260924 && git push origin HEAD:codex/v12-production-reconcile-20260924; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            test "$pushed" = true
          fi
