name: E4 V12 end-to-end internal latency

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - "src/memecoin_bot/e4_transport_v12.py"
      - "src/memecoin_bot/e4_exec_sub10ms_v2/**"
      - "scripts/e4_v12_end_to_end_latency_benchmark.py"
      - "scripts/e4_v12_hotpath_benchmark_v3.py"
      - "tests/test_v12_transport.py"
      - ".github/workflows/e4-v12-end-to-end-latency.yml"
      - "research/e4-v12-latency-trigger*.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/strict-race-proxy-v12.mjs"
  E4_BUILDER_PRELOAD: "${{ github.workspace }}/tools/e4-builder/fast-preload-v4.mjs"
  E4_V12_BUY_SLIPPAGE_BPS: "800"
  E4_V12_MAX_OUTPUT_SHORTFALL_BPS: "800"

concurrency:
  group: e4-v12-end-to-end-internal-latency
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - name: Compile and test warmed transport
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_transport_v12.py \
            src/memecoin_bot/e4_exec_sub10ms_v2 \
            scripts/e4_v12_end_to_end_latency_benchmark.py
          node --check tools/e4-builder/strict-race-proxy-v12.mjs
          python -m unittest tests.test_v12_transport -v
          python -m unittest tests.test_v12_tight_output tests.test_v12_strict_output_deferred -v
      - name: Enforce guarded receive-to-loopback-write p95 below 10ms
        run: |
          mkdir -p artifacts
          python -m scripts.e4_v12_end_to_end_latency_benchmark \
            --iterations 1000 \
            --warmup 100 \
            --maximum-p95-ms 10 \
            --output artifacts/e4-v12-end-to-end-latency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-end-to-end-latency-${{ github.run_id }}
          path: artifacts/e4-v12-end-to-end-latency.json
          if-no-files-found: warn
          retention-days: 30
