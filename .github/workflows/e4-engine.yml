name: E4 engine

on:
  push:
    branches:
      - codex/gambit-jr-v2-e4-execution
  pull_request:
    paths:
      - "src/memecoin_bot/e4_live.py"
      - "src/memecoin_bot/e4_runner.py"
      - "src/memecoin_bot/e4/**"
      - "tests/test_e4_live.py"
      - "tools/e4-builder/**"
      - "requirements-e4.txt"
      - "Dockerfile.e4"
      - "docker-compose.e4.yml"
      - ".github/workflows/e4-engine.yml"


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - run: python -m unittest tests.test_e4_live -v
      - run: python -m compileall -q src/memecoin_bot/e4_live.py src/memecoin_bot/e4_runner.py src/memecoin_bot/e4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - working-directory: tools/e4-builder
        run: node --check index.mjs
