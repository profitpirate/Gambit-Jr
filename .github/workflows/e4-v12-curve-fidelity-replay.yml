name: E4 V12 reserve-aware WR replay

on:
  push:
    branches:
      - codex/e4-v12-exit-mirror-fastpath
    paths:
      - "scripts/e4_v12_curve_fidelity_replay.py"
      - "tests/test_v12_curve_fidelity_replay.py"
      - ".github/workflows/e4-v12-curve-fidelity-replay.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  curve-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Reserve-aware replay unit tests
        run: python -m unittest tests.test_v12_curve_fidelity_replay -v

      - name: Download authoritative fresh 3000-launch sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts
          gh run download 33741470396 \
            --repo profitpirate/Gambit-Jr \
            --name e4-v12-forward-33741470396 \
            --dir source

      - name: Run corrected reserve-aware WR replay
        run: |
          python scripts/e4_v12_curve_fidelity_replay.py \
            --batch source/artifacts/e4-v12-forward-batch.json \
            --events source/artifacts/e4-v12-forward-batch-live-events.jsonl \
            --wallet-balance-sol 1.2 \
            --fee-bps 125 \
            --output artifacts/e4-v12-curve-fidelity.json

      - uses: actions/upload-artifact@v4
        with:
          name: e4-v12-curve-fidelity-${{ github.run_id }}
          path: artifacts/e4-v12-curve-fidelity.json
          retention-days: 30
