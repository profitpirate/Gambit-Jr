name: E4 production

on:
  push:
    branches:
      - codex/gambit-jr-v2-e4-execution
  pull_request:
    paths:
      - "src/memecoin_bot/e4_live.py"
      - "src/memecoin_bot/e4_runner.py"
      - "src/memecoin_bot/e4_production.py"
      - "src/memecoin_bot/e4_prod/**"
      - "tests/test_e4_live.py"
      - "tests/test_e4_production.py"
      - "tools/e4-builder/**"
      - "requirements-e4.txt"
      - "Dockerfile.e4-prod"
      - "docker-compose.e4-prod.yml"
      - ".github/workflows/e4-production.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - name: Unit tests
        run: |
          python - <<'PY'
          import unittest
          import unittest.mock
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_e4*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - run: python -m compileall -q src/memecoin_bot/e4_live.py src/memecoin_bot/e4_runner.py src/memecoin_bot/e4_production.py src/memecoin_bot/e4_prod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - working-directory: tools/e4-builder
        run: node --check index.mjs
