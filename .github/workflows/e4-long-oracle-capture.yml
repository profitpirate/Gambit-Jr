name: E4 long oracle capture

on:
  workflow_dispatch:

jobs:
  oracle-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - name: Regression before long capture
        run: python -m unittest discover -s tests -p "test_e4*.py" -v
      - name: Twenty-minute holdout capture
        env:
          E4_SOL_USD_FALLBACK: "150"
        run: >-
          python scripts/e4_live_market_stress_v3.py
          --capture-seconds 1200
          --minimum-launches 100
          --wallet-signatures 600
          --builder-probes 40
          --testnet-route-probes 8
          --stress-iterations 25000
          --output artifacts/e4-long-oracle-holdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: e4-long-oracle-holdout-${{ github.run_id }}
          path: |
            artifacts/e4-long-oracle-holdout.json
            artifacts/e4-long-oracle-holdout.md
            artifacts/e4-long-oracle-holdout-live-events.jsonl
          if-no-files-found: error
          retention-days: 30
