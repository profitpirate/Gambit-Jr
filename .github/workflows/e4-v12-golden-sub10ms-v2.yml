name: E4 V12 repaired sub-10ms golden thesis

on:
  push:
    branches:
      - codex/e4-v12-sub10ms-entry-research-20260905
    paths:
      - "src/memecoin_bot/e4_sub10ms_repairs_v12.py"
      - "src/memecoin_bot/e4_exec/__main__.py"
      - "scripts/e4_v12_true_latency_replay.py"
      - "scripts/e4_v12_golden_thesis_search_v2.py"
      - "scripts/e4_v12_golden_thesis_search_v3.py"
      - "scripts/e4_v12_sub10ms_benchmark.py"
      - "scripts/e4_300_launch_holdout_v12_sub10ms.py"
      - "tests/test_e4_v12_true_latency_replay.py"
      - ".github/workflows/e4-v12-golden-sub10ms-v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: profitpirate/Gambit-Jr
  SOURCE_BRANCH: codex/e4-v12-selection-reconstruction
  RESEARCH_BRANCH: codex/e4-v12-sub10ms-entry-research-20260905
  E4_PIPELINES_BACKGROUND: "false"
  E4_SOL_USD_FALLBACK: "150"
  E4_BUILDER_COMMAND: "node tools/e4-builder/race-proxy-v3.mjs"
  E4_BUILDER_PRELOAD: "tools/e4-builder/fast-preload-v4.mjs"
  E4_BUILDER_WORKERS: "2"
  E4_BUILDER_RACE_CHILDREN: "4"
  E4_BALANCE_CACHE_MAX_STALENESS_MS: "5000"
  E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS: "600"

concurrency:
  group: e4-v12-golden-sub10ms-v2
  cancel-in-progress: true

jobs:
  historical-repair-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      speed_outcome: ${{ steps.speed.outcome }}
      thesis_outcome: ${{ steps.thesis.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev

      - name: Compile repairs and prove chronology/economic replay invariants
        run: |
          python -m compileall -q \
            src/memecoin_bot/e4_sub10ms_repairs_v12.py \
            scripts/e4_v12_true_latency_replay.py \
            scripts/e4_v12_golden_thesis_search_v2.py \
            scripts/e4_v12_golden_thesis_search_v3.py \
            scripts/e4_v12_sub10ms_benchmark.py \
            scripts/e4_300_launch_holdout_v12_sub10ms.py
          python -m unittest tests.test_e4_v12_true_latency_replay -v
          python -m unittest discover -s tests -p "test_e4*.py" -v
          python - <<'PY'
          from pathlib import Path
          entry=Path('src/memecoin_bot/e4_exec/__main__.py').read_text()
          assert 'e4_sub10ms_repairs_v12' in entry
          assert 'E4_DIRECT_COPY_MAX_OUTPUT_SHORTFALL_BPS' in entry
          replay=Path('scripts/e4_v12_true_latency_replay.py').read_text()
          assert 'hypothetical_scenarios' not in replay
          assert 'BuyExactSolIn minimum-token floor' in replay
          print('Repaired V12 wiring and independent per-latency replay verified')
          PY

      - name: Benchmark quote-to-warm-route hot path
        id: speed
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/e4_v12_sub10ms_benchmark.py \
            --warmup 50 \
            --probes 300 \
            --output artifacts/e4-v12-sub10ms-benchmark.json

      - name: Download ten immutable chronological live launch windows
        run: |
          mkdir -p historical
          for run_id in \
            33792881280 33810753028 33822988156 33835575805 33852482054 \
            33876345997 33897368379 33911477030 33920757002 33931301493
          do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" \
              --dir "historical/$run_id"
            test -s "$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            test -s "$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
          done

      - name: Search and freeze one leak-free profitable-intent thesis
        id: thesis
        continue-on-error: true
        run: |
          PAIRS=()
          for run_id in \
            33792881280 33810753028 33822988156 33835575805 33852482054 \
            33876345997 33897368379 33911477030 33920757002 33931301493
          do
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            PAIRS+=(--pair "$run_id=$batch:$events")
          done
          python scripts/e4_v12_golden_thesis_search_v3.py \
            --mode search \
            "${PAIRS[@]}" \
            --horizon-ms 1500 \
            --minimum-lead-ms 12 \
            --latencies-ms 0,1,2,5,10 \
            --model-output artifacts/e4-v12-golden-model.joblib \
            --output artifacts/e4-v12-golden-historical.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-historical-${{ github.run_id }}
          path: |
            artifacts/e4-v12-sub10ms-benchmark.json
            artifacts/e4-v12-golden-model.joblib
            artifacts/e4-v12-golden-historical.json
          if-no-files-found: warn
          retention-days: 30

  untouched-live-confirmation:
    needs: historical-repair-gate
    if: needs.historical-repair-gate.outputs.speed_outcome == 'success' && needs.historical-repair-gate.outputs.thesis_outcome == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-sub10ms-entry-research-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt scikit-learn joblib
      - working-directory: tools/e4-builder
        run: npm install --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: e4-v12-golden-historical-${{ github.run_id }}
          path: frozen

      - name: Rehydrate the exact chronological history used to freeze the model
        run: |
          mkdir -p historical
          for run_id in \
            33792881280 33810753028 33822988156 33835575805 33852482054 \
            33876345997 33897368379 33911477030 33920757002 33931301493
          do
            mkdir -p "historical/$run_id"
            gh run download "$run_id" --repo "$REPO" \
              --name "e4-v12-forward-$run_id" \
              --dir "historical/$run_id"
          done

      - name: Capture a completely untouched 3000-launch live window
        run: |
          mkdir -p live artifacts
          export E4_HOLDOUT_PROGRESS_PATH=live/e4-v12-golden-progress.json
          python scripts/e4_300_launch_holdout_v12_sub10ms.py \
            --target-launches 3000 \
            --capture-seconds 14400 \
            --tail-seconds 300 \
            --heartbeat-seconds 60 \
            --minimum-launches 3000 \
            --wallet-signatures 1200 \
            --builder-probes 0 \
            --testnet-route-probes 0 \
            --stress-iterations 0 \
            --output live/e4-v12-golden-live-batch.json

      - name: Apply frozen thesis and rebuild every 0-10ms trade
        run: |
          PAIRS=()
          for run_id in \
            33792881280 33810753028 33822988156 33835575805 33852482054 \
            33876345997 33897368379 33911477030 33920757002 33931301493
          do
            batch="$(find "historical/$run_id" -name 'e4-v12-forward-batch.json' -print -quit)"
            events="$(find "historical/$run_id" -name 'e4-v12-forward-batch-live-events.jsonl' -print -quit)"
            PAIRS+=(--pair "$run_id=$batch:$events")
          done
          python scripts/e4_v12_golden_thesis_search_v3.py \
            --mode apply \
            "${PAIRS[@]}" \
            --pair "${GITHUB_RUN_ID}=live/e4-v12-golden-live-batch.json:live/e4-v12-golden-live-batch-live-events.jsonl" \
            --minimum-live-trades 3 \
            --model-input frozen/e4-v12-golden-model.joblib \
            --output artifacts/e4-v12-golden-fresh-live.json

      - name: Persist only a fully passing isolated V12 research candidate
        run: |
          mkdir -p docs/research models/e4/research
          cp frozen/e4-v12-sub10ms-benchmark.json docs/research/e4-v12-sub10ms-benchmark.json
          cp frozen/e4-v12-golden-historical.json docs/research/e4-v12-golden-historical.json
          cp frozen/e4-v12-golden-model.joblib models/e4/research/e4-v12-golden-model.joblib
          cp artifacts/e4-v12-golden-fresh-live.json docs/research/e4-v12-golden-fresh-live.json
          git config user.name 'gambit-v12-golden-research'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$RESEARCH_BRANCH"
          git add docs/research models/e4/research
          git commit -m 'research(e4-v12): persist fresh-live sub-10ms golden thesis [skip ci]'
          git push origin HEAD:"$RESEARCH_BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-v12-golden-live-${{ github.run_id }}
          path: |
            live/e4-v12-golden-progress.json
            live/e4-v12-golden-live-batch.json
            live/e4-v12-golden-live-batch-live-events.jsonl
            artifacts/e4-v12-golden-fresh-live.json
            frozen/e4-v12-sub10ms-benchmark.json
            frozen/e4-v12-golden-historical.json
          if-no-files-found: warn
          retention-days: 30
