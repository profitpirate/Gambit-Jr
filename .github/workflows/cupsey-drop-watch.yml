name: Cupsey verified drop watch

on:
  push:
    branches:
      - codex/cupsey-drop-watch-20260905
    paths:
      - ".github/workflows/cupsey-drop-watch.yml"
      - "src/memecoin_bot/discord/cupsey_watch.py"
      - "src/memecoin_bot/discord/__init__.py"
      - "tests/test_cupsey_watch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cupsey-drop-watch-20260905
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Unit tests and compile check
        run: |
          python -m unittest tests.test_cupsey_watch -v
          python -m compileall -q src/memecoin_bot/discord/cupsey_watch.py src/memecoin_bot/discord/__init__.py

  live-watch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN || secrets.GAMBIT_DISCORD_TOKEN || secrets.BOT_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.GAMBIT_DISCORD_WEBHOOK_URL }}
      CUPSEY_ALERT_CHANNEL_ID: ${{ secrets.CUPSEY_ALERT_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID || secrets.GAMBIT_DISCORD_CHANNEL_ID || vars.DISCORD_CHANNEL_ID }}
      CUPSEY_DROP_WATCH_ENABLED: "true"
      CUPSEY_DROP_STATE_PATH: "artifacts/cupsey-drop-watch.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Verify Discord destination exists
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] && { [ -z "$DISCORD_TOKEN" ] || [ -z "$CUPSEY_ALERT_CHANNEL_ID" ]; }; then
            echo "::error::Cupsey watcher needs DISCORD_WEBHOOK_URL or DISCORD_TOKEN plus CUPSEY_ALERT_CHANNEL_ID/DISCORD_CHANNEL_ID in repository secrets or variables."
            exit 1
          fi
      - name: Watch official site and Cupsey wallet until verified launch
        run: |
          mkdir -p artifacts
          python -m memecoin_bot.discord.cupsey_watch --channel-id "${CUPSEY_ALERT_CHANNEL_ID:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cupsey-drop-watch-${{ github.run_id }}
          path: artifacts/cupsey-drop-watch.json
          if-no-files-found: warn
          retention-days: 7
