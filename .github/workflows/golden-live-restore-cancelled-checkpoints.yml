name: Golden live restore cancelled checkpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/golden-live-restore-cancelled-checkpoints.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cancel superseded resumed runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'Golden top4 - live Solana paper and E4|codex/golden-top3-full3sv2-live' \
            'Golden 2s loss-exit A-B - live Solana paper|codex/golden-2s-loss-exit-live'
          do
            name="${spec%%|*}"
            branch="${spec#*|}"
            run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="$branch" -f per_page=100 \
              --jq ".workflow_runs[] | select(.name == \"$name\" and (.status == \"in_progress\" or .status == \"queued\")) | .id" | head -1)"
            if [[ -n "$run_id" ]]; then
              echo "Cancelling superseded $name run $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              for _ in $(seq 1 60); do
                status="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.status')"
                [[ "$status" == 'completed' ]] && break
                sleep 2
              done
            fi
          done

      - name: Download preserved cancellation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery/top4 recovery/loss2s
          gh run download 35167071329 --repo "$GITHUB_REPOSITORY" --name golden-top4-solana-35167071329 --dir recovery/top4
          gh run download 35168069899 --repo "$GITHUB_REPOSITORY" --name golden-loss2s-solana-35168069899 --dir recovery/loss2s
          test -s recovery/top4/live/state.json
          test -s recovery/loss2s/live/state.json

      - name: Restore newest clean resumable states to campaign branches
        shell: bash
        run: |
          set -euo pipefail
          restore_one() {
            kind="$1"; branch="$2"; prefix="$3"; source="$4"
            git fetch origin "$branch"
            tmp="$(mktemp -d)"
            git worktree add --detach "$tmp" FETCH_HEAD
            cp "$source/live/state.json" "$tmp/docs/research/${prefix}state.json"
            cp "$source/live/e4-status.json" "$tmp/docs/research/${prefix}e4.json"
            cp "$source/live/activity.json" "$tmp/docs/research/${prefix}activity.json"
            python - "$source/live/status.json" "$tmp/docs/research/${prefix}status.json" "$kind" <<'PY'
          import json, sys, time, hashlib
          src, dst, kind = sys.argv[1:]
          d=json.load(open(src))
          d['status']='RECOVERED_CANCELLED_ARTIFACT_READY_TO_RESUME'
          d['collector_active']=False
          d['completion_verified']=False
          d['recovery_source']='GITHUB_ACTIONS_CANCELLED_RUN_ARTIFACT'
          d['recovered_at_ns']=time.time_ns()
          d['heartbeat_ns']=time.time_ns()
          d['lease_expires_ns']=0
          d['liveness_contract']='collector_active is valid only while heartbeat lease is unexpired; Actions run state is authoritative'
          json.dump(d,open(dst,'w'),sort_keys=True,allow_nan=False);open(dst,'a').write('\n')
          PY
            python - "$source/live/state.json" "$tmp/docs/research/${prefix}checkpoint.json" "$kind" <<'PY'
          import json,sys,time,hashlib
          state_path,dst,kind=sys.argv[1:]
          st=json.load(open(state_path))
          sess=st.get('sessions',[])[-1] if st.get('sessions') else {}
          meta={
            'schema':'golden-live-clean-checkpoint-1','kind':kind,'checked_ns':time.time_ns(),
            'verified_forward_counts':{k:v.get('verified_forward_closed') for k,v in (sess.get('arms') or {}).items()},
            'min_verified_closed_per_model':sess.get('matched_closed'),'matched_closed':sess.get('matched_closed'),
            'journal_head':sess.get('journal_head'),'clean_engine_required':True,'paper_only':True,
            'recovery_source':'GITHUB_ACTIONS_CANCELLED_RUN_ARTIFACT',
            'state_sha256':hashlib.sha256(open(state_path,'rb').read()).hexdigest(),
          }
          json.dump(meta,open(dst,'w'),sort_keys=True);open(dst,'a').write('\n')
          PY
            git -C "$tmp" config user.name gambit-live-recovery
            git -C "$tmp" config user.email actions@users.noreply.github.com
            git -C "$tmp" add -- "docs/research/${prefix}state.json" "docs/research/${prefix}status.json" "docs/research/${prefix}e4.json" "docs/research/${prefix}activity.json" "docs/research/${prefix}checkpoint.json"
            git -C "$tmp" commit -m "data(${kind}): restore cancelled-run clean checkpoint [skip ci]"
            git -C "$tmp" push origin "HEAD:$branch"
            git worktree remove --force "$tmp"
          }
          restore_one top4 codex/golden-top3-full3sv2-live golden-top4- recovery/top4
          restore_one loss2s codex/golden-2s-loss-exit-live golden-loss2s- recovery/loss2s

      - name: Verify restored checkpoint vectors
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/golden-top3-full3sv2-live codex/golden-2s-loss-exit-live
          echo 'Top4 restored from run 35167071329: expected 39/39/39/37.'
          echo 'Loss2s restored from run 35168069899: expected 6 across all six arms.'
