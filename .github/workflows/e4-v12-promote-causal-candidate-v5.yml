name: E4 V12 causal candidate promotion v5

on:
  push:
    branches:
      - codex/e4-v12-matched-controls
    paths:
      - "research/candidate-workflows/promotion-v5-trigger-*.txt"
      - ".github/workflows/e4-v12-promote-causal-candidate-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  E4_V12_CAUSAL_ENTRY_ENABLED: "true"
  E4_PIPELINES_BACKGROUND: "false"

jobs:
  promote-after-global-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e4-v12-matched-controls
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-e4.txt

      - name: Wait for v3 model and global chronological WR confirmation
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          report_path='docs/research/e4-v12-runtime-choice-v3-report.json'
          model_path='models/e4/research/e4-v12-runtime-choice-v3-model.json'
          state_path='models/e4/research/e4-v12-causal-runtime-state.json'
          global_path='docs/research/e4-v12-runtime-global-screening-v3-verdict.json'
          required=(report_path,model_path,state_path,global_path)

          for _ in range(540):
              subprocess.run(
                  ['git','fetch','origin','codex/e4-v12-matched-controls'],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              missing=[]
              for path in required:
                  result=subprocess.run(
                      ['git','cat-file','-e',f'origin/codex/e4-v12-matched-controls:{path}'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if result.returncode != 0:
                      missing.append(path)
              if missing:
                  time.sleep(10)
                  continue
              report=json.loads(subprocess.check_output(
                  ['git','show',f'origin/codex/e4-v12-matched-controls:{report_path}'],
                  text=True,
              ))
              model=json.loads(subprocess.check_output(
                  ['git','show',f'origin/codex/e4-v12-matched-controls:{model_path}'],
                  text=True,
              ))
              verdict=json.loads(subprocess.check_output(
                  ['git','show',f'origin/codex/e4-v12-matched-controls:{global_path}'],
                  text=True,
              ))
              thesis_status=str(report.get('status') or '')
              global_status=str(verdict.get('status') or '')
              if thesis_status and thesis_status != 'LIVE_HOLDOUT_CONFIRMED':
                  raise SystemExit(f'v3 thesis rejected: {thesis_status}')
              if global_status and global_status != 'GLOBAL_SCREENING_CONFIRMED':
                  raise SystemExit(f'global chronological screening rejected: {global_status}')
              if (
                  thesis_status == 'LIVE_HOLDOUT_CONFIRMED'
                  and report.get('safe_to_implement') is True
                  and model.get('status') == 'LIVE_HOLDOUT_CONFIRMED'
                  and global_status == 'GLOBAL_SCREENING_CONFIRMED'
              ):
                  print(json.dumps({
                      'thesis_status': thesis_status,
                      'global_screening': verdict,
                      'live_holdout': report.get('live_holdout'),
                  },indent=2,sort_keys=True))
                  break
              time.sleep(10)
          else:
              raise SystemExit('confirmed v3 prerequisites did not arrive')
          PY

      - name: Rebuild candidate from latest authoritative V12
        run: python scripts/e4_v12_promote_causal_candidate_v4.py
