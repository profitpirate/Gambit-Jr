name: V12 E4 Wallet Identity Inventory

on:
  push:
    branches:
      - codex/v12-production-hardening-20260920
    paths:
      - "scripts/v12_e4_wallet_identity_inventory.py"
      - "tests/test_v12_e4_wallet_identity_inventory.py"
      - ".github/workflows/v12-e4-wallet-identity-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v12-production-hardening-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev,research]
      - name: Validate wallet audit
        run: |
          ruff check scripts/v12_e4_wallet_identity_inventory.py tests/test_v12_e4_wallet_identity_inventory.py
          python -m pytest tests/test_v12_e4_wallet_identity_inventory.py -q
      - name: Audit every primary artifact head
        run: |
          python scripts/v12_e4_wallet_identity_inventory.py             --inventory research/e4-lifetime-artifact-inventory.json             --output research/e4-wallet-identity-inventory.json
      - name: Commit wallet identity evidence
        run: |
          git config user.name 'gambit-e4-wallet-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add research/e4-wallet-identity-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v12): reconcile historical E4 wallet identities'
            git pull --rebase origin codex/v12-production-hardening-20260920
            git push origin HEAD:codex/v12-production-hardening-20260920
          fi
      - name: Dispatch lifetime ledger rebuild
        run: gh workflow run v12-e4-lifetime-ledger.yml --ref codex/v12-production-hardening-20260920
