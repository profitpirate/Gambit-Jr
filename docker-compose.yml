services:
  bot:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file: .env
    volumes:
      - bot-data:/app/data
      - bot-evidence:/app/evidence
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  bot-data:
  bot-evidence:

