services:
  e4:
    build:
      context: .
      dockerfile: Dockerfile.e4-prod
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - .env.e4
    environment:
      E4_LIVE: "true"
      VAULT_TOKEN_FILE: /run/secrets/vault-token
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./run:/app/run
      - ./var:/app/var
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - vault_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9464/healthz', timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    command: ["python", "-m", "memecoin_bot.e4_exec", "run", "--live"]

secrets:
  vault_token:
    file: ${VAULT_TOKEN_HOST_PATH:?set VAULT_TOKEN_HOST_PATH}
