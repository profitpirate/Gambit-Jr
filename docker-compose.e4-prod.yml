services:
  e4:
    build:
      context: .
      dockerfile: Dockerfile.e4-prod
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "${E4_RUNTIME_UID:-1000}:${E4_RUNTIME_GID:-1000}"
    env_file:
      - .env.e4
    volumes:
      - ./data:/app/data
      - ${E4_KEYPAIR_HOST_PATH:?set E4_KEYPAIR_HOST_PATH}:/run/secrets/e4-solana-keypair.json:ro
    command: ["python", "-m", "memecoin_bot.e4_prod", "run", "--live"]
